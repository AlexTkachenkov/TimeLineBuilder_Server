<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timeline Builder - Hierarchical</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.2.0",
        "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
        "lucide-react": "https://esm.sh/lucide-react@0.263.1"
      }
    }
    </script>
</head>
<body class="bg-slate-50">
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import React, { useState, useRef, useEffect } from 'react';
        import { createRoot } from 'react-dom/client';
        import { Plus, Trash2, X, ChevronDown, ChevronUp, Calendar, Download, Printer, ArrowLeftRight, FileJson, Upload, Indent, Outdent } from 'lucide-react';

        // --- Rich Text Editor Component ---
        const RichTextEditor = ({ value, onChange, className, placeholder, singleLine = false }) => {
          const editorRef = useRef(null);

          useEffect(() => {
            if (editorRef.current && editorRef.current.innerHTML !== value) {
              if (document.activeElement !== editorRef.current) {
                 editorRef.current.innerHTML = value || '';
              }
            }
          }, [value]);

          const handleInput = (e) => {
            onChange(e.currentTarget.innerHTML);
          };

          const handleKeyDown = (e) => {
            if (singleLine && e.key === 'Enter') {
              e.preventDefault();
              return;
            }
          };

          return (
            <div
              ref={editorRef}
              contentEditable
              className={`${className} empty:before:content-[attr(data-placeholder)] empty:before:text-slate-300 cursor-text outline-none`}
              onInput={handleInput}
              onKeyDown={handleKeyDown}
              suppressContentEditableWarning={true}
              data-placeholder={placeholder}
              dir="auto"
            />
          );
        };

        // --- Extracted Components ---

        const NodeControls = ({ node, index, isSub, totalNodes, onIndent, onOutdent, onToggleSide, onMove, onDelete }) => (
            <div className="absolute left-2 top-2 flex flex-col gap-1 opacity-100 md:opacity-0 group-hover:opacity-100 transition-opacity z-20 no-print bg-white/95 p-1 rounded shadow-sm border backdrop-blur-sm">
               <div className="flex gap-1">
                   {/* Indent/Outdent Controls */}
                   {isSub ? (
                       <button onClick={() => onOutdent(index)} className="p-1.5 text-slate-400 hover:text-orange-600 hover:bg-orange-50 rounded" title="Promote to Main Event">
                          <Outdent size={14} />
                       </button>
                   ) : (
                       <button onClick={() => onIndent(index)} className="p-1.5 text-slate-400 hover:text-blue-600 hover:bg-blue-50 rounded" title="Demote to Sub-Event">
                          <Indent size={14} />
                       </button>
                   )}
                   <button onClick={() => onToggleSide(node.id)} className="p-1.5 text-slate-400 hover:text-blue-600 hover:bg-blue-50 rounded" title="Switch Side">
                      <ArrowLeftRight size={14} />
                   </button>
               </div>
               <div className="w-full h-px bg-slate-100 my-0.5"></div>
               <div className="flex gap-1">
                  <button onClick={() => onMove(index, 'up')} disabled={index === 0} className="p-1.5 text-slate-400 hover:text-blue-600 hover:bg-slate-50 rounded disabled:opacity-30"><ChevronUp size={14} /></button>
                  <button onClick={() => onMove(index, 'down')} disabled={index === totalNodes - 1} className="p-1.5 text-slate-400 hover:text-blue-600 hover:bg-slate-50 rounded disabled:opacity-30"><ChevronDown size={14} /></button>
                  <button onClick={() => onDelete(node.id)} className="p-1.5 text-slate-400 hover:text-red-500 hover:bg-red-50 rounded ml-1"><Trash2 size={14} /></button>
              </div>
            </div>
        );

        const SubNodeRenderer = ({ node, index, totalNodes, onUpdate, onDelete, onToggleDate, onIndent, onOutdent, onToggleSide, onMove }) => {
            return (
              <div className="relative p-4 border-t border-slate-200 bg-white first:border-t-0 group/sub hover:bg-slate-50/50 transition-colors">
                 {/* Visual Hierarchy Line */}
                 <div className="absolute right-0 top-0 bottom-0 w-[4px] bg-slate-200 group-hover/sub:bg-blue-300 transition-colors"></div>
                 
                 <NodeControls 
                    node={node} 
                    index={index} 
                    isSub={true}
                    totalNodes={totalNodes}
                    onIndent={onIndent}
                    onOutdent={onOutdent}
                    onToggleSide={onToggleSide}
                    onMove={onMove}
                    onDelete={onDelete}
                 />

                 <div className="space-y-2 relative z-10">
                     {/* Date Row */}
                     {node.date !== null && (
                         <input
                             type="text"
                             value={node.date}
                             onChange={(e) => onUpdate(node.id, 'date', e.target.value)}
                             className="w-full font-semibold uppercase tracking-wider bg-transparent border-none focus:outline-none placeholder-blue-300 text-xs text-blue-600"
                             placeholder="תאריך / זמן..."
                         />
                     )}
                     
                     {/* Title */}
                     <RichTextEditor
                         value={node.title}
                         onChange={(val) => onUpdate(node.id, 'title', val)}
                         singleLine={true}
                         className="w-full font-bold text-slate-800 text-lg border-b border-transparent hover:border-slate-200 focus:border-blue-500 transition-colors py-1"
                         placeholder="כותרת תת-אירוע..."
                     />
                     
                     {/* Content */}
                     <RichTextEditor
                         value={node.content}
                         onChange={(val) => onUpdate(node.id, 'content', val)}
                         className="w-full text-slate-600 text-sm min-h-[20px]"
                         placeholder="תיאור..."
                     />
                 </div>
                 
                 {/* Mini Actions for Subnode */}
                 <div className="mt-3 pt-2 flex justify-start items-center gap-2 no-print opacity-0 group-hover/sub:opacity-100 transition-opacity">
                     <button onClick={() => onToggleDate(node.id)} className={`p-1.5 rounded-full transition-colors ${node.date !== null ? 'text-blue-600 bg-blue-50' : 'text-slate-300 hover:text-blue-500'}`}><Calendar size={14} /></button>
                 </div>
              </div>
            );
        };


        const TimelineApp = () => {
          const fileInputRef = useRef(null);

          // --- State with LocalStorage Persistence ---
          const [nodes, setNodes] = useState(() => {
            try {
              const saved = localStorage.getItem('timeline_nodes');
              if (saved) {
                let parsed = JSON.parse(saved);
                return parsed.map((n, i) => ({
                     ...n, 
                     side: n.side || (i % 2 === 0 ? 'right' : 'left'),
                     type: 'event',
                     isSub: n.isSub || false
                }));
              }
            } catch (e) {
              console.error("Failed to load from local storage", e);
            }
            // Default initial state
            return [
                {
                  id: 'init-1',
                  type: 'event',
                  side: 'right',
                  title: 'תחילת הפרויקט',
                  date: 'ינואר 2024',
                  content: 'אירוע ראשי המכיל תתי-אירועים מתחתיו.',
                  isSub: false
                },
                {
                  id: 'init-2',
                  type: 'event',
                  side: 'right',
                  title: 'מחקר ראשוני',
                  date: 'פברואר 2024',
                  content: 'זהו תת-אירוע המקושר לאירוע מעליו, אך נראה כעת זהה לו.',
                  isSub: true 
                },
                {
                  id: 'init-3',
                  type: 'event',
                  side: 'right',
                  title: 'גיוס עובדים',
                  date: '',
                  content: 'עוד תת-אירוע ברשימה.',
                  isSub: true 
                }
            ];
          });

          useEffect(() => {
            localStorage.setItem('timeline_nodes', JSON.stringify(nodes));
          }, [nodes]);

          // Load external libraries
          useEffect(() => {
            const loadScript = (src, id) => {
                if (!document.getElementById(id)) {
                    const script = document.createElement('script');
                    script.src = src;
                    script.id = id;
                    script.async = true;
                    document.body.appendChild(script);
                }
            };
            loadScript("https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js", "html2canvas-script");
            loadScript("https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js", "jspdf-script");
          }, []);

          const generateId = () => Math.random().toString(36).substr(2, 9);

          // --- Grouping Logic for Rendering ---
          const getRenderGroups = () => {
            const groups = [];
            let currentGroup = null;

            nodes.forEach((node, index) => {
                if (node.isSub && currentGroup) {
                    currentGroup.children.push({ ...node, originalIndex: index });
                } else {
                    if (currentGroup) groups.push(currentGroup);
                    currentGroup = { 
                        type: 'group', 
                        main: { ...node, originalIndex: index }, 
                        children: [] 
                    };
                }
            });
            if (currentGroup) groups.push(currentGroup);
            return groups;
          };

          const renderGroups = getRenderGroups();

          // --- Node Operations ---

          const addNode = (index) => {
            const prevNode = index > 0 ? nodes[index - 1] : null;
            const prevSide = prevNode ? prevNode.side : 'left';
            const newSide = prevSide === 'right' ? 'left' : 'right';

            const newNode = {
              id: generateId(),
              type: 'event',
              side: newSide,
              title: 'אירוע חדש',
              date: '',
              content: '',
              isSub: false
            };
            const newNodes = [...nodes];
            newNodes.splice(index, 0, newNode);
            setNodes(newNodes);
          };

          const deleteNode = (id) => {
            if (nodes.length <= 1) return;
            setNodes(nodes.filter(n => n.id !== id));
          };

          const moveNode = (index, direction) => {
            if (direction === 'up' && index === 0) return;
            if (direction === 'down' && index === nodes.length - 1) return;

            const newNodes = [...nodes];
            const targetIndex = direction === 'up' ? index - 1 : index + 1;
            
            // Swap
            const temp = newNodes[index];
            newNodes[index] = newNodes[targetIndex];
            newNodes[targetIndex] = temp;
            setNodes(newNodes);
          };

          const updateNode = (id, field, value) => {
            setNodes(nodes.map(n => n.id === id ? { ...n, [field]: value } : n));
          };

          const indentNode = (index) => {
              const newNodes = [...nodes];
              newNodes[index] = { ...newNodes[index], isSub: true };
              setNodes(newNodes);
          };

          const outdentNode = (index) => {
              const newNodes = [...nodes];
              newNodes[index] = { ...newNodes[index], isSub: false };
              setNodes(newNodes);
          };

          const toggleNodeSide = (id) => {
              setNodes(nodes.map(n => 
                n.id === id ? { ...n, side: n.side === 'right' ? 'left' : 'right' } : n
              ));
          };

          const toggleDate = (id) => {
            setNodes(nodes.map(n => {
                if (n.id === id) {
                    return { ...n, date: n.date === null ? '' : (n.date !== undefined && n.date !== null ? null : '') };
                }
                return n;
            }));
          };

          // --- Export Handlers ---
          const handleExportImage = async () => {
            if (window.html2canvas) {
                const element = document.getElementById('timeline-content');
                const originalBg = element.style.backgroundColor;
                element.style.backgroundColor = '#f8fafc'; 
                try {
                    const canvas = await window.html2canvas(element, {
                        backgroundColor: '#f8fafc',
                        scale: 2,
                        useCORS: true,
                        ignoreElements: (element) => element.classList.contains('no-print')
                    });
                    const link = document.createElement('a');
                    link.download = 'timeline.png';
                    link.href = canvas.toDataURL();
                    link.click();
                } finally {
                    element.style.backgroundColor = originalBg;
                }
            } else { alert("Loading libraries..."); }
          };

          const handleExportPDF = async () => {
              if (window.html2canvas && window.jspdf) {
                const { jsPDF } = window.jspdf;
                const element = document.getElementById('timeline-content');
                const originalBg = element.style.backgroundColor;
                element.style.backgroundColor = '#ffffff';
                try {
                    const canvas = await window.html2canvas(element, {
                        backgroundColor: '#ffffff',
                        scale: 2,
                        useCORS: true,
                        ignoreElements: (element) => element.classList.contains('no-print')
                    });
                    const imgData = canvas.toDataURL('image/png');
                    const pdf = new jsPDF('p', 'mm', 'a4');
                    const pdfWidth = pdf.internal.pageSize.getWidth();
                    const pdfHeight = pdf.internal.pageSize.getHeight();
                    const imgProps = pdf.getImageProperties(imgData);
                    const imgHeight = (imgProps.height * pdfWidth) / imgProps.width;
                    
                    if (imgHeight > pdfHeight) {
                         const customPdf = new jsPDF('p', 'mm', [pdfWidth, imgHeight + 20]);
                         customPdf.addImage(imgData, 'PNG', 0, 0, pdfWidth, imgHeight);
                         customPdf.save('timeline.pdf');
                    } else {
                         pdf.addImage(imgData, 'PNG', 0, 0, pdfWidth, imgHeight);
                         pdf.save('timeline.pdf');
                    }
                } finally {
                    element.style.backgroundColor = originalBg;
                }
              } else { alert("PDF library loading..."); }
          };

          const handleSaveTemplate = () => {
              const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(nodes));
              const downloadAnchorNode = document.createElement('a');
              downloadAnchorNode.setAttribute("href", dataStr);
              downloadAnchorNode.setAttribute("download", "timeline_template.json");
              document.body.appendChild(downloadAnchorNode);
              downloadAnchorNode.click();
              downloadAnchorNode.remove();
          };

          const handleLoadTemplateClick = () => { fileInputRef.current.click(); };

          const handleFileChange = (e) => {
              const fileReader = new FileReader();
              fileReader.readAsText(e.target.files[0], "UTF-8");
              fileReader.onload = e => {
                  try {
                      const parsed = JSON.parse(e.target.result);
                      if (Array.isArray(parsed)) setNodes(parsed);
                      else alert("Invalid file format");
                  } catch (err) { alert("Error parsing file"); }
              };
              e.target.value = null; 
          };

          return (
            <div className="min-h-screen bg-slate-50 text-slate-800 p-4 md:p-8 font-sans" dir="rtl">
              <style>{`
                @media print {
                  .no-print { display: none !important; }
                  body { background-color: white; }
                  .print-break-inside-avoid { break-inside: avoid; }
                }
              `}</style>

              <div className="max-w-4xl mx-auto" id="timeline-content">
                
                {/* Header */}
                <header className="mb-12 text-center relative group">
                  <h1 className="text-3xl font-bold text-slate-900 mb-2">בונה רצף זמנים היררכי</h1>
                  <p className="text-slate-500 mb-6">ציר זמן היררכי. השתמשו ב-Ctrl+B/I/U לעיצוב.</p>
                  
                  {/* Export Controls */}
                  <div className="flex flex-wrap justify-center gap-3 no-print">
                    <input type="file" ref={fileInputRef} onChange={handleFileChange} style={{display: 'none'}} accept=".json" />
                    <button onClick={handleSaveTemplate} className="btn-tool"><FileJson size={14} /> שמור תבנית</button>
                    <button onClick={handleLoadTemplateClick} className="btn-tool"><Upload size={14} /> טען תבנית</button>
                    <div className="w-px h-8 bg-slate-200 mx-1"></div>
                    <button onClick={handleExportPDF} className="btn-tool hover:text-red-600 hover:border-red-300"><Printer size={14} /> PDF</button>
                    <button onClick={handleExportImage} className="btn-tool hover:text-blue-600 hover:border-blue-300"><Download size={14} /> תמונה</button>
                  </div>
                </header>

                <div className="relative pb-24"> 
                  {/* Central Line */}
                  <div className="absolute right-8 md:right-1/2 top-0 bottom-0 w-1 bg-slate-200 -mr-0.5 z-0"></div>

                  {/* Add Start Button */}
                  <div className="relative z-10 flex justify-center mb-12 pr-16 md:pr-0 no-print">
                     <div className="absolute right-8 md:right-1/2 translate-x-1/2 -mr-0.5 transform"> 
                        <button onClick={() => addNode(0)} className="add-btn-main" title="הוסף התחלה"><Plus size={20} /></button>
                     </div>
                  </div>

                  {/* Render Groups Loop */}
                  <div className="space-y-0 pt-2">
                    {renderGroups.map((group, groupIndex) => {
                      const mainNode = group.main;
                      const children = group.children || [];
                      const index = mainNode.originalIndex;
                      const isRightSide = mainNode.side === 'right';
                      const layoutClass = isRightSide ? 'md:flex-row-reverse' : 'md:flex-row';

                      return (
                      <div key={mainNode.id} className="relative group print-break-inside-avoid">
                        {/* Dot */}
                        <div className="absolute right-8 md:right-1/2 rounded-full -mr-2 z-10 shadow-sm transition-all w-4 h-4 bg-white border-4 border-blue-500 top-8 group-hover:scale-125"></div>

                        <div className={`flex flex-col md:flex-row items-start ${layoutClass} mb-4 transition-all duration-500`}>
                          <div className="hidden md:block w-1/2" /> {/* Spacer */}
                          
                          {/* Card Container */}
                          <div className={`w-full md:w-1/2 pr-16 md:pr-0 pb-4 ${isRightSide ? 'md:pr-8' : 'md:pl-8'}`}>
                            <div className="bg-white rounded-xl shadow-sm border border-slate-200 relative hover:shadow-md transition-all overflow-hidden">
                              
                              {/* Main Node Content */}
                              <div className="p-4 pb-2 relative z-10 bg-white">
                                <NodeControls 
                                    node={mainNode} 
                                    index={index} 
                                    isSub={false} 
                                    totalNodes={nodes.length}
                                    onIndent={indentNode}
                                    onOutdent={outdentNode}
                                    onToggleSide={toggleNodeSide}
                                    onMove={moveNode}
                                    onDelete={deleteNode}
                                />
                                
                                <div className="space-y-2">
                                    {mainNode.date !== null && (
                                        <input type="text" value={mainNode.date} onChange={(e) => updateNode(mainNode.id, 'date', e.target.value)} className="w-full font-semibold uppercase tracking-wider bg-transparent border-none focus:outline-none placeholder-blue-300 text-xs text-blue-600" placeholder="תאריך / זמן..." />
                                    )}
                                    <RichTextEditor value={mainNode.title} onChange={(val) => updateNode(mainNode.id, 'title', val)} singleLine={true} className="w-full font-bold text-slate-800 text-lg border-b border-transparent hover:border-slate-200 focus:border-blue-500 transition-colors py-1" placeholder="כותרת האירוע..." />
                                    <RichTextEditor value={mainNode.content} onChange={(val) => updateNode(mainNode.id, 'content', val)} className="w-full text-slate-600 text-sm min-h-[40px]" placeholder="תיאור מה שקורה כאן..." />
                                </div>

                                {/* Main Actions */}
                                <div className="mt-3 pt-2 border-t border-slate-100 flex justify-between items-center no-print">
                                    <div className="flex items-center gap-2">
                                        <button onClick={() => toggleDate(mainNode.id)} className={`p-1.5 rounded-full transition-colors ${mainNode.date !== null ? 'text-blue-600 bg-blue-50' : 'text-slate-400 hover:text-blue-500'}`}><Calendar size={14} /></button>
                                    </div>
                                </div>
                              </div>

                              {/* RENDER SUB-NODES (CONCATENATED) */}
                              {children.length > 0 && (
                                  <div className="border-t border-slate-200">
                                      {children.map((child) => (
                                          <SubNodeRenderer 
                                            key={child.id} 
                                            node={child} 
                                            index={child.originalIndex}
                                            totalNodes={nodes.length}
                                            onUpdate={updateNode}
                                            onDelete={deleteNode}
                                            onToggleDate={toggleDate}
                                            onIndent={indentNode}
                                            onOutdent={outdentNode}
                                            onToggleSide={toggleNodeSide}
                                            onMove={moveNode}
                                          />
                                      ))}
                                  </div>
                              )}
                            </div>
                          </div>
                        </div>

                        {/* Add Button Logic - Determine next index */}
                        <AddButtonOverlay index={index + children.length + 1} onClick={() => addNode(index + children.length + 1)} />
                      </div>
                    )})}
                  </div>

                  <div className="relative z-10 flex justify-center mt-8 pr-16 md:pr-0 no-print">
                     <div className="absolute right-8 md:right-1/2 translate-x-1/2 -mr-0.5 transform">
                        <button onClick={() => addNode(nodes.length)} className="add-btn-main" title="הוסף סיום"><Plus size={20} /></button>
                    </div>
                  </div>
                </div>
              </div>

              {/* Helper Styles for Buttons */}
              <style>{`
                .btn-tool { @apply flex items-center gap-2 px-3 py-2 bg-white border border-slate-200 rounded-lg text-slate-600 shadow-sm transition-all text-xs hover:border-green-300 hover:text-green-600; }
                .add-btn-main { @apply group flex items-center justify-center bg-slate-100 hover:bg-blue-600 hover:text-white text-slate-500 w-10 h-10 rounded-full shadow-sm transition-all border border-slate-200 hover:scale-110; }
              `}</style>
            </div>
          );
        };

        // Helper for the "Add (+)" line hover effect
        const AddButtonOverlay = ({ index, onClick }) => (
            <div className="absolute top-full left-0 right-0 h-8 -mt-4 z-10 pointer-events-none no-print">
                <div className="absolute right-8 md:right-1/2 w-12 h-12 -mr-6 cursor-pointer pointer-events-auto flex items-center justify-center group/add" onClick={onClick}>
                    <div className="w-4 h-4 bg-blue-500 rounded-full shadow-lg transform scale-0 group-hover/add:scale-100 transition-transform duration-200 flex items-center justify-center">
                        <Plus size={10} className="text-white" />
                    </div>
                </div>
            </div>
        );

        // --- MOUNTING LOGIC ---
        const root = createRoot(document.getElementById('root'));
        root.render(<TimelineApp />);
    </script>
</body>
</html>
