<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>💪 Pushup Tracker</title>

<script src="https://cdn.jsdelivr.net/npm/gun/gun.js"></script>

<style>
body {
  font-family: sans-serif;
  background:#0a0a0a;
  color:#fff;
  text-align:center;
}
button { padding:10px; margin:5px; }
.player { margin:10px; }
</style>
</head>
<body>

<h1>💪 PUSHUP TRACKER</h1>

<div id="setup">
  <input id="name" placeholder="Your name"><br><br>
  <button id="createBtn">Create Room</button><br><br>

  <input id="room" placeholder="Room code">
  <button id="joinBtn">Join</button>
</div>

<div id="game" style="display:none;">
  <h2>Room: <span id="roomCode"></span></h2>
  <button id="addAll">+1 ALL</button>
  <div id="players"></div>
</div>

<script>
const gun = Gun({
  peers: ['?local ip here?'  ]
});

let roomRef;
let myNode;
let myId;
let myName;
let state = {}; // id -> {name, count}

// ---------- utils ----------
function genCode() {
  return Math.random().toString(36).substring(2,7).toUpperCase();
}

// ---------- room ----------
function enterRoom(code) {
  document.getElementById('setup').style.display = 'none';
  document.getElementById('game').style.display = 'block';
  document.getElementById('roomCode').textContent = code;

  roomRef = gun.get('room_' + code);

  // unique player
  myId = 'p_' + Date.now() + '_' + Math.random().toString(36).slice(2);
  myNode = gun.get(myId);

  myNode.put({
    id: myId,
    name: myName,
    count: 0
  });

  roomRef.set(myNode);

  // subscribe
  roomRef.map().on((data) => {
    if (!data || !data.id) return;

    const id = data.id;
    const name = data.name || 'anon';
    const count = parseInt(data.count) || 0;

    state[id] = { name, count };
    render();
  });
}

// ---------- UI ----------
function render() {
  const div = document.getElementById('players');
  div.innerHTML = '';

  Object.entries(state).forEach(([id, p]) => {
    const el = document.createElement('div');
    el.className = 'player';

    el.innerHTML = `
      <b>${p.name}</b> : ${p.count}
      <button onclick="minus('${id}')">-</button>
    `;

    div.appendChild(el);
  });
}

// ---------- actions ----------
function addAll() {
  Object.keys(state).forEach(id => {
    const p = state[id];
    gun.get(id).get('count').put(p.count + 1);
  });
}

function minus(id) {
  const p = state[id];
  if (p.count <= 0) return;
  gun.get(id).get('count').put(p.count - 1);
}

// ---------- events ----------
document.getElementById('createBtn').onclick = () => {
  myName = document.getElementById('name').value.trim();
  if (!myName) return;

  enterRoom(genCode());
};

document.getElementById('joinBtn').onclick = () => {
  myName = document.getElementById('name').value.trim();
  const code = document.getElementById('room').value.trim().toUpperCase();

  if (!myName || !code) return;

  enterRoom(code);
};

document.getElementById('addAll').onclick = addAll;
</script>

</body>
</html>
