<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Math Mastery - Power Game</title>
    
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    
    <!-- Babel standalone to compile JSX in the browser -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        /* Prevents pull-to-refresh and selection on mobile */
        body { overscroll-behavior-y: contain; user-select: none; -webkit-user-select: none; }
    </style>
</head>
<body class="bg-slate-100 h-[100dvh] overflow-hidden text-slate-900 font-sans box-border">
    <div id="root" class="h-full w-full p-2 md:p-6 flex items-center justify-center"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- Inline Icons ---
        const Icon = ({ path, className = "w-6 h-6", color = "currentColor" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <g dangerouslySetInnerHTML={{ __html: path }} />
            </svg>
        );
        const Timer = (props) => <Icon path='<line x1="10" x2="14" y1="2" y2="2"/><line x1="12" x2="15" y1="14" y2="11"/><circle cx="12" cy="14" r="8"/>' {...props} />;
        const Zap = (props) => <Icon path='<polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>' {...props} />;
        const CheckCircle2 = (props) => <Icon path='<circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/>' {...props} />;
        const XCircle = (props) => <Icon path='<circle cx="12" cy="12" r="10"/><path d="m15 9-6 6"/><path d="m9 9 6 6"/>' {...props} />;
        const RotateCcw = (props) => <Icon path='<path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/>' {...props} />;
        const Trophy = (props) => <Icon path='<path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/>' {...props} />;
        const Settings = (props) => <Icon path='<path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/>' {...props} />;
        const Activity = (props) => <Icon path='<path d="M22 12h-4l-3 9L9 3l-3 9H2"/>' {...props} />;
        const FastForward = (props) => <Icon path='<polygon points="13 19 22 12 13 5 13 19"/><polygon points="2 19 11 12 2 5 2 19"/>' {...props} />;

        const generateBaseNumber = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;

        function MathGame() {
            const [gameState, setGameState] = useState('menu'); 
            const [mode, setMode] = useState('power');
            const [gameDurationType, setGameDurationType] = useState('time');
            const [timeLimit, setTimeLimit] = useState(60);
            const [exerciseCeiling, setExerciseCeiling] = useState(10);
            const [exercisesDone, setExercisesDone] = useState(0);

            const [powerMin, setPowerMin] = useState(2);
            const [powerMax, setPowerMax] = useState(2);
            const [baseMin, setBaseMin] = useState(1);
            const [baseMax, setBaseMax] = useState(20);

            const [score, setScore] = useState(0);
            const [timeLeft, setTimeLeft] = useState(0);
            const [currentQuestion, setCurrentQuestion] = useState(null);
            const [inputValue, setInputValue] = useState('');
            const [history, setHistory] = useState([]);
            
            const [feedback, setFeedback] = useState(null);
            const [isPaused, setIsPaused] = useState(false);

            const gameContainerRef = useRef(null);

            // Auto-focus the game container to capture physical keyboard input seamlessly
            useEffect(() => {
                if (gameState === 'playing' && gameContainerRef.current) {
                    gameContainerRef.current.focus();
                }
            }, [gameState, currentQuestion, isPaused]);

            // Timer Logic
            useEffect(() => {
                let timer;
                if (gameState === 'playing' && gameDurationType === 'time' && timeLeft > 0 && !isPaused) {
                    timer = setInterval(() => {
                        setTimeLeft((prev) => {
                            if (prev <= 1) {
                                endGame();
                                return 0;
                            }
                            return prev - 1;
                        });
                    }, 1000);
                }
                return () => clearInterval(timer);
            }, [gameState, timeLeft, gameDurationType, isPaused]);

            const generateQuestion = () => {
                const base = generateBaseNumber(baseMin, baseMax);
                const power = Math.floor(Math.random() * (powerMax - powerMin + 1)) + powerMin;
                setCurrentQuestion({ base, power, answer: Math.pow(base, power) });
            };

            const startGame = () => {
                setScore(0);
                if (gameDurationType === 'time') setTimeLeft(timeLimit);
                setExercisesDone(0);
                setHistory([]);
                setFeedback(null);
                setInputValue('');
                setIsPaused(false);
                generateQuestion();
                setGameState('playing');
            };

            const endGame = () => setGameState('summary');

            const handleBaseMinChange = (e) => { const val = parseInt(e.target.value) || 1; setBaseMin(val); if (val > baseMax) setBaseMax(val); };
            const handleBaseMaxChange = (e) => { const val = parseInt(e.target.value) || 1; setBaseMax(val); if (val < baseMin) setBaseMin(val); };
            const handlePowerMinChange = (e) => { const val = parseInt(e.target.value) || 1; setPowerMin(val); if (val > powerMax) setPowerMax(val); };
            const handlePowerMaxChange = (e) => { const val = parseInt(e.target.value) || 1; setPowerMax(val); if (val < powerMin) setPowerMin(val); };

            const handleSubmit = () => {
                // If paused (Practice mode wait), advance immediately
                if (isPaused && gameDurationType === 'ceiling') {
                    setIsPaused(false);
                    setFeedback(null);
                    setInputValue('');
                    if (exercisesDone + 1 >= exerciseCeiling) endGame();
                    else { setExercisesDone(prev => prev + 1); generateQuestion(); }
                    setTimeout(() => gameContainerRef.current?.focus(), 0);
                    return;
                }

                if (!currentQuestion) return;

                const isSkip = !inputValue.trim();
                const userAnswer = isSkip ? 'Skip' : parseInt(inputValue, 10);
                const isCorrect = !isSkip && (userAnswer === currentQuestion.answer);

                if (isCorrect) {
                    setScore(s => s + 1);
                    setFeedback('correct');
                } else {
                    setFeedback(isSkip ? 'skip' : 'incorrect');
                }

                setHistory(prev => [...prev, { ...currentQuestion, userAnswer, isCorrect, isSkip }]);

                if (gameDurationType === 'ceiling') {
                    setIsPaused(true);
                } else {
                    setTimeout(() => setFeedback(null), 300);
                    setInputValue('');
                    generateQuestion();
                }
            };

            const handleNumpadInput = (val) => {
                if (isPaused && gameDurationType === 'ceiling') {
                    if (val === 'enter') handleSubmit();
                    return;
                }
                if (val === 'del') {
                    setInputValue(prev => prev.slice(0, -1));
                } else if (val === 'enter') {
                    handleSubmit();
                } else {
                    if (inputValue.length < 9) setInputValue(prev => prev + val);
                }
            };

            const handleKeyDown = (e) => {
                if (e.key === 'Enter' || e.key === ' ' || e.code === 'Space') {
                    e.preventDefault();
                    handleSubmit();
                } else if (!isPaused) {
                    if (e.key >= '0' && e.key <= '9') {
                        setInputValue(prev => prev + e.key);
                    } else if (e.key === 'Backspace') {
                        setInputValue(prev => prev.slice(0, -1));
                    }
                }
            };

            // ---- MENU SCREEN ----
            const renderMenu = () => (
                <div className="w-full max-w-md bg-white rounded-3xl shadow-xl flex flex-col h-full max-h-screen border border-slate-100 overflow-hidden">
                    <div className="bg-indigo-600 p-4 text-center text-white shrink-0">
                        <div className="flex items-center justify-center gap-2">
                            <Zap className="w-6 h-6 text-indigo-200" />
                            <h1 className="text-2xl font-extrabold tracking-tight">Math Mastery</h1>
                        </div>
                        <p className="text-indigo-200 mt-1 text-xs md:text-sm">Test your mental calculation limits</p>
                    </div>

                    {/* Compacted Settings Body */}
                    <div className="p-4 space-y-4 overflow-y-auto flex-grow flex flex-col">
                        
                        <section>
                            <h2 className="text-sm font-bold text-slate-800 mb-2 flex items-center gap-1.5"><Activity className="w-4 h-4 text-indigo-500" /> Game Mode</h2>
                            <div className="grid grid-cols-2 gap-2">
                                <button className={`p-2 rounded-lg border-2 font-semibold text-xs transition-all ${mode === 'power' ? 'border-indigo-600 bg-indigo-50 text-indigo-700' : 'border-slate-200 text-slate-500 hover:border-slate-300'}`} onClick={() => setMode('power')}>Power</button>
                                <button disabled className="p-2 rounded-lg border-2 border-slate-100 bg-slate-50 text-slate-400 font-semibold text-xs cursor-not-allowed">Root (Soon)</button>
                                <button disabled className="p-2 rounded-lg border-2 border-slate-100 bg-slate-50 text-slate-400 font-semibold text-xs cursor-not-allowed">Surv. Power</button>
                                <button disabled className="p-2 rounded-lg border-2 border-slate-100 bg-slate-50 text-slate-400 font-semibold text-xs cursor-not-allowed">Surv. Root</button>
                            </div>
                        </section>

                        <section className="bg-slate-50 p-3 rounded-xl border border-slate-100">
                            <h2 className="text-sm font-bold text-slate-800 mb-2 flex items-center gap-1.5"><Timer className="w-4 h-4 text-indigo-500" /> Game Format</h2>
                            <div className="flex gap-2 mb-3">
                                <button className={`flex-1 p-2 rounded-lg border-2 font-semibold text-xs transition-all ${gameDurationType === 'time' ? 'border-indigo-600 bg-indigo-100 text-indigo-700 shadow-sm' : 'border-white bg-white text-slate-500 hover:border-slate-200 shadow-sm'}`} onClick={() => setGameDurationType('time')}>Time Limit</button>
                                <button className={`flex-1 p-2 rounded-lg border-2 font-semibold text-xs transition-all ${gameDurationType === 'ceiling' ? 'border-indigo-600 bg-indigo-100 text-indigo-700 shadow-sm' : 'border-white bg-white text-slate-500 hover:border-slate-200 shadow-sm'}`} onClick={() => setGameDurationType('ceiling')}>Fixed Qs</button>
                            </div>

                            <div className="flex gap-2">
                                {gameDurationType === 'time' ? 
                                    [30, 60, 120].map(time => (
                                        <button key={time} onClick={() => setTimeLimit(time)} className={`flex-1 py-1.5 px-1 rounded-lg border-2 font-semibold text-xs transition-all ${timeLimit === time ? 'border-indigo-600 bg-indigo-50 text-indigo-700' : 'border-slate-200 bg-white text-slate-600'}`}>
                                            {time === 60 ? '1 min' : time === 120 ? '2 min' : '30 sec'}
                                        </button>
                                    )) : 
                                    [10, 20, 50].map(amount => (
                                        <button key={amount} onClick={() => setExerciseCeiling(amount)} className={`flex-1 py-1.5 px-1 rounded-lg border-2 font-semibold text-xs transition-all ${exerciseCeiling === amount ? 'border-indigo-600 bg-indigo-50 text-indigo-700' : 'border-slate-200 bg-white text-slate-600'}`}>
                                            {amount} Qs
                                        </button>
                                    ))
                                }
                            </div>
                        </section>

                        <section className="bg-slate-50 p-3 rounded-xl border border-slate-100 flex-grow">
                            <h2 className="text-sm font-bold text-slate-800 mb-3 flex items-center gap-1.5"><Settings className="w-4 h-4 text-indigo-500" /> Number Ranges</h2>
                            
                            <div className="space-y-3">
                                <div className="flex items-center gap-2">
                                    <span className="text-xs font-semibold text-slate-500 w-10">Base:</span>
                                    <input type="number" min="1" value={baseMin} onChange={handleBaseMinChange} className="w-full py-1.5 px-2 text-sm font-bold text-center rounded border-2 border-slate-200 focus:border-indigo-500 outline-none"/>
                                    <span className="text-slate-400 text-xs font-bold">to</span>
                                    <input type="number" min="1" value={baseMax} onChange={handleBaseMaxChange} className="w-full py-1.5 px-2 text-sm font-bold text-center rounded border-2 border-slate-200 focus:border-indigo-500 outline-none"/>
                                </div>
                                <div className="flex items-center gap-2">
                                    <span className="text-xs font-semibold text-slate-500 w-10">Power:</span>
                                    <input type="number" min="1" max="10" value={powerMin} onChange={handlePowerMinChange} className="w-full py-1.5 px-2 text-sm font-bold text-center rounded border-2 border-slate-200 focus:border-indigo-500 outline-none"/>
                                    <span className="text-slate-400 text-xs font-bold">to</span>
                                    <input type="number" min="1" max="10" value={powerMax} onChange={handlePowerMaxChange} className="w-full py-1.5 px-2 text-sm font-bold text-center rounded border-2 border-slate-200 focus:border-indigo-500 outline-none"/>
                                </div>
                            </div>
                        </section>

                        <div className="shrink-0 mt-auto pt-2">
                            <button onClick={startGame} className="w-full py-3.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl font-bold text-lg shadow-lg shadow-indigo-200 transition-all active:scale-95">
                                Start Game
                            </button>
                        </div>
                    </div>
                </div>
            );

            // ---- PLAYING SCREEN ----
            const renderPlaying = () => {
                if (!currentQuestion) return null;

                let inputBorderColor = 'border-slate-300 focus:border-indigo-500';
                let inputBgColor = 'bg-slate-50';
                if (feedback === 'correct') {
                    inputBorderColor = 'border-emerald-500';
                    inputBgColor = 'bg-emerald-50';
                } else if (feedback === 'incorrect' || feedback === 'skip') {
                    inputBorderColor = 'border-red-500';
                    inputBgColor = 'bg-red-50';
                }

                return (
                <div 
                    ref={gameContainerRef}
                    tabIndex={0}
                    onKeyDown={handleKeyDown}
                    className="w-full max-w-md mx-auto flex flex-col h-full outline-none"
                >
                    {/* Top HUD */}
                    <div className="flex justify-between items-center bg-white p-3 rounded-2xl shadow-sm border border-slate-100 mb-3 shrink-0">
                        <div className="flex items-center gap-2 text-slate-600">
                            {gameDurationType === 'time' ? (
                                <>
                                    <Timer className={`w-5 h-5 ${timeLeft <= 10 ? 'text-red-500 animate-pulse' : 'text-indigo-500'}`} />
                                    <span className={`text-xl font-mono font-bold ${timeLeft <= 10 ? 'text-red-500' : ''}`}>
                                        {Math.floor(timeLeft / 60)}:{(timeLeft % 60).toString().padStart(2, '0')}
                                    </span>
                                </>
                            ) : (
                                <>
                                    <Activity className="w-5 h-5 text-indigo-500" />
                                    <span className="text-lg font-bold">Q: {exercisesDone + 1}/{exerciseCeiling}</span>
                                </>
                            )}
                        </div>
                        <div className="flex items-center gap-1.5 text-slate-600">
                            <span className="text-xl font-mono font-bold text-emerald-500">{score}</span>
                            <Trophy className="w-5 h-5 text-yellow-500" />
                        </div>
                    </div>

                    {/* Question Card */}
                    <div className="flex-grow flex flex-col justify-center min-h-[220px]">
                        <div className="bg-white px-6 py-8 rounded-3xl shadow-xl border border-slate-100 text-center relative overflow-hidden flex flex-col items-center">
                            
                            {/* Progress Bar */}
                            <div className="absolute top-0 left-0 w-full h-1.5 bg-indigo-100">
                                <div 
                                className={`h-full bg-indigo-500 transition-all ${gameDurationType === 'time' ? 'duration-1000' : 'duration-500'} linear`}
                                style={{ width: `${gameDurationType === 'time' ? (timeLeft / timeLimit) * 100 : (exercisesDone / exerciseCeiling) * 100}%` }}
                                />
                            </div>
                            
                            <div className="mb-6 flex justify-center items-start text-6xl font-black text-slate-800">
                                {currentQuestion.base}
                                <sup className="text-3xl text-indigo-600 ml-1 mt-2">{currentQuestion.power}</sup>
                            </div>

                            {/* Simulated Input Field (Prevents native keyboard) */}
                            <div className={`w-full max-w-[240px] text-center text-4xl font-bold py-3 rounded-2xl border-4 transition-colors shadow-inner flex items-center justify-center min-h-[4.5rem] ${inputBorderColor} ${inputBgColor} ${isPaused ? 'opacity-80' : 'text-slate-800 ring-4 ring-transparent focus:ring-indigo-100'}`}>
                                {inputValue || <span className="text-slate-300 opacity-60">?</span>}
                            </div>
                            
                            {/* Feedback Toast */}
                            {isPaused && gameDurationType === 'ceiling' ? (
                                <div className={`mt-4 w-full p-2.5 rounded-xl font-bold text-sm flex flex-col items-center gap-1 ${feedback === 'correct' ? 'bg-emerald-100 text-emerald-800' : 'bg-red-100 text-red-800'}`}>
                                    <span>{feedback === 'correct' ? 'Correct!' : `Answer is ${currentQuestion.answer}`}</span>
                                    <span className="text-[10px] opacity-70 font-medium tracking-wide uppercase">Press Any Key to Continue</span>
                                </div>
                            ) : (
                                <p className="text-slate-400 mt-4 text-[11px] font-medium tracking-wide uppercase flex items-center gap-2">
                                    <kbd className="px-1.5 py-0.5 bg-slate-100 rounded text-slate-500 border border-slate-200 shadow-sm">Enter</kbd> or <kbd className="px-1.5 py-0.5 bg-slate-100 rounded text-slate-500 border border-slate-200 shadow-sm">Space</kbd>
                                </p>
                            )}
                        </div>
                    </div>

                    {/* Custom Numpad */}
                    <div className="shrink-0 mt-2 mb-2">
                        <div className="grid grid-cols-3 gap-2 w-full max-w-[320px] mx-auto">
                            {[1, 2, 3, 4, 5, 6, 7, 8, 9].map(n => (
                                <button key={n} onClick={() => handleNumpadInput(n.toString())} className="py-4 bg-white border border-slate-200 rounded-2xl text-2xl font-bold text-slate-700 active:bg-slate-100 active:scale-95 transition-transform shadow-sm touch-manipulation">
                                    {n}
                                </button>
                            ))}
                            <button onClick={() => handleNumpadInput('del')} className="py-4 bg-red-50 border border-red-100 rounded-2xl text-xl font-bold text-red-500 active:bg-red-100 active:scale-95 transition-transform shadow-sm touch-manipulation flex items-center justify-center">
                                Del
                            </button>
                            <button onClick={() => handleNumpadInput('0')} className="py-4 bg-white border border-slate-200 rounded-2xl text-2xl font-bold text-slate-700 active:bg-slate-100 active:scale-95 transition-transform shadow-sm touch-manipulation">
                                0
                            </button>
                            <button onClick={() => handleNumpadInput('enter')} className={`py-4 rounded-2xl text-lg font-bold shadow-sm touch-manipulation active:scale-95 transition-all flex items-center justify-center gap-1 ${
                                isPaused ? 'bg-indigo-500 text-white border border-indigo-600' :
                                inputValue ? 'bg-indigo-600 text-white border border-indigo-700' : 'bg-slate-200 text-slate-500 border border-slate-300'
                            }`}>
                                {isPaused ? <FastForward className="w-6 h-6" /> : (inputValue ? 'Enter' : 'Skip')}
                            </button>
                        </div>
                    </div>
                </div>
                );
            };

            // ---- SUMMARY SCREEN ----
            const renderSummary = () => {
                const accuracy = history.length > 0 ? Math.round((score / history.length) * 100) : 0;
                const powerRangeText = `Powers ${powerMin}${powerMin !== powerMax ? ` to ${powerMax}` : ''}`;
                const baseRangeText = `Bases ${baseMin}${baseMin !== baseMax ? ` to ${baseMax}` : ''}`;
                const formatText = gameDurationType === 'time' ? (timeLimit >= 60 ? `${timeLimit/60}m` : `${timeLimit}s`) : `${exerciseCeiling} Qs`;

                return (
                <div className="w-full max-w-4xl bg-white rounded-3xl shadow-xl overflow-hidden border border-slate-100 flex flex-col h-full md:h-auto md:max-h-[800px] md:flex-row">
                    
                    {/* Left/Top Fixed Panel */}
                    <div className="w-full md:w-2/5 bg-slate-800 text-white flex flex-col shrink-0">
                        <div className="p-6 text-center z-10 flex-grow flex flex-col justify-center">
                            <Trophy className="w-12 h-12 mx-auto mb-3 text-yellow-400" />
                            <h2 className="text-3xl font-extrabold mb-1">{gameDurationType === 'time' ? "Time's Up!" : "Complete!"}</h2>
                            <p className="text-slate-300 text-sm mb-6">Here is how you performed.</p>

                            <div className="grid grid-cols-2 gap-3 mb-6">
                                <div className="bg-slate-700/50 p-4 rounded-2xl text-center border border-slate-600/50">
                                    <div className="text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">Score</div>
                                    <div className="text-3xl font-black text-indigo-300">{score}</div>
                                </div>
                                <div className="bg-slate-700/50 p-4 rounded-2xl text-center border border-slate-600/50">
                                    <div className="text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">Accuracy</div>
                                    <div className="text-3xl font-black text-emerald-400">{accuracy}%</div>
                                </div>
                            </div>
                            
                            <div className="text-sm font-medium text-slate-300 bg-slate-700/30 p-3 rounded-xl inline-block mx-auto mb-2">
                                {formatText} • {baseRangeText} • {powerRangeText}
                            </div>
                        </div>

                        <div className="p-4 bg-slate-900/50">
                            <button onClick={() => setGameState('menu')} className="w-full py-4 bg-indigo-500 hover:bg-indigo-600 text-white rounded-xl font-bold text-lg shadow-lg flex items-center justify-center gap-2 transition-all active:scale-95">
                                <RotateCcw className="w-5 h-5" /> Play Again
                            </button>
                        </div>
                    </div>

                    {/* Right/Bottom Scrollable History */}
                    <div className="w-full md:w-3/5 flex flex-col overflow-hidden bg-slate-50 relative">
                        <div className="p-4 bg-white border-b border-slate-200 shrink-0 shadow-sm z-10 hidden md:block">
                            <h3 className="font-bold text-slate-800 flex items-center gap-2">
                                <Activity className="w-5 h-5 text-indigo-500" /> Answer History ({history.length})
                            </h3>
                        </div>
                        
                        <div className="overflow-y-auto p-4 space-y-2 flex-grow">
                            {history.length === 0 ? (
                                <div className="text-center text-slate-400 py-8 italic h-full flex items-center justify-center">No questions answered.</div>
                            ) : (
                                history.map((item, index) => (
                                <div key={index} className={`flex items-center justify-between p-3 rounded-2xl border bg-white shadow-sm ${item.isCorrect ? 'border-l-4 border-l-emerald-500' : (item.isSkip ? 'border-l-4 border-l-amber-400' : 'border-l-4 border-l-red-500')}`}>
                                    <div className="flex items-center gap-4">
                                        <div className="shrink-0 flex items-center justify-center">
                                            {item.isCorrect ? <CheckCircle2 className="w-6 h-6 text-emerald-500" /> : (item.isSkip ? <Activity className="w-6 h-6 text-amber-500" /> : <XCircle className="w-6 h-6 text-red-500" />)}
                                        </div>
                                        <div className="flex flex-col">
                                            <div className="text-lg font-bold text-slate-700 leading-tight">
                                                {item.base}<sup className="text-xs text-indigo-500 ml-0.5">{item.power}</sup> = {item.isSkip ? <span className="text-slate-400 italic text-sm">Skipped</span> : item.userAnswer}
                                            </div>
                                            {!item.isCorrect && (
                                                <div className={`text-xs font-bold mt-0.5 ${item.isSkip ? 'text-amber-600' : 'text-red-500'}`}>
                                                    Correct answer: {item.answer}
                                                </div>
                                            )}
                                        </div>
                                    </div>
                                </div>
                                ))
                            )}
                        </div>
                    </div>

                </div>
                );
            };

            return (
                <div className="w-full h-full">
                    {gameState === 'menu' && renderMenu()}
                    {gameState === 'playing' && renderPlaying()}
                    {gameState === 'summary' && renderSummary()}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<MathGame />);
    </script>
</body>
</html>
