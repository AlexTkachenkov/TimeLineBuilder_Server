<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>8 Puzzle Game</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom styles for tile positioning and animation */
        #board {
            /* aspect-ratio: 1 / 1; */ /* Useful if making it fully fluid */
            width: 320px;
            height: 320px;
            position: relative;
            background-color: #e5e7eb; /* tailwind gray-200 */
            border-radius: 0.75rem;
            box-shadow: inset 0 2px 4px 0 rgb(0 0 0 / 0.05);
            margin: 0 auto;
        }

        .tile {
            position: absolute;
            width: 31%; /* Leave room for gaps */
            height: 31%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            font-weight: bold;
            color: white;
            background-image: linear-gradient(to bottom right, #3b82f6, #2563eb); /* tailwind blue-500 to blue-600 */
            border-radius: 0.5rem;
            cursor: pointer;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
            transition: top 0.2s ease-in-out, left 0.2s ease-in-out, transform 0.05s;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }
        
        .tile:active {
            transform: scale(0.97);
        }

        .tile.correct {
            background-image: linear-gradient(to bottom right, #10b981, #059669); /* tailwind emerald-500 to emerald-600 */
        }
        
        /* Modal Animation */
        @keyframes popIn {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .animate-pop-in {
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col items-center justify-center font-sans text-gray-800">

    <div class="max-w-md w-full p-6">
        <!-- Header Section -->
        <div class="text-center mb-8">
            <h1 class="text-4xl font-extrabold text-gray-900 tracking-tight mb-2">8 Puzzle</h1>
            <p class="text-gray-500">Arrange the numbers from 1 to 8.</p>
        </div>

        <!-- Stats Section -->
        <div class="flex justify-between items-center mb-6 bg-white p-4 rounded-xl shadow-sm border border-gray-100">
            <div class="flex flex-col items-center w-1/2 border-r border-gray-100">
                <span class="text-xs uppercase tracking-wider font-semibold text-gray-400 mb-1">Moves</span>
                <span id="moveCount" class="text-2xl font-bold text-gray-700">0</span>
            </div>
            <div class="flex flex-col items-center w-1/2">
                <span class="text-xs uppercase tracking-wider font-semibold text-gray-400 mb-1">Time</span>
                <span id="timer" class="text-2xl font-bold text-gray-700">00:00</span>
            </div>
        </div>

        <!-- Game Board Container -->
        <div id="board" class="mb-8">
            <!-- Tiles are generated by JS -->
        </div>

        <!-- Controls -->
        <div class="text-center">
            <button onclick="initGame()" class="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 px-8 rounded-full shadow-lg transition duration-200 ease-in-out transform hover:-translate-y-0.5 focus:outline-none focus:ring-4 focus:ring-indigo-300">
                Restart Game
            </button>
        </div>
    </div>

    <!-- Win Modal (Hidden by default) -->
    <div id="winModal" class="fixed inset-0 bg-gray-900/60 backdrop-blur-sm hidden flex items-center justify-center z-50">
        <div class="bg-white rounded-2xl p-8 max-w-sm w-full mx-4 shadow-2xl text-center transform scale-90 opacity-0 transition-all" id="winModalContent">
            <div class="w-16 h-16 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-4">
                <svg class="w-8 h-8 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>
            </div>
            <h2 class="text-2xl font-bold text-gray-900 mb-2">Puzzle Solved!</h2>
            <p class="text-gray-600 mb-6">Great job! Here are your stats:</p>
            
            <div class="grid grid-cols-2 gap-4 mb-6 text-left">
                <div class="bg-gray-50 p-3 rounded-lg">
                    <span class="block text-xs text-gray-500 mb-1">Time</span>
                    <span id="finalTime" class="font-bold text-lg text-gray-800">--:--</span>
                </div>
                <div class="bg-gray-50 p-3 rounded-lg">
                    <span class="block text-xs text-gray-500 mb-1">Moves</span>
                    <span id="finalMoves" class="font-bold text-lg text-gray-800">--</span>
                </div>
            </div>

            <button onclick="closeModalAndRestart()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-4 rounded-xl transition duration-200">
                Play Again
            </button>
        </div>
    </div>

    <script>
        // Game State Variables
        const SIZE = 3;
        const TOTAL_TILES = SIZE * SIZE;
        let boardState = []; // Array representing the grid [1,2,3,4,5,6,7,8,0]
        let tilesDOM = [];   // References to DOM elements, indexed by tile number (1-8)
        
        let moves = 0;
        let emptyIndex = 8; // Index of the empty slot (0)
        let isPlaying = false;
        
        // Timer Variables
        let startTime;
        let timerInterval;

        // DOM Elements
        const boardElement = document.getElementById('board');
        const moveCountElement = document.getElementById('moveCount');
        const timerElement = document.getElementById('timer');
        const winModal = document.getElementById('winModal');
        const winModalContent = document.getElementById('winModalContent');

        // Initialize the game
        function initGame() {
            stopTimer();
            moves = 0;
            updateStatsDisplay();
            isPlaying = false;
            hideModal();

            // Create solved state
            boardState = [1, 2, 3, 4, 5, 6, 7, 8, 0];
            emptyIndex = 8;

            // Generate DOM if first time, otherwise they are reused
            if (tilesDOM.length === 0) {
                createTilesDOM();
            }

            // Shuffle the board by performing random valid moves
            shuffleBoard(150);
            
            // Render the initial shuffled state
            renderBoard();
        }

        // Create DOM elements for tiles initially
        function createTilesDOM() {
            boardElement.innerHTML = '';
            // We need 8 tiles. Index 0 is unused to match tile numbers 1-8 easily
            tilesDOM = new Array(9); 
            
            for (let i = 1; i <= 8; i++) {
                const tile = document.createElement('div');
                tile.className = 'tile shadow-md';
                tile.textContent = i;
                // Add click listener
                tile.addEventListener('click', () => handleTileClick(i));
                
                boardElement.appendChild(tile);
                tilesDOM[i] = tile;
            }
        }

        // Shuffle by simulating random walks to ensure solvability
        function shuffleBoard(steps) {
            let prevIndex = -1;
            for (let i = 0; i < steps; i++) {
                let validMoves = getValidMoves(emptyIndex);
                // Prevent immediate backtracking for a better shuffle
                let filteredMoves = validMoves.filter(move => move !== prevIndex);
                
                // If backtracking is the only option (shouldn't happen on a 3x3 except maybe in a corner, but good fallback)
                let movesToChooseFrom = filteredMoves.length > 0 ? filteredMoves : validMoves;
                
                let randomMove = movesToChooseFrom[Math.floor(Math.random() * movesToChooseFrom.length)];
                
                // Perform swap in state array
                boardState[emptyIndex] = boardState[randomMove];
                boardState[randomMove] = 0;
                
                prevIndex = emptyIndex;
                emptyIndex = randomMove;
            }
        }

        // Get indices adjacent to a given index
        function getValidMoves(index) {
            const moves = [];
            const row = Math.floor(index / SIZE);
            const col = index % SIZE;

            if (row > 0) moves.push(index - SIZE);     // Up
            if (row < SIZE - 1) moves.push(index + SIZE); // Down
            if (col > 0) moves.push(index - 1);        // Left
            if (col < SIZE - 1) moves.push(index + 1);    // Right

            return moves;
        }

        // Update DOM elements based on boardState array
        function renderBoard() {
            for (let i = 0; i < TOTAL_TILES; i++) {
                const tileNumber = boardState[i];
                if (tileNumber !== 0) {
                    const tileEl = tilesDOM[tileNumber];
                    const row = Math.floor(i / SIZE);
                    const col = i % SIZE;

                    // Use inline styles instead of classes for guaranteed smooth multi-tile transitions
                    tileEl.style.top = `${row * 32.75 + 1.75}%`;
                    tileEl.style.left = `${col * 32.75 + 1.75}%`;
                    
                    // Highlight if in correct position (number - 1 matches index)
                    if (tileNumber - 1 === i) {
                        tileEl.classList.add('correct');
                    } else {
                        tileEl.classList.remove('correct');
                    }
                }
            }
        }

        // Handle user clicking a tile
        function handleTileClick(tileNumber) {
            // Find index of clicked tile in boardState
            const clickedIndex = boardState.indexOf(tileNumber);
            
            const rowC = Math.floor(clickedIndex / SIZE);
            const colC = clickedIndex % SIZE;
            const rowE = Math.floor(emptyIndex / SIZE);
            const colE = emptyIndex % SIZE;

            let isValidMove = false;

            // Check if clicked tile is in the same row as the empty slot
            if (rowC === rowE) {
                isValidMove = true;
                let step = colC > colE ? 1 : -1;
                // Shift all tiles in the path towards the empty slot
                for (let i = emptyIndex; i !== clickedIndex; i += step) {
                    boardState[i] = boardState[i + step];
                }
                boardState[clickedIndex] = 0;
                emptyIndex = clickedIndex;
            } 
            // Check if clicked tile is in the same column as the empty slot
            else if (colC === colE) {
                isValidMove = true;
                let step = rowC > rowE ? SIZE : -SIZE;
                // Shift all tiles in the path towards the empty slot
                for (let i = emptyIndex; i !== clickedIndex; i += step) {
                    boardState[i] = boardState[i + step];
                }
                boardState[clickedIndex] = 0;
                emptyIndex = clickedIndex;
            }

            if (isValidMove) {
                // First move starts timer
                if (!isPlaying) {
                    startTimer();
                    isPlaying = true;
                }

                moves++;
                updateStatsDisplay();
                renderBoard();
                
                // Small delay before checking win to allow animation to start
                setTimeout(checkWin, 250); 
            }
        }

        function checkWin() {
            const isWin = boardState.every((val, index) => {
                if (index === 8) return val === 0;
                return val === index + 1;
            });

            if (isWin) {
                stopTimer();
                showWinModal();
            }
        }

        // Timer Functions
        function startTimer() {
            startTime = Date.now();
            timerInterval = setInterval(updateStatsDisplay, 1000);
        }

        function stopTimer() {
            clearInterval(timerInterval);
        }

        function updateStatsDisplay() {
            moveCountElement.textContent = moves;
            
            if (isPlaying) {
                const elapsedTime = Math.floor((Date.now() - startTime) / 1000);
                const minutes = Math.floor(elapsedTime / 60).toString().padStart(2, '0');
                const seconds = (elapsedTime % 60).toString().padStart(2, '0');
                timerElement.textContent = `${minutes}:${seconds}`;
            } else {
                timerElement.textContent = "00:00";
            }
        }

        // Modal Functions
        function showWinModal() {
            document.getElementById('finalMoves').textContent = moves;
            document.getElementById('finalTime').textContent = timerElement.textContent;
            
            winModal.classList.remove('hidden');
            // Trigger reflow to restart animation
            void winModalContent.offsetWidth; 
            winModalContent.classList.add('animate-pop-in');
        }

        function hideModal() {
            winModal.classList.add('hidden');
            winModalContent.classList.remove('animate-pop-in');
        }

        function closeModalAndRestart() {
            hideModal();
            initGame();
        }

        // Start game on load
        window.onload = initGame;

    </script>
</body>
</html>
