<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hierarchical Timeline Builder</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script>
        // --- APP CONFIGURATION ---
        window.APP_VERSION = "v0.30VH"; 

        tailwind.config = {
            darkMode: 'class',
        }
        
        // Immediate Dark Mode Check
        if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
            document.documentElement.classList.add('dark');
        }
    </script>
    
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.2.0",
        "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
        "lucide-react": "https://esm.sh/lucide-react@0.263.1"
      }
    }
    </script>
    <style>
        @media print {
            .no-print { display: none !important; }
            body { background-color: white !important; }
            .print-break-inside-avoid { break-inside: avoid; }
        }
        .btn-framed { 
            @apply flex flex-col items-center justify-center w-24 md:w-32 h-14 md:h-16 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl shadow-sm transition-all hover:border-slate-300 dark:hover:border-slate-600 hover:shadow-md active:scale-95 cursor-pointer; 
        }
        .btn-icon-only {
            @apply p-2 rounded-lg text-slate-500 hover:text-blue-600 hover:bg-slate-100 dark:text-slate-400 dark:hover:bg-slate-700 transition-colors;
        }
        .btn-icon-active {
            @apply bg-blue-50 text-blue-600 dark:bg-blue-900/30 dark:text-blue-400;
        }
        /* Custom scrollbar */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .dark ::-webkit-scrollbar-thumb { background: #475569; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        .drag-handle { cursor: grab; }
        .drag-handle:active { cursor: grabbing; }

        .animate-fade-in-up {
            animation: fadeInUp 0.3s ease-out;
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translate(-50%, 20px); }
            to { opacity: 1; transform: translate(-50%, 0); }
        }
        
        [contenteditable]:focus { outline: none; }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-900 transition-colors duration-700 ease-in-out">
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import React, { useState, useRef, useEffect, useMemo } from 'react';
        import { createRoot } from 'react-dom/client';
        import { 
            Plus, Trash2, ChevronDown, ChevronUp, Calendar, Download, Printer, 
            ArrowLeftRight, FileJson, Upload, Indent, Outdent, Globe, AlignCenter, 
            AlignLeft, AlignRight, Sun, Moon, RefreshCcw, X, Info, GripVertical, 
            GalleryHorizontal, GalleryVertical, Shuffle, Type, AlignJustify,
            Activity, AlignEndHorizontal, AlignStartHorizontal, ArrowDown, ArrowUp
        } from 'lucide-react';

        // --- Translations ---
        const TRANSLATIONS = {
          en: {
            save: "Save Template", load: "Load Template", pdf: "Export PDF", image: "Export Image",
            addNode: "Add Node Here", titlePlaceholder: "Enter Title...",
            subtitlePlaceholder: "Enter Subtitle...", defaultTitle: "Dynamic Timeline Builder.<br>click here to change title",
            promote: "Promote", demote: "Demote", switchSide: "Switch Side", moveUp: "Move Up",
            moveDown: "Move Down", delete: "Delete", datePlaceholder: "DATE",
            titleNodePlaceholder: "Event Title...", descNodePlaceholder: "Description...",
            subTitleNodePlaceholder: "Sub-event Title...", alignCenter: "Align Center",
            alignSide: "Align Start", 
            nodeAlignMode: "Node Alignment Mode",
            alignOneSide: "Align All One Side", textAlignMode: "Text Alignment Mode",
            subtitleDefault: "Use Ctrl+B/I/U for formatting.<br>©alex tkachenkov",
            toggleDate: "Toggle Date", loading: "Loading libraries...",
            invalidFormat: "Invalid file format", parseError: "Error parsing file", exportSuccess: "Export initiated",
            dragHandle: "Drag to reorder", layoutMode: "Toggle Layout",
            newEventTitle: "New Event", newEventDate: "", newEventContent: ""
          },
          he: {
            save: "שמור תבנית", load: "טען תבנית", pdf: "ייצוא PDF", image: "ייצוא תמונה",
            addNode: "הוסף אירוע כאן", titlePlaceholder: "הכנס כותרת...",
            subtitlePlaceholder: "הכנס כותרת משנה...", defaultTitle: "בניית ציר זמן דינמי.<br>לחצו כאן כדי לשנות כותרת",
            promote: "הפוך לראשי", demote: "הפוך למשני", switchSide: "החלף צד", moveUp: "הזז למעלה",
            moveDown: "הזז למטה", delete: "מחק", datePlaceholder: "תאריך",
            titleNodePlaceholder: "כותרת האירוע...", descNodePlaceholder: "תיאור...",
            subTitleNodePlaceholder: "כותרת תת-אירוע...", alignCenter: "יישור למרכז",
            alignSide: "יישור להתחלה", 
            nodeAlignMode: "מצב יישור צמתים",
            alignOneSide: "סידור צד אחד", textAlignMode: "מצב יישור טקסט",
            subtitleDefault: "השתמשו ב-Ctrl+B/I/U לעיצוב.<br>©אלכס טקצ'נקוב",
            toggleDate: "הצג/הסתר תאריך", loading: "טוען ספריות...",
            invalidFormat: "פורמט קובץ לא תקין", parseError: "שגיאה בטעינת הקובץ", exportSuccess: "ייצוא התחיל",
            dragHandle: "גרור לשינוי סדר", layoutMode: "שנה תצוגה",
            newEventTitle: "אירוע חדש", newEventDate: "", newEventContent: ""
          }
        };

        const Toast = ({ message, onClose }) => {
            useEffect(() => {
                const timer = setTimeout(onClose, 3000);
                return () => clearTimeout(timer);
            }, [onClose]);
            if (!message) return null;
            return (
                <div className="fixed bottom-6 left-1/2 transform -translate-x-1/2 z-[100] animate-fade-in-up">
                    <div className="bg-slate-800 dark:bg-slate-100 text-white dark:text-slate-900 px-6 py-3 rounded-full shadow-lg flex items-center gap-2 text-sm font-medium">
                        <Info size={16} />
                        {message}
                    </div>
                </div>
            );
        };

        const RichTextEditor = ({ value, onChange, className, placeholder, singleLine = false, align = 'start', localDir = 'auto', onDirChange, globalAlignMode = 0 }) => {
          const editorRef = useRef(null);
          
          useEffect(() => {
            if (editorRef.current && editorRef.current.innerHTML !== value) {
              if (document.activeElement !== editorRef.current) {
                 editorRef.current.innerHTML = value || '';
              }
            }
          }, [value]);

          const handleInput = (e) => onChange(e.currentTarget.innerHTML);
          
          const handleKeyDown = (e) => {
            if (e.ctrlKey && e.code === 'ShiftLeft') {
                e.preventDefault();
                if(onDirChange) onDirChange('ltr');
            }
            if (e.ctrlKey && e.code === 'ShiftRight') {
                e.preventDefault();
                if(onDirChange) onDirChange('rtl');
            }
            if (singleLine && e.key === 'Enter') e.preventDefault();
          };

          let finalDir = localDir || 'auto';
          let finalClass = '';

          if (globalAlignMode === 1) {
              finalClass = 'text-left'; 
              finalDir = 'ltr';
          } else if (globalAlignMode === 2) {
              finalClass = 'text-right';
              finalDir = 'rtl';
          } else {
              if (localDir === 'ltr') finalClass = 'text-left';
              else if (localDir === 'rtl') finalClass = 'text-right';
              else {
                  finalClass = align === 'center' ? 'text-center' : 'text-start';
              }
          }

          return (
            <div className={`relative group/editor w-full ${finalClass}`}>
              <div
                ref={editorRef}
                contentEditable
                className={`${className} empty:before:content-[attr(data-placeholder)] empty:before:text-slate-300 dark:empty:before:text-slate-500 cursor-text outline-none z-10 relative inline-block min-w-[50px] transition-colors duration-700 ease-in-out`}
                onInput={handleInput}
                onKeyDown={handleKeyDown}
                suppressContentEditableWarning={true}
                data-placeholder={placeholder}
                dir={finalDir}
              />
            </div>
          );
        };

        const NodeControls = ({ node, index, isSub, totalNodes, onIndent, onOutdent, onToggleSide, onMove, onDelete, onToggleDate, t, layoutMode }) => {
            // Horizontal Mode: "Side" means Up/Down. Vertical Mode: "Side" means Left/Right
            const sideIcon = layoutMode === 'horizontal' 
                ? (node.side === 'left' ? <ArrowDown size={14} /> : <ArrowUp size={14} />) 
                : <ArrowLeftRight size={14} />;
            
            const sideTitle = layoutMode === 'horizontal'
                ? "Switch Up/Down"
                : t.switchSide;

            return (
            <div className="flex flex-row items-center gap-1 w-full">
               <div className="flex items-center gap-1">
                   <div className="drag-handle p-1.5 text-slate-300 hover:text-slate-500 dark:text-slate-600 dark:hover:text-slate-400 rounded cursor-grab active:cursor-grabbing" title={t.dragHandle}>
                      <GripVertical size={14} />
                   </div>
                   <div className="w-px h-4 bg-slate-200 dark:bg-slate-700 mx-0.5 transition-colors duration-700"></div>
                   <button onClick={() => onToggleDate(node.id)} className={`p-1.5 rounded transition-colors duration-700 ${node.date !== null ? 'text-blue-600 bg-blue-50 dark:text-blue-400 dark:bg-blue-900/30' : 'text-slate-400 hover:text-blue-500 dark:text-slate-500 dark:hover:text-blue-400'}`} title={t.toggleDate}>
                      <Calendar size={14} />
                   </button>
                   <div className="w-px h-4 bg-slate-200 dark:bg-slate-700 mx-0.5 transition-colors duration-700"></div>
                   {isSub ? (
                       <button onClick={() => onOutdent(index)} className="p-1.5 text-slate-400 hover:text-orange-600 hover:bg-orange-50 dark:hover:bg-orange-900/30 rounded transition-colors duration-700" title={t.promote}>
                          <Outdent size={14} />
                       </button>
                   ) : (
                       <button onClick={() => onIndent(index)} className="p-1.5 text-slate-400 hover:text-blue-600 hover:bg-blue-50 dark:hover:bg-blue-900/30 rounded transition-colors duration-700" title={t.demote}>
                          <Indent size={14} />
                       </button>
                   )}
                   <button onClick={() => onToggleSide(node.id)} className="p-1.5 text-slate-400 hover:text-blue-600 hover:bg-blue-50 dark:hover:bg-blue-900/30 rounded transition-colors duration-700" title={sideTitle}>
                      {sideIcon}
                   </button>
               </div>
               
               <button onClick={() => onDelete(node.id)} className="p-1.5 text-slate-400 hover:text-red-500 hover:bg-red-50 dark:hover:bg-red-900/30 rounded transition-colors duration-700 ml-auto" title={t.delete}><Trash2 size={14} /></button>
            </div>
        )};

        const SubNodeRenderer = ({ node, index, totalNodes, onUpdate, onDelete, onToggleDate, onIndent, onOutdent, onToggleSide, onDragStart, onDragOver, onDrop, globalAlignMode, t, draggedNodeId, layoutMode }) => {
            const isDragging = draggedNodeId === node.id;
            return (
              <div 
                draggable="true"
                onDragStart={(e) => onDragStart(e, node.id)}
                onDragOver={(e) => onDragOver(e, node.id)}
                onDrop={(e) => onDrop(e, node.id)}
                className={`relative p-4 border-t border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 first:border-t-0 group/sub hover:bg-slate-50/50 dark:hover:bg-slate-700/50 transition-colors duration-700 ease-in-out ${isDragging ? 'opacity-40' : 'opacity-100'}`}
              >
                 <div className="absolute right-0 top-0 bottom-0 w-[4px] bg-slate-200 dark:bg-slate-700 group-hover/sub:bg-blue-300 dark:group-hover/sub:bg-blue-600 transition-colors duration-700"></div>
                 <div className="space-y-2 relative z-10">
                     {node.date !== null && (
                         <RichTextEditor 
                            value={node.date || ''} 
                            onChange={(val) => onUpdate(node.id, 'date', val)} 
                            localDir={node.dateDir}
                            onDirChange={(dir) => onUpdate(node.id, 'dateDir', dir)}
                            globalAlignMode={globalAlignMode}
                            className="date-input w-full font-semibold uppercase tracking-wider bg-transparent border-none focus:outline-none placeholder-blue-300 text-xs text-blue-600 dark:text-blue-400 transition-colors duration-700" 
                            placeholder={t.datePlaceholder} 
                         />
                     )}
                     <RichTextEditor 
                        value={node.title} 
                        onChange={(val) => onUpdate(node.id, 'title', val)} 
                        localDir={node.titleDir}
                        onDirChange={(dir) => onUpdate(node.id, 'titleDir', dir)}
                        globalAlignMode={globalAlignMode}
                        singleLine={true} 
                        className="w-full font-bold text-slate-800 dark:text-slate-100 text-lg border-b border-transparent hover:border-slate-200 dark:hover:border-slate-600 focus:border-blue-500 transition-colors py-1" 
                        placeholder={t.subTitleNodePlaceholder} 
                     />
                     <RichTextEditor 
                        value={node.content} 
                        onChange={(val) => onUpdate(node.id, 'content', val)} 
                        localDir={node.contentDir}
                        onDirChange={(dir) => onDirChange ? onDirChange(dir) : null}
                        globalAlignMode={globalAlignMode}
                        className="w-full text-slate-600 dark:text-slate-300 text-sm min-h-[20px] transition-colors duration-700" 
                        placeholder={t.descNodePlaceholder} 
                     />
                 </div>
                 <div className="mt-3 pt-2 flex justify-start items-center gap-2 no-print opacity-100 md:opacity-0 md:group-hover/sub:opacity-100 transition-opacity">
                     <NodeControls node={node} index={index} isSub={true} totalNodes={totalNodes} onIndent={onIndent} onOutdent={onOutdent} onToggleSide={onToggleSide} onDelete={onDelete} onToggleDate={onToggleDate} t={t} layoutMode={layoutMode} />
                 </div>
              </div>
            );
        };

        const TimelineApp = () => {
          const fileInputRef = useRef(null);
          const containerRef = useRef(null);
          const appVersion = window.APP_VERSION || "v0.0";

          const [uiLanguage, setUiLanguage] = useState('en');
          const [layoutMode, setLayoutMode] = useState('vertical');
          const [toastMessage, setToastMessage] = useState(null);
          const [darkMode, setDarkMode] = useState(() => document.documentElement.classList.contains('dark'));

          const t = TRANSLATIONS[uiLanguage];
          const [appTitle, setAppTitle] = useState(t.defaultTitle); 
          const [appSubtitle, setAppSubtitle] = useState(t.subtitleDefault);
          const [headerAlign, setHeaderAlign] = useState('center');
          
          const [globalAlignMode, setGlobalAlignMode] = useState(0); // 0:Manual, 1:Left, 2:Right
          const [nodeAlignMode, setNodeAlignMode] = useState(0);   // 0:Manual, 1:ZigZag, 2:Right, 3:Left

          const showToast = (msg) => setToastMessage(msg);

          const [nodes, setNodes] = useState(() => {
            try {
              const saved = localStorage.getItem('timeline_nodes_h');
              if (saved) return JSON.parse(saved);
            } catch (e) {}
            return [
              { "id": "1", "type": "event", "side": "right", "title": "Mechanical Roots", "date": "19th Century", "content": "Mechanical machines like Babbage's analytical engine.", "isSub": false },
              { "id": "2", "type": "event", "side": "right", "title": "Analytical Engine", "date": "1837", "content": "The first design for a general-purpose computer.", "isSub": true },
            ];
          });

          useEffect(() => {
            localStorage.setItem('timeline_nodes_h', JSON.stringify(nodes));
          }, [nodes]);

          useEffect(() => {
            if (darkMode) document.documentElement.classList.add('dark');
            else document.documentElement.classList.remove('dark');
          }, [darkMode]);

          useEffect(() => {
            const loadScript = (src, id) => {
                if (!document.getElementById(id)) {
                    const script = document.createElement('script');
                    script.src = src;
                    script.id = id;
                    script.async = true;
                    document.body.appendChild(script);
                }
            };
            loadScript("https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js", "html2canvas-script");
            loadScript("https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js", "jspdf-script");
          }, []);

          const renderGroups = useMemo(() => {
            const groups = [];
            let currentGroup = null;
            let currentZigZagSide = 'right';

            nodes.forEach((node, index) => {
                let displaySide = node.side; 
                if (nodeAlignMode === 1) { // ZigZag
                    if (!node.isSub) {
                        displaySide = currentZigZagSide;
                        currentZigZagSide = currentZigZagSide === 'right' ? 'left' : 'right';
                    }
                } else if (nodeAlignMode === 2) displaySide = 'right';
                else if (nodeAlignMode === 3) displaySide = 'left';
                
                const nodeWithEffectiveSide = { ...node, effectiveSide: displaySide };

                if (node.isSub && currentGroup) {
                    currentGroup.children.push({ ...nodeWithEffectiveSide, originalIndex: index });
                } else {
                    if (currentGroup) groups.push(currentGroup);
                    currentGroup = { type: 'group', main: { ...nodeWithEffectiveSide, originalIndex: index }, children: [] };
                }
            });
            if (currentGroup) groups.push(currentGroup);
            return groups;
          }, [nodes, nodeAlignMode]);

          const addNode = (index) => {
            const prevNode = index > 0 ? nodes[index - 1] : null;
            const newSide = prevNode && prevNode.side === 'right' ? 'left' : 'right';
            const newNode = { 
                id: Math.random().toString(36).substr(2, 9), 
                side: newSide, title: t.newEventTitle, date: t.newEventDate, content: t.newEventContent, isSub: false 
            };
            const newNodes = [...nodes];
            newNodes.splice(index, 0, newNode);
            setNodes(newNodes);
          };

          const deleteNode = (id) => nodes.length > 1 && setNodes(nodes.filter(n => n.id !== id));
          const updateNode = (id, field, value) => setNodes(nodes.map(n => n.id === id ? { ...n, [field]: value } : n));
          
          const [draggedNodeId, setDraggedNodeId] = useState(null);

          const handleDragStart = (e, id) => {
              if (!e.target.closest('.drag-handle')) { e.preventDefault(); return; }
              setDraggedNodeId(id);
              e.dataTransfer.effectAllowed = "move";
          };

          const handleDrop = (e, targetId) => {
            e.preventDefault();
            if (!draggedNodeId || draggedNodeId === targetId) return;
            const sourceIndex = nodes.findIndex(n => n.id === draggedNodeId);
            const targetIndex = nodes.findIndex(n => n.id === targetId);
            if (sourceIndex === -1 || targetIndex === -1) return;

            let newNodes = [...nodes];
            const [moving] = newNodes.splice(sourceIndex, 1);
            const adjTarget = newNodes.findIndex(n => n.id === targetId);
            newNodes.splice(adjTarget, 0, moving);
            setNodes(newNodes);
            setDraggedNodeId(null);
          };

          const cycleNodeAlignMode = () => setNodeAlignMode(prev => (prev + 1) % 4);
          const cycleTextAlignMode = () => setGlobalAlignMode(prev => (prev + 1) % 3);

          const getTextAlignTooltip = () => {
              if (globalAlignMode === 0) return "Text Alignment: Manual";
              if (globalAlignMode === 1) return "Text Alignment: Left";
              if (globalAlignMode === 2) return "Text Alignment: Right";
              return t.textAlignMode;
          };

          const getTextAlignIcon = () => {
              if (globalAlignMode === 1) return <AlignLeft size={18} />;
              if (globalAlignMode === 2) return <AlignRight size={18} />;
              return <Type size={18} />;
          };

          const getNodeAlignTooltip = () => {
              if (nodeAlignMode === 0) return "Node Alignment: Manual";
              if (nodeAlignMode === 1) return "Node Alignment: ZigZag";
              if (nodeAlignMode === 2) return "Node Alignment: All Right/Down";
              if (nodeAlignMode === 3) return "Node Alignment: All Left/Up";
              return t.nodeAlignMode;
          };

          const getNodeAlignIcon = () => {
               if (nodeAlignMode === 1) return <Activity size={18} />; // Zigzag
               if (nodeAlignMode === 2) return <AlignEndHorizontal size={18} className="transform rotate-90" />; // Right/Down
               if (nodeAlignMode === 3) return <AlignStartHorizontal size={18} className="transform rotate-90" />; // Left/Up
               return <Shuffle size={18} />; // Manual
          };

          // --- Export & File Handlers ---
          const fixDateInputsForExport = (clonedDoc) => {
             // In new RichTextEditor, dates are divs, not inputs. 
             // But if we used class 'date-input', we can target them if needed. 
             // Generally html2canvas handles divs fine. 
             // We mainly need to ensure background colors are correct.
          };

          const handleExportImage = async () => {
            if (window.html2canvas) {
                const element = document.getElementById('timeline-content');
                const originalBg = element.style.backgroundColor;
                const originalPadding = element.style.padding;
                const isDark = document.documentElement.classList.contains('dark');
                const bgColor = isDark ? '#0f172a' : '#f8fafc';
                element.style.backgroundColor = bgColor;
                element.style.padding = '40px 80px'; 
                try {
                    const canvas = await window.html2canvas(element, { 
                        backgroundColor: bgColor, 
                        scale: 2, 
                        useCORS: true, 
                        ignoreElements: (element) => element.classList.contains('no-print'),
                        onclone: fixDateInputsForExport
                    });
                    const link = document.createElement('a');
                    link.download = 'timeline.png';
                    link.href = canvas.toDataURL();
                    link.click();
                    showToast(t.exportSuccess);
                } finally { element.style.backgroundColor = ''; element.style.padding = originalPadding; }
            } else { showToast(t.loading); }
          };

          const handleExportPDF = async () => {
              if (window.html2canvas && window.jspdf) {
                const { jsPDF } = window.jspdf;
                const element = document.getElementById('timeline-content');
                const isDark = document.documentElement.classList.contains('dark');
                const originalBg = element.style.backgroundColor;
                const originalPadding = element.style.padding;
                const bgColor = isDark ? '#0f172a' : '#ffffff';
                element.style.backgroundColor = bgColor;
                element.style.padding = '40px 80px'; 
                try {
                    const canvas = await window.html2canvas(element, { 
                        backgroundColor: bgColor, 
                        scale: 2, 
                        useCORS: true, 
                        ignoreElements: (element) => element.classList.contains('no-print'),
                        onclone: fixDateInputsForExport
                    });
                    const imgData = canvas.toDataURL('image/png');
                    const pdf = new jsPDF('p', 'mm', 'a4');
                    const pdfWidth = pdf.internal.pageSize.getWidth();
                    const pdfHeight = pdf.internal.pageSize.getHeight();
                    const imgProps = pdf.getImageProperties(imgData);
                    const imgHeight = (imgProps.height * pdfWidth) / imgProps.width;
                    if (imgHeight > pdfHeight) {
                         const customPdf = new jsPDF('p', 'mm', [pdfWidth, imgHeight + 20]);
                         customPdf.addImage(imgData, 'PNG', 0, 0, pdfWidth, imgHeight);
                         customPdf.save('timeline.pdf');
                    } else {
                         pdf.addImage(imgData, 'PNG', 0, 0, pdfWidth, imgHeight);
                         pdf.save('timeline.pdf');
                    }
                    showToast(t.exportSuccess);
                } finally { element.style.backgroundColor = originalBg; element.style.padding = originalPadding; }
              } else { showToast(t.loading); }
          };

          const handleSaveTemplate = () => {
              const cleanNodes = nodes.map(node => ({ 
                  id: node.id, type: node.type || 'event', side: node.side, 
                  title: node.title, date: node.date, content: node.content, 
                  isSub: node.isSub, 
                  titleDir: node.titleDir, contentDir: node.contentDir, dateDir: node.dateDir 
              }));
              
              const templateData = { title: appTitle, subtitle: appSubtitle, nodes: cleanNodes };
              const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(templateData, null, 2));
              const downloadAnchorNode = document.createElement('a');
              downloadAnchorNode.setAttribute("href", dataStr);
              downloadAnchorNode.setAttribute("download", "timeline_template.json");
              document.body.appendChild(downloadAnchorNode);
              downloadAnchorNode.click();
              downloadAnchorNode.remove();
          };

          const handleLoadTemplateClick = () => { fileInputRef.current.click(); };
          const handleFileChange = (e) => {
              const fileReader = new FileReader();
              fileReader.readAsText(e.target.files[0], "UTF-8");
              fileReader.onload = e => {
                  try {
                      const parsed = JSON.parse(e.target.result);
                      if (parsed.nodes && Array.isArray(parsed.nodes)) {
                          setNodes(parsed.nodes);
                          if (parsed.title) setAppTitle(parsed.title);
                          if (parsed.subtitle) setAppSubtitle(parsed.subtitle);
                      } else if (Array.isArray(parsed)) {
                          setNodes(parsed);
                      } else { showToast(t.invalidFormat); }
                  } catch (err) { showToast(t.parseError); }
              };
              e.target.value = null; 
          };


          const [hoverY, setHoverY] = useState(null);
          const [hoverX, setHoverX] = useState(null);
          const [insertIndex, setInsertIndex] = useState(null);

          const handleMouseMove = (e) => {
            if (!containerRef.current || draggedNodeId) return;
            const rect = containerRef.current.getBoundingClientRect();
            
            if (layoutMode === 'horizontal') {
                const spineZoneY = rect.top + 320; // 50% of 640px height
                if (e.clientY > spineZoneY + 60 || e.clientY < spineZoneY - 60) { setHoverX(null); return; }
                
                const mouseX = e.clientX;
                const groupEls = document.querySelectorAll('[data-group-index]');
                let calcIdx = nodes.length;
                for (let i = 0; i < groupEls.length; i++) {
                    const elRect = groupEls[i].getBoundingClientRect();
                    if (mouseX < elRect.left + elRect.width / 2) {
                        calcIdx = parseInt(groupEls[i].getAttribute('data-start-index'));
                        break;
                    }
                }
                setHoverX(mouseX - rect.left + containerRef.current.scrollLeft);
                setInsertIndex(calcIdx);
                setHoverY(null);
            } else {
                const isMobile = window.innerWidth < 768;
                const centerX = isMobile ? (rect.left + 32) : (rect.left + rect.width / 2);
                if (Math.abs(e.clientX - centerX) > 50) { setHoverY(null); return; }
                const relY = e.clientY - rect.top;
                setHoverY(relY);
                setHoverX(null);
                const groupEls = document.querySelectorAll('[data-group-index]');
                let calcIdx = nodes.length;
                for (let i = 0; i < groupEls.length; i++) {
                    const dot = groupEls[i].querySelector('.timeline-dot');
                    if (dot && e.clientY < dot.getBoundingClientRect().top + 10) {
                        calcIdx = parseInt(groupEls[i].getAttribute('data-start-index'));
                        break;
                    }
                }
                setInsertIndex(calcIdx);
            }
          };

          const isRtl = uiLanguage === 'he';
          const currentDir = isRtl ? 'rtl' : 'ltr';

          return (
            <div className="min-h-screen bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 p-4 md:p-8 font-sans transition-colors duration-700 ease-in-out" dir={currentDir}>
              <Toast message={toastMessage} onClose={() => setToastMessage(null)} />
              
              <div dir="ltr" className="fixed top-4 left-4 z-50 no-print flex items-center bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg shadow-sm p-1 transition-colors duration-700">
                  <select value={uiLanguage} onChange={(e) => setUiLanguage(e.target.value)} className="bg-transparent border-none outline-none text-sm px-2 cursor-pointer dark:text-slate-300">
                      <option value="en">English</option>
                      <option value="he">עברית</option>
                  </select>
                  <button onClick={() => setDarkMode(!darkMode)} className="p-1.5 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200">
                    {darkMode ? <Sun size={16} /> : <Moon size={16} />}
                  </button>
              </div>

              <div dir="ltr" className="fixed top-4 right-4 z-50 no-print text-sm md:text-base text-slate-500 dark:text-slate-400 font-sans pointer-events-none opacity-50 select-none">
                 {appVersion}
              </div>

              <div className={`mx-auto pt-16 md:pt-0 ${layoutMode === 'horizontal' ? 'w-full' : 'max-w-4xl'}`} id="timeline-content">
                <header className="mb-12 text-center group">
                  <div className="mb-6 relative w-full flex justify-center items-start gap-4 group/header">
                     <div className="flex flex-col w-full max-w-2xl gap-2 px-4 md:px-0">
                        <RichTextEditor value={appTitle} onChange={setAppTitle} align={headerAlign} className="text-3xl md:text-4xl font-bold mb-2 bg-transparent transition-colors duration-700" placeholder={t.titlePlaceholder} />
                        <RichTextEditor value={appSubtitle} onChange={setAppSubtitle} align={headerAlign} className="text-sm md:text-base text-slate-500 mb-6 bg-transparent transition-colors duration-700" placeholder={t.subtitlePlaceholder} />
                     </div>

                     <div className="pt-2 opacity-100 md:opacity-0 md:group-hover/header:opacity-100 transition-opacity flex flex-col gap-1 fixed bottom-4 right-4 md:static z-40 md:z-auto bg-white/90 md:bg-transparent dark:bg-slate-900/90 p-2 md:p-0 rounded-lg border md:border-none border-slate-200 dark:border-slate-700 shadow-lg md:shadow-none transition-colors duration-700">
                         <button onClick={() => setHeaderAlign(prev => prev === 'center' ? 'start' : 'center')} className="btn-icon-only" title={headerAlign === 'center' ? (isRtl ? "Align Header Right" : "Align Header Left") : "Align Header Center"}>
                            {headerAlign === 'center' ? (isRtl ? <AlignRight size={18} /> : <AlignLeft size={18} />) : <AlignCenter size={18} />}
                         </button>
                         <button onClick={() => setLayoutMode(prev => prev === 'vertical' ? 'horizontal' : 'vertical')} className="btn-icon-only" title={t.layoutMode}>
                            {layoutMode === 'vertical' ? <GalleryHorizontal size={18} /> : <GalleryVertical size={18} />}
                         </button>
                         <button onClick={cycleNodeAlignMode} className={`btn-icon-only ${nodeAlignMode !== 0 ? 'btn-icon-active' : ''}`} title={getNodeAlignTooltip()}>
                            {getNodeAlignIcon()}
                         </button>
                         <button onClick={cycleTextAlignMode} className={`btn-icon-only ${globalAlignMode !== 0 ? 'btn-icon-active' : ''}`} title={getTextAlignTooltip()}>
                            {getTextAlignIcon()}
                         </button>
                     </div>
                  </div>
                  
                  <div className="flex flex-wrap justify-center gap-3 no-print">
                        <input type="file" ref={fileInputRef} onChange={handleFileChange} style={{display: 'none'}} accept=".json" />
                        <button onClick={handleSaveTemplate} className="btn-framed group transition-colors duration-700"><FileJson size={18} className="mb-1 group-hover:text-green-500"/><span className="text-xs font-medium">{t.save}</span></button>
                        <button onClick={handleLoadTemplateClick} className="btn-framed group transition-colors duration-700"><Upload size={18} className="mb-1 group-hover:text-blue-500"/><span className="text-xs font-medium">{t.load}</span></button>
                        <div className="hidden md:block w-px h-12 bg-slate-200 dark:bg-slate-700 mx-2 transition-colors duration-700"></div>
                        <button onClick={handleExportPDF} className="btn-framed group transition-colors duration-700"><Printer size={18} className="mb-1 group-hover:text-red-500"/><span className="text-xs font-medium">{t.pdf}</span></button>
                        <button onClick={handleExportImage} className="btn-framed group transition-colors duration-700"><Download size={18} className="mb-1 group-hover:text-blue-500"/><span className="text-xs font-medium">{t.image}</span></button>
                  </div>
                </header>

                <div className={`relative pb-24 ${layoutMode === 'horizontal' ? 'flex flex-row overflow-x-auto h-[640px] items-stretch pt-0' : 'block'}`} 
                     dir="ltr" ref={containerRef} onMouseMove={handleMouseMove} onMouseLeave={() => {setHoverY(null); setHoverX(null);}}> 
                  
                  {layoutMode === 'vertical' && (
                       <div className={`absolute top-0 bottom-0 w-1 bg-slate-200 dark:bg-slate-700 left-8 md:left-1/2 -translate-x-1/2 z-0 transition-colors duration-700`}></div>
                  )}
                  
                  {/* Horizontal Spine (Pointer events none allows hover passthrough) */}
                  {layoutMode === 'horizontal' && (
                       <div className="absolute left-0 right-0 h-1 bg-transparent z-0 top-1/2 -translate-y-1/2 pointer-events-none"></div>
                  )}

                  {hoverY !== null && !draggedNodeId && (
                      <div className="absolute left-8 md:left-1/2 -translate-x-1/2 z-30 no-print" style={{ top: hoverY }}>
                          <button onClick={() => addNode(insertIndex)} className="w-6 h-6 rounded-full bg-blue-500 text-white flex items-center justify-center shadow-lg border-2 border-white dark:border-slate-900 transform hover:scale-125 transition-transform"><Plus size={14} /></button>
                      </div>
                  )}
                  {hoverX !== null && !draggedNodeId && (
                      <div className="absolute top-1/2 z-30 no-print" style={{ left: hoverX, transform: 'translate(-50%, -50%)' }}>
                          <button onClick={() => addNode(insertIndex)} className="w-6 h-6 rounded-full bg-blue-500 text-white flex items-center justify-center shadow-lg border-2 border-white dark:border-slate-900 transform hover:scale-125 transition-transform"><Plus size={14} /></button>
                      </div>
                  )}

                  <div className={`${layoutMode === 'vertical' ? 'space-y-0 pt-2 block w-full' : 'flex flex-row w-full items-center'}`}>
                    {renderGroups.map((group, gIdx) => {
                      const main = group.main;
                      const isRight = main.effectiveSide === 'right'; // Horizontal: right=down, left=up
                      
                      if (layoutMode === 'horizontal') {
                        const isUp = !isRight;
                        return (
                          <div key={main.id} className={`relative flex-shrink-0 w-80 px-4 group/wrapper h-full flex flex-col justify-center`} data-group-index={gIdx} data-start-index={main.originalIndex} draggable onDragStart={(e) => handleDragStart(e, main.id)} onDrop={(e) => handleDrop(e, main.id)} onDragOver={(e) => e.preventDefault()}>
                              {/* Horizontal Spine Segment (Per Node) */}
                              <div className="absolute top-1/2 left-0 right-0 h-1 bg-slate-200 dark:bg-slate-700 pointer-events-none z-0 -translate-y-1/2 transition-colors duration-700"></div>

                              {/* Connector */}
                              <div className={`absolute left-1/2 -translate-x-1/2 w-1 h-10 bg-slate-200 dark:bg-slate-700 z-0 transition-colors duration-700 ${isUp ? 'bottom-1/2' : 'top-1/2'}`}></div>
                              
                              {/* Dot */}
                              <div className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-4 h-4 rounded-full bg-white dark:bg-slate-800 border-4 border-blue-500 z-20 transition-colors duration-700"></div>
                              
                              {/* Card Container */}
                              <div className={`absolute w-[90%] left-1/2 -translate-x-1/2 ${isUp ? 'bottom-1/2 mb-10' : 'top-1/2 mt-10'}`}>
                                  <div className="bg-white dark:bg-slate-800 rounded-xl shadow-sm border border-slate-200 dark:border-slate-700 overflow-hidden transition-colors duration-700 max-h-[280px] overflow-y-auto">
                                    <div className="p-4 group/main relative" dir={currentDir}>
                                      {main.date !== null && <RichTextEditor value={main.date || ''} onChange={v => updateNode(main.id, 'date', v)} globalAlignMode={globalAlignMode} className="text-xs font-bold text-blue-600 mb-1 bg-transparent transition-colors duration-700" placeholder={t.datePlaceholder} />}
                                      <RichTextEditor value={main.title} onChange={v => updateNode(main.id, 'title', v)} globalAlignMode={globalAlignMode} className="text-lg font-bold transition-colors duration-700" singleLine placeholder={t.titleNodePlaceholder} />
                                      <RichTextEditor value={main.content} onChange={v => updateNode(main.id, 'content', v)} globalAlignMode={globalAlignMode} className="text-sm text-slate-600 dark:text-slate-400 mt-1 transition-colors duration-700" placeholder={t.descNodePlaceholder} />
                                      <div className="mt-3 flex gap-2 no-print opacity-100 md:opacity-0 group-hover/main:opacity-100 transition-opacity">
                                          <NodeControls node={main} index={main.originalIndex} totalNodes={nodes.length} isSub={false} onIndent={() => updateNode(main.id, 'isSub', true)} onOutdent={() => updateNode(main.id, 'isSub', false)} onToggleSide={() => updateNode(main.id, 'side', main.side === 'right' ? 'left' : 'right')} onDelete={deleteNode} onToggleDate={id => updateNode(id, 'date', main.date === null ? '' : null)} t={t} layoutMode={layoutMode} />
                                      </div>
                                    </div>
                                    {group.children.map(child => <SubNodeRenderer key={child.id} node={child} index={child.originalIndex} totalNodes={nodes.length} t={t} onUpdate={updateNode} onDelete={deleteNode} onIndent={() => updateNode(child.id, 'isSub', true)} onOutdent={() => updateNode(child.id, 'isSub', false)} onToggleSide={() => updateNode(child.id, 'side', child.side === 'right' ? 'left' : 'right')} onToggleDate={id => updateNode(id, 'date', child.date === null ? '' : null)} globalAlignMode={globalAlignMode} onDragStart={handleDragStart} onDragOver={e => e.preventDefault()} onDrop={handleDrop} layoutMode={layoutMode} />)}
                                  </div>
                              </div>
                          </div>
                        )
                      }

                      return (
                      <div key={main.id} className="relative group/wrapper pb-4" data-group-index={gIdx} data-start-index={main.originalIndex} draggable onDragStart={(e) => handleDragStart(e, main.id)} onDrop={(e) => handleDrop(e, main.id)} onDragOver={(e) => e.preventDefault()}>
                        <div className={`timeline-dot absolute rounded-full z-10 w-4 h-4 bg-white dark:bg-slate-800 border-4 border-blue-500 top-8 left-8 md:left-1/2 -translate-x-1/2 transition-colors duration-700`}></div>
                        <div className={`flex flex-col md:flex-row ${isRight ? 'md:flex-row' : 'md:flex-row-reverse'}`}>
                          <div className="hidden md:block w-1/2" />
                          <div className={`w-full md:w-1/2 pl-16 md:pl-0 ${isRight ? 'md:pl-8' : 'md:pr-8'}`} dir={currentDir}>
                            <div className="bg-white dark:bg-slate-800 rounded-xl shadow-sm border border-slate-200 dark:border-slate-700 overflow-hidden transition-colors duration-700">
                              <div className="p-4 group/main relative">
                                {main.date !== null && <RichTextEditor value={main.date || ''} onChange={v => updateNode(main.id, 'date', v)} globalAlignMode={globalAlignMode} className="text-xs font-bold text-blue-600 mb-1 bg-transparent transition-colors duration-700" placeholder={t.datePlaceholder} />}
                                <RichTextEditor value={main.title} onChange={v => updateNode(main.id, 'title', v)} globalAlignMode={globalAlignMode} className="text-lg font-bold transition-colors duration-700" singleLine placeholder={t.titleNodePlaceholder} />
                                <RichTextEditor value={main.content} onChange={v => updateNode(main.id, 'content', v)} globalAlignMode={globalAlignMode} className="text-sm text-slate-600 dark:text-slate-400 mt-1 transition-colors duration-700" placeholder={t.descNodePlaceholder} />
                                <div className="mt-3 flex gap-2 no-print opacity-100 md:opacity-0 group-hover/main:opacity-100 transition-opacity">
                                    <NodeControls node={main} index={main.originalIndex} totalNodes={nodes.length} isSub={false} onIndent={() => updateNode(main.id, 'isSub', true)} onOutdent={() => updateNode(main.id, 'isSub', false)} onToggleSide={() => updateNode(main.id, 'side', main.side === 'right' ? 'left' : 'right')} onDelete={deleteNode} onToggleDate={id => updateNode(id, 'date', main.date === null ? '' : null)} t={t} layoutMode={layoutMode} />
                                </div>
                              </div>
                              {group.children.map(child => <SubNodeRenderer key={child.id} node={child} index={child.originalIndex} totalNodes={nodes.length} t={t} onUpdate={updateNode} onDelete={deleteNode} onIndent={() => updateNode(child.id, 'isSub', true)} onOutdent={() => updateNode(child.id, 'isSub', false)} onToggleSide={() => updateNode(child.id, 'side', child.side === 'right' ? 'left' : 'right')} onToggleDate={id => updateNode(id, 'date', child.date === null ? '' : null)} globalAlignMode={globalAlignMode} onDragStart={handleDragStart} onDragOver={e => e.preventDefault()} onDrop={handleDrop} layoutMode={layoutMode} />)}
                            </div>
                          </div>
                        </div>
                      </div>
                    )})}
                  </div>
                </div>
              </div>
            </div>
          );
        };

        const root = createRoot(document.getElementById('root'));
        root.render(<TimelineApp />);
    </script>
</body>
</html>
