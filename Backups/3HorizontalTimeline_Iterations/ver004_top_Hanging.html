<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hierarchical Timeline Builder</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>
    
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.2.0",
        "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
        "lucide-react": "https://esm.sh/lucide-react@0.263.1"
      }
    }
    </script>
</head>
<body class="bg-slate-50 dark:bg-slate-900 transition-colors duration-300 ease-in-out">
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import React, { useState, useRef, useEffect } from 'react';
        import { createRoot } from 'react-dom/client';
        import { Plus, Trash2, ChevronLeft, ChevronRight, Calendar, Download, Printer, ArrowLeftRight, ArrowUpDown, FileJson, Upload, Indent, Outdent, Globe, AlignCenter, AlignLeft, AlignRight, Sun, Moon, X } from 'lucide-react';

        // --- Translations ---
        const TRANSLATIONS = {
          en: {
            save: "Save Template",
            load: "Load Template",
            pdf: "Export PDF",
            image: "Export Image",
            addNode: "Add Node Here",
            titlePlaceholder: "Enter Title...",
            subtitlePlaceholder: "Enter Subtitle...",
            defaultTitle: "Dynamic Timeline Builder",
            promote: "Promote",
            demote: "Demote",
            moveLeft: "Move Left",
            moveRight: "Move Right",
            delete: "Delete",
            datePlaceholder: "DATE",
            titleNodePlaceholder: "Event Title...",
            descNodePlaceholder: "Description...",
            subTitleNodePlaceholder: "Sub-event Title...",
            subtitleDefault: "Use Ctrl+B/I/U for formatting.<br>©alex tkachenkov",
            toggleDate: "Toggle Date",
            reverseTimeline: "Reverse Timeline Direction"
          },
          he: {
            save: "שמור תבנית",
            load: "טען תבנית",
            pdf: "ייצוא PDF",
            image: "ייצוא תמונה",
            addNode: "הוסף אירוע כאן",
            titlePlaceholder: "הכנס כותרת...",
            subtitlePlaceholder: "הכנס כותרת משנה...",
            defaultTitle: "בניית ציר זמן דינמי",
            promote: "הפוך לראשי",
            demote: "הפוך למשני",
            moveLeft: "הזז ימינה",
            moveRight: "הזז שמאלה",
            delete: "מחק",
            datePlaceholder: "תאריך",
            titleNodePlaceholder: "כותרת האירוע...",
            descNodePlaceholder: "תיאור...",
            subTitleNodePlaceholder: "כותרת תת-אירוע...",
            subtitleDefault: "השתמשו ב-Ctrl+B/I/U לעיצוב.<br>©אלכס טקצ'נקוב",
            toggleDate: "הצג/הסתר תאריך",
            reverseTimeline: "הפוך כיוון ציר זמן"
          }
        };

        // --- Rich Text Editor Component ---
        const RichTextEditor = ({ value, onChange, className, placeholder, singleLine = false, align = 'start' }) => {
          const editorRef = useRef(null);

          useEffect(() => {
            if (editorRef.current && editorRef.current.innerHTML !== value) {
              if (document.activeElement !== editorRef.current) {
                 editorRef.current.innerHTML = value || '';
              }
            }
          }, [value]);

          const handleInput = (e) => {
            onChange(e.currentTarget.innerHTML);
          };

          const handleKeyDown = (e) => {
            if (singleLine && e.key === 'Enter') {
              e.preventDefault();
              return;
            }
          };

          const alignClass = align === 'center' ? 'text-center' : (align === 'right' ? 'text-right' : 'text-start');

          return (
            <div className={`relative group/editor w-full ${alignClass}`}>
              <div
                ref={editorRef}
                contentEditable
                className={`${className} empty:before:content-[attr(data-placeholder)] empty:before:text-slate-300 dark:empty:before:text-slate-500 cursor-text outline-none z-10 relative inline-block min-w-[50px] whitespace-pre-wrap break-words`}
                onInput={handleInput}
                onKeyDown={handleKeyDown}
                suppressContentEditableWarning={true}
                data-placeholder={placeholder}
                dir="auto"
              />
            </div>
          );
        };

        // --- Inline Controls Component ---
        const NodeControls = ({ node, index, isSub, totalNodes, onIndent, onOutdent, onMove, onDelete, onToggleDate, t }) => (
            <div className="flex flex-row items-center gap-1 flex-wrap">
               {/* Date Toggle */}
               <button onClick={() => onToggleDate(node.id)} className={`p-1.5 rounded transition-colors ${node.date !== null ? 'text-blue-600 bg-blue-50 dark:text-blue-400 dark:bg-blue-900/30' : 'text-slate-400 hover:text-blue-500 dark:text-slate-500 dark:hover:text-blue-400'}`} title={t.toggleDate}>
                  <Calendar size={14} />
               </button>

               <div className="w-px h-4 bg-slate-200 dark:bg-slate-700 mx-0.5"></div>

               {/* Indent/Outdent */}
               {isSub ? (
                   <button onClick={() => onOutdent(index)} className="p-1.5 text-slate-400 hover:text-orange-600 hover:bg-orange-50 dark:hover:bg-orange-900/30 rounded" title={t.promote}>
                      <Outdent size={14} />
                   </button>
               ) : (
                   <button onClick={() => onIndent(index)} className="p-1.5 text-slate-400 hover:text-blue-600 hover:bg-blue-50 dark:hover:bg-blue-900/30 rounded" title={t.demote}>
                      <Indent size={14} />
                   </button>
               )}
               
               <div className="w-px h-4 bg-slate-200 dark:bg-slate-700 mx-0.5"></div>

               {/* Movement Controls (Left/Right) */}
               <button onClick={() => onMove(index, 'up')} disabled={index === 0} className="p-1.5 text-slate-400 hover:text-blue-600 hover:bg-slate-50 dark:hover:bg-slate-700 rounded disabled:opacity-30" title={t.moveLeft}>
                   <ChevronLeft size={14} />
               </button>
               <button onClick={() => onMove(index, 'down')} disabled={index === totalNodes - 1} className="p-1.5 text-slate-400 hover:text-blue-600 hover:bg-slate-50 dark:hover:bg-slate-700 rounded disabled:opacity-30" title={t.moveRight}>
                   <ChevronRight size={14} />
               </button>
               
               {/* Delete */}
               <button onClick={() => onDelete(node.id)} className="p-1.5 text-slate-400 hover:text-red-500 hover:bg-red-50 dark:hover:bg-red-900/30 rounded" title={t.delete}><Trash2 size={14} /></button>
            </div>
        );

        const SubNodeRenderer = ({ node, index, totalNodes, onUpdate, onDelete, onToggleDate, onIndent, onOutdent, onMove, t }) => {
            return (
              <div className="relative p-4 border-t border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 first:border-t-0 group/sub hover:bg-slate-50/50 dark:hover:bg-slate-700/50 transition-colors duration-300 ease-in-out">
                 <div className="absolute right-0 top-0 bottom-0 w-[4px] bg-slate-200 dark:bg-slate-700 group-hover/sub:bg-blue-300 dark:group-hover/sub:bg-blue-600 transition-colors duration-300 ease-in-out"></div>
                 
                 <div className="space-y-2 relative z-10">
                     {node.date !== null && (
                         <input
                             type="text"
                             value={node.date}
                             onChange={(e) => onUpdate(node.id, 'date', e.target.value)}
                             className="w-full font-semibold uppercase tracking-wider bg-transparent border-none focus:outline-none placeholder-blue-300 text-xs text-blue-600 dark:text-blue-400 dark:placeholder-blue-700"
                             placeholder={t.datePlaceholder}
                         />
                     )}
                     
                     <div className="flex items-center gap-2">
                        <RichTextEditor
                            value={node.title}
                            onChange={(val) => onUpdate(node.id, 'title', val)}
                            singleLine={true}
                            className="w-full font-bold text-slate-800 dark:text-slate-100 text-lg border-b border-transparent hover:border-slate-200 dark:hover:border-slate-600 focus:border-blue-500 transition-colors py-1"
                            placeholder={t.subTitleNodePlaceholder}
                        />
                     </div>
                     
                     <div className="relative group/content">
                        <RichTextEditor
                            value={node.content}
                            onChange={(val) => onUpdate(node.id, 'content', val)}
                            className="w-full text-slate-600 dark:text-slate-300 text-sm min-h-[20px]"
                            placeholder={t.descNodePlaceholder}
                        />
                     </div>
                 </div>
                 
                 <div className="mt-3 pt-2 flex justify-start items-center gap-2 no-print opacity-100 md:opacity-0 group-hover/sub:opacity-100 transition-opacity">
                     <NodeControls 
                        node={node} 
                        index={index} 
                        isSub={true} 
                        totalNodes={totalNodes}
                        onIndent={onIndent}
                        onOutdent={onOutdent}
                        onMove={onMove}
                        onDelete={onDelete}
                        onToggleDate={onToggleDate}
                        t={t}
                     />
                 </div>
              </div>
            );
        };

        const TimelineApp = () => {
          const fileInputRef = useRef(null);
          const containerRef = useRef(null);
          const exportContainerRef = useRef(null);
          const timelineContentRef = useRef(null);
          
          const [uiLanguage, setUiLanguage] = useState('en');
          const [isReversed, setIsReversed] = useState(false); // Controls LTR/RTL flow
          
          const [darkMode, setDarkMode] = useState(() => {
              if (typeof window !== 'undefined' && window.matchMedia) {
                  return window.matchMedia('(prefers-color-scheme: dark)').matches;
              }
              return false;
          });

          useEffect(() => {
              const mediaQuery = window.matchMedia('(prefers-color-scheme: dark)');
              const handleChange = (e) => setDarkMode(e.matches);
              mediaQuery.addEventListener('change', handleChange);
              return () => mediaQuery.removeEventListener('change', handleChange);
          }, []);

          const t = TRANSLATIONS[uiLanguage];
          const [appTitle, setAppTitle] = useState("Dynamic Timeline Builder"); 
          const [appSubtitle, setAppSubtitle] = useState("Use Ctrl+B/I/U for formatting.<br>©alex tkachenkov");

          useEffect(() => {
             if (appSubtitle === TRANSLATIONS['en'].subtitleDefault || appSubtitle === TRANSLATIONS['he'].subtitleDefault) {
                 setAppSubtitle(t.subtitleDefault);
             }
             if (appTitle === TRANSLATIONS['en'].defaultTitle || appTitle === TRANSLATIONS['he'].defaultTitle) {
                 setAppTitle(t.defaultTitle);
             }
          }, [uiLanguage, t.subtitleDefault, t.defaultTitle, appSubtitle, appTitle]);

          useEffect(() => {
            if (darkMode) document.documentElement.classList.add('dark');
            else document.documentElement.classList.remove('dark');
          }, [darkMode]);

          const [nodes, setNodes] = useState(() => {
            try {
              const saved = localStorage.getItem('timeline_nodes');
              if (saved) {
                let parsed = JSON.parse(saved);
                return parsed.map((n, i) => ({
                     ...n, 
                     side: 'right', // Force right/down side for data consistency
                     type: 'event',
                     isSub: n.isSub || false
                }));
              }
            } catch (e) { console.error(e); }
            return [
              { "id": "root-mech", "type": "event", "side": "right", "title": "Mechanical Roots", "date": "19th Century", "content": "Before electricity, computer concepts were born as mechanical machines.", "isSub": false },
              { "id": "init-2", "type": "event", "side": "right", "title": "Charles Babbage", "date": "1837", "content": "Babbage designed a mechanical machine with all modern computer elements.", "isSub": true },
            ];
          });

          useEffect(() => {
            localStorage.setItem('timeline_nodes', JSON.stringify(nodes));
          }, [nodes]);

          useEffect(() => {
            const loadScript = (src, id) => {
                if (!document.getElementById(id)) {
                    const script = document.createElement('script');
                    script.src = src;
                    script.id = id;
                    script.async = true;
                    document.body.appendChild(script);
                }
            };
            loadScript("https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js", "html2canvas-script");
            loadScript("https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js", "jspdf-script");
          }, []);

          const generateId = () => Math.random().toString(36).substr(2, 9);

          const getRenderGroups = () => {
            const groups = [];
            let currentGroup = null;
            nodes.forEach((node, index) => {
                if (node.isSub && currentGroup) {
                    currentGroup.children.push({ ...node, originalIndex: index });
                } else {
                    if (currentGroup) groups.push(currentGroup);
                    currentGroup = { type: 'group', main: { ...node, originalIndex: index }, children: [] };
                }
            });
            if (currentGroup) groups.push(currentGroup);
            
            return isReversed ? groups.reverse() : groups;
          };

          const renderGroups = getRenderGroups();

          const addNode = (index) => {
            const newNode = { id: generateId(), type: 'event', side: 'right', title: 'New Event', date: '', content: '', isSub: false };
            const newNodes = [...nodes];
            newNodes.splice(index, 0, newNode);
            setNodes(newNodes);
          };

          const deleteNode = (id) => {
            if (nodes.length <= 1) return;
            setNodes(nodes.filter(n => n.id !== id));
          };

          const moveNode = (index, direction) => {
            if (direction === 'up' && index === 0) return;
            if (direction === 'down' && index === nodes.length - 1) return;
            const newNodes = [...nodes];
            const targetIndex = direction === 'up' ? index - 1 : index + 1;
            const temp = newNodes[index];
            newNodes[index] = newNodes[targetIndex];
            newNodes[targetIndex] = temp;
            setNodes(newNodes);
          };

          const updateNode = (id, field, value) => {
            setNodes(nodes.map(n => n.id === id ? { ...n, [field]: value } : n));
          };

          const indentNode = (index) => {
              const newNodes = [...nodes];
              newNodes[index] = { ...newNodes[index], isSub: true };
              setNodes(newNodes);
          };

          const outdentNode = (index) => {
              const newNodes = [...nodes];
              newNodes[index] = { ...newNodes[index], isSub: false };
              setNodes(newNodes);
          };

          // Removed toggleNodeSide as layout is now single-sided
          const toggleNodeSide = (id) => {
             // No-op or implementation kept but unused in UI to prevent crashes
          };

          const toggleDate = (id) => {
            setNodes(nodes.map(n => {
                if (n.id === id) {
                    if (n.date === null) {
                         return { ...n, date: n.savedDate !== undefined ? n.savedDate : '' };
                    } else {
                         return { ...n, date: null, savedDate: n.date };
                    }
                }
                return n;
            }));
          };
          
          // Removed mirrorSides button action

          // --- EXPORT ---
          const handleExportImage = async () => {
            if (window.html2canvas) {
                const exportEl = exportContainerRef.current;
                const timelineContent = timelineContentRef.current;
                
                const originalBg = exportEl.style.backgroundColor;
                const originalPadding = exportEl.style.padding;
                const originalTimelineWidth = timelineContent.style.width;
                const originalTimelineOverflow = timelineContent.style.overflow;
                
                const isDark = document.documentElement.classList.contains('dark');
                const bgColor = isDark ? '#0f172a' : '#f8fafc';
                
                // Prepare for export
                exportEl.style.backgroundColor = bgColor;
                exportEl.style.padding = '40px';
                
                // Ensure full width
                timelineContent.style.width = 'max-content';
                timelineContent.style.overflow = 'visible';

                try {
                    const canvas = await window.html2canvas(exportEl, { 
                        backgroundColor: bgColor, 
                        scale: 2, 
                        useCORS: true, 
                        ignoreElements: (element) => element.classList.contains('no-print') 
                    });
                    const link = document.createElement('a');
                    link.download = 'timeline.png';
                    link.href = canvas.toDataURL();
                    link.click();
                } finally { 
                    // Restore styles
                    exportEl.style.backgroundColor = originalBg; 
                    exportEl.style.padding = originalPadding;
                    timelineContent.style.width = originalTimelineWidth;
                    timelineContent.style.overflow = originalTimelineOverflow;
                }
            } else { alert("Loading libraries..."); }
          };

          const handleExportPDF = async () => {
              if (window.html2canvas && window.jspdf) {
                const { jsPDF } = window.jspdf;
                const exportEl = exportContainerRef.current;
                const timelineContent = timelineContentRef.current;
                
                const isDark = document.documentElement.classList.contains('dark');
                const originalBg = exportEl.style.backgroundColor;
                const originalPadding = exportEl.style.padding;
                const originalTimelineWidth = timelineContent.style.width;
                const originalTimelineOverflow = timelineContent.style.overflow;
                
                const bgColor = isDark ? '#0f172a' : '#ffffff';
                
                exportEl.style.backgroundColor = bgColor;
                exportEl.style.padding = '40px'; 
                
                timelineContent.style.width = 'max-content';
                timelineContent.style.overflow = 'visible';

                try {
                    const canvas = await window.html2canvas(exportEl, { 
                        backgroundColor: bgColor, 
                        scale: 2, 
                        useCORS: true, 
                        ignoreElements: (element) => element.classList.contains('no-print') 
                    });
                    const imgData = canvas.toDataURL('image/png');
                    
                    // Create Landscape PDF
                    const pdf = new jsPDF('l', 'mm', 'a4');
                    
                    const pdfWidth = pdf.internal.pageSize.getWidth();
                    const pdfHeight = pdf.internal.pageSize.getHeight();
                    const imgProps = pdf.getImageProperties(imgData);
                    
                    const imgHeight = (imgProps.height * pdfWidth) / imgProps.width;
                    
                    if (imgHeight > pdfHeight) {
                         const customPdf = new jsPDF('l', 'mm', [pdfWidth, imgHeight + 20]);
                         customPdf.addImage(imgData, 'PNG', 0, 0, pdfWidth, imgHeight);
                         customPdf.save('timeline.pdf');
                    } else {
                         pdf.addImage(imgData, 'PNG', 0, 0, pdfWidth, imgHeight);
                         pdf.save('timeline.pdf');
                    }
                } finally { 
                    exportEl.style.backgroundColor = originalBg; 
                    exportEl.style.padding = originalPadding;
                    timelineContent.style.width = originalTimelineWidth;
                    timelineContent.style.overflow = originalTimelineOverflow;
                }
              } else { alert("PDF library loading..."); }
          };

          const handleSaveTemplate = () => {
              const cleanNodes = nodes.map(node => ({ id: node.id, type: node.type || 'event', side: node.side, title: node.title, date: node.date, content: node.content, comments: node.comments || [], isSub: node.isSub }));
              const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(cleanNodes, null, 2));
              const downloadAnchorNode = document.createElement('a');
              downloadAnchorNode.setAttribute("href", dataStr);
              downloadAnchorNode.setAttribute("download", "timeline_template.json");
              document.body.appendChild(downloadAnchorNode);
              downloadAnchorNode.click();
              downloadAnchorNode.remove();
          };

          const handleLoadTemplateClick = () => { fileInputRef.current.click(); };
          const handleFileChange = (e) => {
              const fileReader = new FileReader();
              fileReader.readAsText(e.target.files[0], "UTF-8");
              fileReader.onload = e => {
                  try {
                      const parsed = JSON.parse(e.target.result);
                      if (Array.isArray(parsed)) setNodes(parsed);
                      else alert("Invalid file format");
                  } catch (err) { alert("Error parsing file"); }
              };
              e.target.value = null; 
          };

          const currentDir = uiLanguage === 'he' ? 'rtl' : 'ltr';

          return (
            <div className="min-h-screen bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 p-2 md:p-4 font-sans transition-colors duration-300 ease-in-out flex flex-col" dir={currentDir}>
              <style>{`
                @media print {
                  .no-print { display: none !important; }
                  body { background-color: white; }
                  .print-break-inside-avoid { break-inside: avoid; }
                }
                .btn-framed { 
                    @apply flex flex-col items-center justify-center 
                    w-12 h-12 md:w-28 md:h-16 
                    bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl shadow-sm transition-all hover:border-slate-300 dark:hover:border-slate-600 hover:shadow-md active:scale-95; 
                }
                /* Custom scrollbar for horizontal timeline */
                .horizontal-scroll::-webkit-scrollbar {
                    height: 8px;
                }
                .horizontal-scroll::-webkit-scrollbar-track {
                    background: transparent;
                }
                .horizontal-scroll::-webkit-scrollbar-thumb {
                    background-color: #cbd5e1;
                    border-radius: 4px;
                }
                .dark .horizontal-scroll::-webkit-scrollbar-thumb {
                    background-color: #475569;
                }
              `}</style>

              {/* Header Controls */}
              <div className="w-full max-w-[95%] mx-auto mb-4 md:mb-6 flex flex-wrap items-center justify-between gap-4 no-print relative z-50" dir="ltr">
                   {/* Left Side: Language, Mode, Theme */}
                   <div className="flex items-center gap-2 bg-white dark:bg-slate-800 p-2 rounded-lg border border-slate-200 dark:border-slate-700 shadow-sm overflow-x-auto max-w-full">
                      <Globe size={16} className="text-slate-400 shrink-0" />
                      <select value={uiLanguage} onChange={(e) => setUiLanguage(e.target.value)} className="bg-transparent border-none outline-none text-sm text-slate-600 dark:text-slate-300 cursor-pointer bg-white dark:bg-slate-800">
                          <option value="en">English</option>
                          <option value="he">עברית</option>
                      </select>
                      <div className="w-px h-4 bg-slate-200 dark:bg-slate-700 mx-1 shrink-0"></div>
                      <button onClick={() => setDarkMode(!darkMode)} className="p-1.5 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 rounded-md transition-colors shrink-0">
                        {darkMode ? <Moon size={16} /> : <Sun size={16} />}
                      </button>
                      
                      <div className="w-px h-4 bg-slate-200 dark:bg-slate-700 mx-1 shrink-0"></div>
                      
                      <button onClick={() => setIsReversed(!isReversed)} className="p-1.5 text-slate-400 hover:text-blue-600 dark:hover:text-blue-400 rounded-md transition-colors shrink-0" title={t.reverseTimeline}>
                         <ArrowLeftRight size={16} />
                      </button>
                   </div>

                   {/* Center/Right: Actions */}
                   <div className="flex flex-wrap items-center gap-2">
                        <input type="file" ref={fileInputRef} onChange={handleFileChange} style={{display: 'none'}} accept=".json" />
                        
                        <button onClick={handleSaveTemplate} className="btn-framed group" title={t.save}>
                            <FileJson size={20} className="text-slate-400 dark:text-slate-500 group-hover:text-green-600 dark:group-hover:text-green-400" />
                        </button>
                        <button onClick={handleLoadTemplateClick} className="btn-framed group" title={t.load}>
                            <Upload size={20} className="text-slate-400 dark:text-slate-500 group-hover:text-blue-600 dark:group-hover:text-blue-400" />
                        </button>
                        <button onClick={handleExportPDF} className="btn-framed group hover:border-red-300 dark:hover:border-red-700 hover:bg-red-50 dark:hover:bg-red-900/10" title={t.pdf}>
                            <Printer size={20} className="text-slate-400 dark:text-slate-500 group-hover:text-red-600 dark:group-hover:text-red-400" />
                        </button>
                        <button onClick={handleExportImage} className="btn-framed group hover:border-blue-300 dark:hover:border-blue-700 hover:bg-blue-50 dark:hover:bg-blue-900/10" title={t.image}>
                            <Download size={20} className="text-slate-400 dark:text-slate-500 group-hover:text-blue-600 dark:group-hover:text-blue-400" />
                        </button>
                   </div>
              </div>

              {/* WRAPPER FOR EXPORT - Responsive Layout: Column on mobile, Row on desktop */}
              <div 
                 ref={exportContainerRef} 
                 id="export-container"
                 className="flex-1 w-full flex flex-col md:flex-row items-stretch overflow-x-auto horizontal-scroll px-4 md:px-12 pt-6 md:pt-12 pb-12"
              >

                {/* Title Section - Full width on mobile, Fixed on desktop */}
                <div 
                  className={`mb-4 md:mb-8 group/header relative flex-shrink-0 w-full md:w-80 md:pr-12 text-left md:mr-8 ${currentDir === 'rtl' ? 'md:pl-8 md:ml-auto md:text-right md:ml-8' : 'md:pr-12 md:text-left md:mr-8'}`}
                >
                     <div className="flex flex-col w-full gap-2">
                        <div className={`w-full ${appTitle === t.defaultTitle ? 'no-print' : ''}`}>
                            <RichTextEditor
                                value={appTitle}
                                onChange={setAppTitle}
                                placeholder={t.titlePlaceholder}
                                align={currentDir === 'rtl' ? 'right' : 'start'}
                                className={`text-2xl md:text-4xl font-bold text-slate-900 dark:text-white bg-transparent border-b border-transparent hover:border-slate-300 dark:hover:border-slate-600 focus:border-blue-500 focus:outline-none w-full transition-colors pb-2`}
                            />
                        </div>
                        <div className={`w-full ${appSubtitle === t.subtitleDefault ? 'no-print' : ''}`}>
                            <RichTextEditor
                                value={appSubtitle}
                                onChange={setAppSubtitle}
                                placeholder={t.subtitlePlaceholder}
                                align={currentDir === 'rtl' ? 'right' : 'start'}
                                className={`text-slate-500 dark:text-slate-400 bg-transparent border-b border-transparent hover:border-slate-300 dark:hover:border-slate-600 focus:border-blue-500 focus:outline-none w-full transition-colors pb-1`}
                            />
                        </div>
                     </div>
                </div>

                {/* Timeline Container */}
                <div 
                    className="relative transition-all duration-500 ease-in-out flex-1 flex flex-row items-start min-h-[400px]" 
                    id="timeline-content"
                    dir="ltr"
                    ref={(el) => { containerRef.current = el; timelineContentRef.current = el; }}
                > 
                  {/* Central Line - Fixed at Top (48px / top-12) */}
                  <div className="absolute bg-slate-200 dark:bg-slate-700 z-0 pointer-events-none top-12 left-0 right-0 h-1"></div>
                  
                  <div className="flex flex-row gap-0">
                    {/* Explicit Add Button at Start */}
                    <div className="flex flex-col justify-start items-center px-1 md:px-2 min-w-[30px] relative">
                         <div className="absolute h-1 w-full bg-slate-200 dark:bg-slate-700 top-12 -z-10"></div>
                         <button 
                            onClick={() => addNode(0)} 
                            className="w-6 h-6 rounded-full bg-slate-200 dark:bg-slate-700 hover:bg-blue-500 hover:text-white dark:hover:bg-blue-500 text-slate-500 dark:text-slate-400 transition-colors flex items-center justify-center no-print z-20 mt-[38px] md:mt-[38px]"
                            title={t.addNode}
                         >
                            <Plus size={14} />
                         </button>
                    </div>

                    {renderGroups.map((group, groupIndex) => {
                      const mainNode = group.main;
                      const children = group.children || [];
                      const index = mainNode.originalIndex;
                      const lastIndex = index + children.length; 
                      
                      return (
                      <React.Fragment key={mainNode.id}>
                          <div className="relative group/wrapper print-break-inside-avoid flex-shrink-0 flex flex-col justify-start min-w-[85vw] md:min-w-[320px] h-auto" data-group-index={groupIndex} data-start-index={index} data-last-index={lastIndex}>
                            
                            {/* Dot - Fixed on the Line at top-12 */}
                            <div className="timeline-dot absolute rounded-full z-20 shadow-sm transition-all w-4 h-4 bg-white dark:bg-slate-800 border-4 border-blue-500 group-hover/wrapper:scale-125 top-12 left-1/2 -translate-x-1/2 -translate-y-1/2"></div>
                            
                            {/* Vertical Connector Line from Dot to Card */}
                            <div className="absolute top-12 left-1/2 w-[2px] h-8 bg-slate-200 dark:bg-slate-700 -translate-x-1/2 -z-10"></div>

                            {/* Node Card - Hanging Down */}
                            <div className="flex flex-col justify-start pt-20 px-2 md:px-4">
                                <NodeCard 
                                    mainNode={mainNode} 
                                    children={children} 
                                    nodes={nodes} 
                                    t={t} 
                                    index={index}
                                    actions={{updateNode, deleteNode, indentNode, outdentNode, toggleNodeSide, moveNode, toggleDate, currentDir}}
                                    isTopSection={false}
                                />
                            </div>
                          </div>

                          {/* Add Button After Each Group */}
                          <div className="flex flex-col justify-start items-center px-1 md:px-2 min-w-[30px] relative">
                             <div className="absolute h-1 w-full bg-slate-200 dark:bg-slate-700 top-12 -z-10"></div>
                             <button 
                                onClick={() => addNode(index + 1 + (children ? children.length : 0))} 
                                className="w-6 h-6 rounded-full bg-slate-200 dark:bg-slate-700 hover:bg-blue-500 hover:text-white dark:hover:bg-blue-500 text-slate-500 dark:text-slate-400 transition-colors flex items-center justify-center no-print z-20 opacity-100 group-hover/wrapper:opacity-100 mt-[38px] md:mt-[38px]"
                                title={t.addNode}
                             >
                                <Plus size={14} />
                             </button>
                          </div>
                      </React.Fragment>
                    )})}
                  </div>
                </div>
              </div>
            </div>
          );
        };

        // Extracted NodeCard
        const NodeCard = ({ mainNode, children, nodes, t, index, actions, isTopSection }) => {
            const { updateNode, deleteNode, indentNode, outdentNode, moveNode, toggleDate, currentDir } = actions;
            
            return (
                <div className="bg-white dark:bg-slate-800 rounded-xl shadow-sm border border-slate-200 dark:border-slate-700 relative hover:shadow-md transition-all overflow-hidden duration-300 ease-in-out w-full md:w-80 flex flex-col" dir={currentDir}>
                    
                    {/* Main Content Area */}
                    <div className="p-4 relative z-10 bg-white dark:bg-slate-800 group/main-content transition-colors duration-300 ease-in-out">
                        <div className="space-y-2">
                            {mainNode.date !== null && (
                                <input type="text" value={mainNode.date} onChange={(e) => updateNode(mainNode.id, 'date', e.target.value)} className="w-full font-semibold uppercase tracking-wider bg-transparent border-none focus:outline-none placeholder-blue-300 text-xs text-blue-600 dark:text-blue-400 dark:placeholder-blue-700" placeholder={t.datePlaceholder} />
                            )}
                            <RichTextEditor value={mainNode.title} onChange={(val) => updateNode(mainNode.id, 'title', val)} singleLine={true} className="w-full font-bold text-slate-800 dark:text-slate-100 text-lg border-b border-transparent hover:border-slate-200 dark:hover:border-slate-600 focus:border-blue-500 transition-colors py-1" placeholder={t.titleNodePlaceholder} />
                            
                            <div className="relative group/content">
                                <RichTextEditor value={mainNode.content} onChange={(val) => updateNode(mainNode.id, 'content', val)} className="w-full text-slate-600 dark:text-slate-300 text-sm min-h-[40px]" placeholder={t.descNodePlaceholder} />
                            </div>
                        </div>

                        {/* Main Node Actions - Always visible on mobile, hover on desktop */}
                        <div className="mt-3 pt-2 border-t border-slate-100 dark:border-slate-700 flex justify-start items-center no-print opacity-100 md:opacity-0 group-hover/main-content:opacity-100 transition-opacity">
                            <NodeControls 
                                node={mainNode} 
                                index={index} 
                                isSub={false} 
                                totalNodes={nodes.length}
                                onIndent={indentNode}
                                onOutdent={outdentNode}
                                onMove={moveNode}
                                onDelete={deleteNode}
                                onToggleDate={toggleDate}
                                t={t}
                            />
                        </div>
                    </div>

                    {/* Sub Nodes Area */}
                    {children.length > 0 && (
                        <div className="border-t border-slate-200 dark:border-slate-700">
                            {children.map((child) => (
                                <SubNodeRenderer 
                                key={child.id} 
                                node={child} 
                                index={child.originalIndex}
                                totalNodes={nodes.length}
                                onUpdate={updateNode}
                                onDelete={deleteNode}
                                onToggleDate={toggleDate}
                                onIndent={indentNode}
                                onOutdent={outdentNode}
                                onMove={moveNode}
                                t={t}
                                />
                            ))}
                        </div>
                    )}
                </div>
            );
        };

        const root = createRoot(document.getElementById('root'));
        root.render(<TimelineApp />);
    </script>
</body>
</html>
