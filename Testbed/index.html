<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hierarchical Timeline Builder</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>
    
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.2.0",
        "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
        "lucide-react": "https://esm.sh/lucide-react@0.263.1"
      }
    }
    </script>
    <style>
        @media print {
            .no-print { display: none !important; }
            body { background-color: white; }
            .print-break-inside-avoid { break-inside: avoid; }
        }
        .btn-framed { 
            @apply flex flex-col items-center justify-center w-24 md:w-32 h-14 md:h-16 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl shadow-sm transition-all hover:border-slate-300 dark:hover:border-slate-600 hover:shadow-md active:scale-95 cursor-pointer; 
        }
        /* Custom scrollbar for better aesthetics */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        .dark ::-webkit-scrollbar-thumb {
            background: #475569;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
        .drag-handle {
            cursor: grab;
        }
        .drag-handle:active {
            cursor: grabbing;
        }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-900 transition-colors duration-300 ease-in-out">
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import React, { useState, useRef, useEffect } from 'react';
        import { createRoot } from 'react-dom/client';
        import { Plus, Trash2, ChevronDown, ChevronUp, Calendar, Download, Printer, ArrowLeftRight, FileJson, Upload, Indent, Outdent, Globe, AlignCenter, AlignLeft, AlignRight, Sun, Moon, RefreshCcw, X, Info, GripVertical, GalleryHorizontal, GalleryVertical } from 'lucide-react';

        // --- Translations ---
        const TRANSLATIONS = {
          en: {
            save: "Save Template",
            load: "Load Template",
            pdf: "Export PDF",
            image: "Export Image",
            addStart: "Add Start",
            addEnd: "Add End",
            addStartTooltip: "Add Start Node",
            addEndTooltip: "Add End Node",
            addNode: "Add Node Here",
            titlePlaceholder: "Enter Title...",
            subtitlePlaceholder: "Enter Subtitle...",
            defaultTitle: "Dynamic Timeline Builder.<br>click here to change title",
            promote: "Promote",
            demote: "Demote",
            switchSide: "Switch Side",
            moveUp: "Move Up",
            moveDown: "Move Down",
            delete: "Delete",
            datePlaceholder: "DATE",
            titleNodePlaceholder: "Event Title...",
            descNodePlaceholder: "Description...",
            subTitleNodePlaceholder: "Sub-event Title...",
            alignCenter: "Align Center",
            alignSide: "Align Start",
            autoAlign: "Auto Align Sides",
            subtitleDefault: "Use Ctrl+B/I/U for formatting.<br>©alex tkachenkov",
            toggleDate: "Toggle Date",
            loading: "Loading libraries...",
            invalidFormat: "Invalid file format",
            parseError: "Error parsing file",
            exportSuccess: "Export initiated",
            dragHandle: "Drag to reorder",
            layoutMode: "Toggle Layout"
          },
          he: {
            save: "שמור תבנית",
            load: "טען תבנית",
            pdf: "ייצוא PDF",
            image: "ייצוא תמונה",
            addStart: "הוסף התחלה",
            addEnd: "הוסף סיום",
            addStartTooltip: "הוסף התחלה",
            addEndTooltip: "הוסף סיום",
            addNode: "הוסף אירוע כאן",
            titlePlaceholder: "הכנס כותרת...",
            subtitlePlaceholder: "הכנס כותרת משנה...",
            defaultTitle: "בניית ציר זמן דינמי.<br>לחצו כאן כדי לשנות כותרת",
            promote: "הפוך לראשי",
            demote: "הפוך למשני",
            switchSide: "החלף צד",
            moveUp: "הזז למעלה",
            moveDown: "הזז למטה",
            delete: "מחק",
            datePlaceholder: "תאריך",
            titleNodePlaceholder: "כותרת האירוע...",
            descNodePlaceholder: "תיאור...",
            subTitleNodePlaceholder: "כותרת תת-אירוע...",
            alignCenter: "יישור למרכז",
            alignSide: "יישור להתחלה",
            autoAlign: "סידור אוטומטי לצדדים",
            subtitleDefault: "השתמשו ב-Ctrl+B/I/U לעיצוב.<br>©אלכס טקצ'נקוב",
            toggleDate: "הצג/הסתר תאריך",
            loading: "טוען ספריות...",
            invalidFormat: "פורמט קובץ לא תקין",
            parseError: "שגיאה בטעינת הקובץ",
            exportSuccess: "ייצוא התחיל",
            dragHandle: "גרור לשינוי סדר",
            layoutMode: "שנה תצוגה"
          }
        };

        // --- Toast Component ---
        const Toast = ({ message, onClose }) => {
            useEffect(() => {
                const timer = setTimeout(onClose, 3000);
                return () => clearTimeout(timer);
            }, [onClose]);

            if (!message) return null;

            return (
                <div className="fixed bottom-6 left-1/2 transform -translate-x-1/2 z-[100] animate-fade-in-up">
                    <div className="bg-slate-800 dark:bg-slate-100 text-white dark:text-slate-900 px-6 py-3 rounded-full shadow-lg flex items-center gap-2 text-sm font-medium">
                        <Info size={16} />
                        {message}
                    </div>
                </div>
            );
        };

        // --- Rich Text Editor Component ---
        const RichTextEditor = ({ value, onChange, className, placeholder, singleLine = false, align = 'start' }) => {
          const editorRef = useRef(null);

          useEffect(() => {
            if (editorRef.current && editorRef.current.innerHTML !== value) {
              if (document.activeElement !== editorRef.current) {
                 editorRef.current.innerHTML = value || '';
              }
            }
          }, [value]);

          const handleInput = (e) => {
            onChange(e.currentTarget.innerHTML);
          };

          const handleKeyDown = (e) => {
            if (singleLine && e.key === 'Enter') {
              e.preventDefault();
              return;
            }
          };

          const alignClass = align === 'center' ? 'text-center' : 'text-start';

          return (
            <div className={`relative group/editor w-full ${alignClass}`}>
              <div
                ref={editorRef}
                contentEditable
                className={`${className} empty:before:content-[attr(data-placeholder)] empty:before:text-slate-300 dark:empty:before:text-slate-500 cursor-text outline-none z-10 relative inline-block min-w-[50px]`}
                onInput={handleInput}
                onKeyDown={handleKeyDown}
                suppressContentEditableWarning={true}
                data-placeholder={placeholder}
                dir="auto"
              />
            </div>
          );
        };

        // --- Inline Controls Component ---
        const NodeControls = ({ node, index, isSub, totalNodes, onIndent, onOutdent, onToggleSide, onMove, onDelete, onToggleDate, t }) => (
            <div className="flex flex-row items-center gap-1">
               {/* Drag Handle */}
               <div className="drag-handle p-1.5 text-slate-300 hover:text-slate-500 dark:text-slate-600 dark:hover:text-slate-400 rounded cursor-grab active:cursor-grabbing" title={t.dragHandle}>
                  <GripVertical size={14} />
               </div>

               <div className="w-px h-4 bg-slate-200 dark:bg-slate-700 mx-0.5"></div>

               {/* Date Toggle */}
               <button onClick={() => onToggleDate(node.id)} className={`p-1.5 rounded transition-colors ${node.date !== null ? 'text-blue-600 bg-blue-50 dark:text-blue-400 dark:bg-blue-900/30' : 'text-slate-400 hover:text-blue-500 dark:text-slate-500 dark:hover:text-blue-400'}`} title={t.toggleDate}>
                  <Calendar size={14} />
               </button>

               <div className="w-px h-4 bg-slate-200 dark:bg-slate-700 mx-0.5"></div>

               {/* Indent/Outdent */}
               {isSub ? (
                   <button onClick={() => onOutdent(index)} className="p-1.5 text-slate-400 hover:text-orange-600 hover:bg-orange-50 dark:hover:bg-orange-900/30 rounded" title={t.promote}>
                      <Outdent size={14} />
                   </button>
               ) : (
                   <button onClick={() => onIndent(index)} className="p-1.5 text-slate-400 hover:text-blue-600 hover:bg-blue-50 dark:hover:bg-blue-900/30 rounded" title={t.demote}>
                      <Indent size={14} />
                   </button>
               )}
               
               {/* Switch Side - Only show in vertical mode technically, but kept for data consistency */}
               <button onClick={() => onToggleSide(node.id)} className="p-1.5 text-slate-400 hover:text-blue-600 hover:bg-blue-50 dark:hover:bg-blue-900/30 rounded" title={t.switchSide}>
                  <ArrowLeftRight size={14} />
               </button>

               <div className="w-px h-4 bg-slate-200 dark:bg-slate-700 mx-0.5"></div>
               
               {/* Delete */}
               <button onClick={() => onDelete(node.id)} className="p-1.5 text-slate-400 hover:text-red-500 hover:bg-red-50 dark:hover:bg-red-900/30 rounded" title={t.delete}><Trash2 size={14} /></button>
            </div>
        );

        const SubNodeRenderer = ({ node, index, totalNodes, onUpdate, onDelete, onToggleDate, onIndent, onOutdent, onToggleSide, onMove, onDragStart, onDragOver, onDrop, t, draggedNodeId }) => {
            const isDragging = draggedNodeId === node.id;
            
            return (
              <div 
                draggable="true"
                onDragStart={(e) => onDragStart(e, node.id)}
                onDragOver={(e) => onDragOver(e, node.id)}
                onDrop={(e) => onDrop(e, node.id)}
                className={`relative p-4 border-t border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 first:border-t-0 group/sub hover:bg-slate-50/50 dark:hover:bg-slate-700/50 transition-all duration-300 ease-in-out ${isDragging ? 'opacity-40' : 'opacity-100'}`}
              >
                 {/* Visual Hierarchy Line */}
                 <div className="absolute right-0 top-0 bottom-0 w-[4px] bg-slate-200 dark:bg-slate-700 group-hover/sub:bg-blue-300 dark:group-hover/sub:bg-blue-600 transition-colors duration-300 ease-in-out"></div>
                 
                 <div className="space-y-2 relative z-10">
                     {node.date !== null && (
                         <input
                             type="text"
                             value={node.date}
                             onChange={(e) => onUpdate(node.id, 'date', e.target.value)}
                             className="date-input w-full font-semibold uppercase tracking-wider bg-transparent border-none focus:outline-none placeholder-blue-300 text-xs text-blue-600 dark:text-blue-400 dark:placeholder-blue-700"
                             placeholder={t.datePlaceholder}
                         />
                     )}
                     
                     <div className="flex items-center gap-2">
                        <RichTextEditor
                            value={node.title}
                            onChange={(val) => onUpdate(node.id, 'title', val)}
                            singleLine={true}
                            className="w-full font-bold text-slate-800 dark:text-slate-100 text-lg border-b border-transparent hover:border-slate-200 dark:hover:border-slate-600 focus:border-blue-500 transition-colors py-1"
                            placeholder={t.subTitleNodePlaceholder}
                        />
                     </div>
                     
                     <div className="relative group/content">
                        <RichTextEditor
                            value={node.content}
                            onChange={(val) => onUpdate(node.id, 'content', val)}
                            className="w-full text-slate-600 dark:text-slate-300 text-sm min-h-[20px]"
                            placeholder={t.descNodePlaceholder}
                        />
                     </div>
                 </div>
                 
                 {/* Sub Node Actions (Bottom Row, only on hover) */}
                 <div className="mt-3 pt-2 flex justify-start items-center gap-2 no-print opacity-100 md:opacity-0 md:group-hover/sub:opacity-100 transition-opacity">
                     <NodeControls 
                        node={node} 
                        index={index} 
                        isSub={true} 
                        totalNodes={totalNodes}
                        onIndent={onIndent}
                        onOutdent={onOutdent}
                        onToggleSide={onToggleSide}
                        onMove={onMove}
                        onDelete={onDelete}
                        onToggleDate={onToggleDate}
                        t={t}
                     />
                 </div>
              </div>
            );
        };

        const TimelineApp = () => {
          const fileInputRef = useRef(null);
          const containerRef = useRef(null);
          
          // --- Global State ---
          const [uiLanguage, setUiLanguage] = useState('en');
          const [layoutMode, setLayoutMode] = useState('vertical'); // 'vertical' | 'horizontal'
          const [toastMessage, setToastMessage] = useState(null);

          const showToast = (msg) => {
              setToastMessage(msg);
          };

          const [darkMode, setDarkMode] = useState(() => {
              if (typeof window !== 'undefined' && window.matchMedia) {
                  return window.matchMedia('(prefers-color-scheme: dark)').matches;
              }
              return false;
          });

          useEffect(() => {
              const mediaQuery = window.matchMedia('(prefers-color-scheme: dark)');
              const handleChange = (e) => setDarkMode(e.matches);
              mediaQuery.addEventListener('change', handleChange);
              return () => mediaQuery.removeEventListener('change', handleChange);
          }, []);

          const t = TRANSLATIONS[uiLanguage];
          const [appTitle, setAppTitle] = useState("Dynamic Timeline Builder.<br>click here to change title"); 
          const [appSubtitle, setAppSubtitle] = useState("Use Ctrl+B/I/U for formatting.<br>©alex tkachenkov");
          
          const [hoverY, setHoverY] = useState(null);
          const [hoverX, setHoverX] = useState(null);
          const [insertIndex, setInsertIndex] = useState(null);

          useEffect(() => {
             if (appSubtitle === TRANSLATIONS['en'].subtitleDefault || appSubtitle === TRANSLATIONS['he'].subtitleDefault) {
                 setAppSubtitle(t.subtitleDefault);
             }
             if (appTitle === TRANSLATIONS['en'].defaultTitle || appTitle === TRANSLATIONS['he'].defaultTitle) {
                 setAppTitle(t.defaultTitle);
             }
          }, [uiLanguage, t.subtitleDefault, t.defaultTitle, appSubtitle, appTitle]);

          useEffect(() => {
            if (darkMode) document.documentElement.classList.add('dark');
            else document.documentElement.classList.remove('dark');
          }, [darkMode]);

          const [headerAlign, setHeaderAlign] = useState('center');

          const [nodes, setNodes] = useState(() => {
            try {
              const saved = localStorage.getItem('timeline_nodes');
              if (saved) {
                let parsed = JSON.parse(saved);
                return parsed.map((n, i) => ({
                     ...n, 
                     side: n.side || (i % 2 === 0 ? 'right' : 'left'),
                     type: 'event',
                     isSub: n.isSub || false
                }));
              }
            } catch (e) { console.error(e); }
            return [
              { "id": "root-mech", "type": "event", "side": "center", "title": "Mechanical Roots", "date": "19th Century", "content": "Before electricity, computer concepts were born as mechanical machines.", "isSub": false },
              { "id": "init-2", "type": "event", "side": "right", "title": "Charles Babbage & Analytical Engine", "date": "1837", "content": "Babbage designed a mechanical machine with all modern computer elements.", "isSub": true },
            ];
          });

          useEffect(() => {
            localStorage.setItem('timeline_nodes', JSON.stringify(nodes));
          }, [nodes]);

          useEffect(() => {
            const loadScript = (src, id) => {
                if (!document.getElementById(id)) {
                    const script = document.createElement('script');
                    script.src = src;
                    script.id = id;
                    script.async = true;
                    document.body.appendChild(script);
                }
            };
            loadScript("https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js", "html2canvas-script");
            loadScript("https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js", "jspdf-script");
          }, []);

          const generateId = () => Math.random().toString(36).substr(2, 9);

          const getRenderGroups = () => {
            const groups = [];
            let currentGroup = null;
            nodes.forEach((node, index) => {
                if (node.isSub && currentGroup) {
                    currentGroup.children.push({ ...node, originalIndex: index });
                } else {
                    if (currentGroup) groups.push(currentGroup);
                    currentGroup = { type: 'group', main: { ...node, originalIndex: index }, children: [] };
                }
            });
            if (currentGroup) groups.push(currentGroup);
            return groups;
          };

          const renderGroups = getRenderGroups();

          const addNode = (index) => {
            const prevNode = index > 0 ? nodes[index - 1] : null;
            const prevSide = prevNode ? prevNode.side : 'left';
            const newSide = prevSide === 'right' ? 'left' : 'right';
            const newNode = { id: generateId(), type: 'event', side: newSide, title: 'New Event', date: '', content: '', isSub: false };
            const newNodes = [...nodes];
            newNodes.splice(index, 0, newNode);
            setNodes(newNodes);
            setHoverY(null);
            setHoverX(null);
          };

          const deleteNode = (id) => {
            if (nodes.length <= 1) return;
            setNodes(nodes.filter(n => n.id !== id));
          };

          const moveNode = (index, direction) => {
            if (direction === 'up' && index === 0) return;
            if (direction === 'down' && index === nodes.length - 1) return;
            const newNodes = [...nodes];
            const targetIndex = direction === 'up' ? index - 1 : index + 1;
            const temp = newNodes[index];
            newNodes[index] = newNodes[targetIndex];
            newNodes[targetIndex] = temp;
            setNodes(newNodes);
          };

          const updateNode = (id, field, value) => {
            setNodes(nodes.map(n => n.id === id ? { ...n, [field]: value } : n));
          };

          const indentNode = (index) => {
              const newNodes = [...nodes];
              newNodes[index] = { ...newNodes[index], isSub: true };
              setNodes(newNodes);
          };

          const outdentNode = (index) => {
              const newNodes = [...nodes];
              newNodes[index] = { ...newNodes[index], isSub: false };
              setNodes(newNodes);
          };

          const toggleNodeSide = (id) => {
              setNodes(nodes.map(n => n.id === id ? { ...n, side: n.side === 'right' ? 'left' : 'right' } : n));
          };

          const toggleDate = (id) => {
            setNodes(nodes.map(n => {
                if (n.id === id) return { ...n, date: n.date === null ? '' : (n.date !== undefined && n.date !== null ? null : '') };
                return n;
            }));
          };
          
          const autoAlignSides = () => {
             let nextSide = 'right';
             const newNodes = nodes.map(n => {
                 if (!n.isSub) {
                    const assigned = nextSide;
                    nextSide = nextSide === 'right' ? 'left' : 'right';
                    return { ...n, side: assigned };
                 }
                 return n;
             });
             setNodes(newNodes);
          };

          // --- DRAG AND DROP LOGIC ---
          const [draggedNodeId, setDraggedNodeId] = useState(null);

          const getGroupSize = (list, startIndex) => {
            let size = 1; 
            for (let i = startIndex + 1; i < list.length; i++) {
                if (list[i].isSub) size++;
                else break;
            }
            return size;
          };

          const handleDragStart = (e, id) => {
              // Ensure we only drag using the handle
              if (!e.target.closest('.drag-handle')) {
                  e.preventDefault();
                  return;
              }
              setDraggedNodeId(id);
              e.dataTransfer.effectAllowed = "move";
              // Optional: Customize drag image here if needed
          };

          const handleDragOver = (e, targetId) => {
              e.preventDefault(); 
              e.dataTransfer.dropEffect = "move";
          };

          const handleDrop = (e, targetId) => {
            e.preventDefault();
            if (!draggedNodeId || draggedNodeId === targetId) return;

            const sourceIndex = nodes.findIndex(n => n.id === draggedNodeId);
            const targetIndex = nodes.findIndex(n => n.id === targetId);

            if (sourceIndex === -1 || targetIndex === -1) return;

            const sourceNode = nodes[sourceIndex];
            const targetNode = nodes[targetIndex];
            
            let newNodes = [...nodes];

            // 1. Dragging Main to Main (Group Reorder)
            if (!sourceNode.isSub && !targetNode.isSub) {
                const sourceSize = getGroupSize(nodes, sourceIndex);
                // Extract source group
                const movingNodes = newNodes.splice(sourceIndex, sourceSize);
                
                // Recalculate target index after removal
                let adjustTargetIndex = newNodes.findIndex(n => n.id === targetId);
                
                // Insert at new position
                newNodes.splice(adjustTargetIndex, 0, ...movingNodes);
            } 
            // 2. Dragging Sub to Sub (Simple Reorder)
            else if (sourceNode.isSub && targetNode.isSub) {
                const [movingNode] = newNodes.splice(sourceIndex, 1);
                let adjustTargetIndex = newNodes.findIndex(n => n.id === targetId);
                newNodes.splice(adjustTargetIndex, 0, movingNode);
            }
            // 3. Sub to Main (Reparenting logic - place as first child)
            else if (sourceNode.isSub && !targetNode.isSub) {
                 const [movingNode] = newNodes.splice(sourceIndex, 1);
                 let adjustTargetIndex = newNodes.findIndex(n => n.id === targetId);
                 // Insert after Main node (making it first child)
                 newNodes.splice(adjustTargetIndex + 1, 0, movingNode);
            }
            
            setNodes(newNodes);
            setDraggedNodeId(null);
          };

          // --- MOUSE TRACKING ---
          const handleMouseMove = (e) => {
            if (!containerRef.current || draggedNodeId) return; // Disable hover insert when dragging
            const containerRect = containerRef.current.getBoundingClientRect();
            const isMobile = window.innerWidth < 768;
            
            if (layoutMode === 'horizontal') {
                // Horizontal Mode Logic
                // We track X position relative to scroll container
                // The "Spine" is roughly at top: 2rem (32px) + padding. Let's say ~3.5rem (56px) down inside the container?
                // Actually, let's just use proximity to the top area
                const spineZoneY = containerRect.top + 60; // Approx area
                
                // If mouse is too far down, don't show add button
                if (e.clientY > spineZoneY + 60) {
                    setHoverX(null);
                    return;
                }

                const groupElements = document.querySelectorAll('[data-group-index]');
                let calculatedIndex = nodes.length;
                
                // Calculate position relative to the SCROLLING content
                // clientX is viewport. 
                // We need to compare clientX to the bounding boxes of children
                
                const mouseX = e.clientX;
                
                for (let i = 0; i < groupElements.length; i++) {
                    const el = groupElements[i];
                    const rect = el.getBoundingClientRect();
                    const midX = rect.left + (rect.width / 2);
                    
                    if (mouseX < midX) {
                        calculatedIndex = parseInt(el.getAttribute('data-start-index'));
                        break;
                    }
                }
                
                // Visual placement of button: relative to container
                const relativeX = mouseX - containerRect.left + containerRef.current.scrollLeft;
                
                // Snap to gaps? For now just track mouse
                // Better: Snap to the gap between groups
                
                // Actually, let's just place it exactly where the "gap" is logic-wise
                // But simplified: just follow mouse X
                setHoverX(relativeX);
                setInsertIndex(calculatedIndex);
                setHoverY(null); // Clear vertical hover
            } else {
                // Vertical Mode Logic (Existing)
                const isRtl = uiLanguage === 'he';
                const centerX = isMobile 
                    ? (isRtl ? containerRect.right - 32 : containerRect.left + 32)
                    : containerRect.left + (containerRect.width / 2);
                    
                const mouseX = e.clientX;
                const distance = Math.abs(mouseX - centerX);
                const maxDist = isMobile ? 80 : 50;
                
                if (distance > maxDist) { setHoverY(null); return; }
                
                const mouseY = e.clientY;
                const relativeY = mouseY - containerRect.top;
                setHoverY(relativeY);
                setHoverX(null); // Clear horizontal hover

                const groupElements = document.querySelectorAll('[data-group-index]');
                let calculatedIndex = nodes.length; 
                for (let i = 0; i < groupElements.length; i++) {
                    const el = groupElements[i];
                    const dot = el.querySelector('.timeline-dot');
                    let splitPoint;
                    if (dot) {
                        const dotRect = dot.getBoundingClientRect();
                        splitPoint = dotRect.top + (dotRect.height / 2);
                    } else {
                        const rect = el.getBoundingClientRect();
                        splitPoint = rect.top + (rect.height / 2);
                    }
                    if (mouseY < splitPoint) {
                        const startIndex = parseInt(el.getAttribute('data-start-index'));
                        calculatedIndex = startIndex;
                        break;
                    }
                }
                setInsertIndex(calculatedIndex);
            }
          };

          const handleMouseLeave = () => { setHoverY(null); setHoverX(null); };

          // --- EXPORT ---
          const fixDateInputsForExport = (clonedDoc) => {
             const originalContainer = document.getElementById('timeline-content');
             const originalInputs = originalContainer ? originalContainer.querySelectorAll('input.date-input') : [];
             const clonedInputs = clonedDoc.querySelectorAll('input.date-input');
             
             clonedInputs.forEach((clonedInput, index) => {
                 const original = originalInputs[index];
                 const val = original ? original.value : clonedInput.value;
                 const span = clonedDoc.createElement('span');
                 span.textContent = val;
                 span.className = clonedInput.className;
                 span.style.display = 'inline-block';
                 clonedInput.replaceWith(span);
             });
          };

          const handleExportImage = async () => {
            if (window.html2canvas) {
                const element = document.getElementById('timeline-content');
                const originalBg = element.style.backgroundColor;
                const originalPadding = element.style.padding;
                const isDark = document.documentElement.classList.contains('dark');
                const bgColor = isDark ? '#0f172a' : '#f8fafc';
                element.style.backgroundColor = bgColor;
                element.style.padding = '40px 80px'; 
                try {
                    const canvas = await window.html2canvas(element, { 
                        backgroundColor: bgColor, 
                        scale: 2, 
                        useCORS: true, 
                        ignoreElements: (element) => element.classList.contains('no-print'),
                        onclone: fixDateInputsForExport
                    });
                    const link = document.createElement('a');
                    link.download = 'timeline.png';
                    link.href = canvas.toDataURL();
                    link.click();
                    showToast(t.exportSuccess);
                } finally { element.style.backgroundColor = ''; element.style.padding = originalPadding; }
            } else { showToast(t.loading); }
          };

          const handleExportPDF = async () => {
              if (window.html2canvas && window.jspdf) {
                const { jsPDF } = window.jspdf;
                const element = document.getElementById('timeline-content');
                const isDark = document.documentElement.classList.contains('dark');
                const originalBg = element.style.backgroundColor;
                const originalPadding = element.style.padding;
                const bgColor = isDark ? '#0f172a' : '#ffffff';
                element.style.backgroundColor = bgColor;
                element.style.padding = '40px 80px'; 
                try {
                    const canvas = await window.html2canvas(element, { 
                        backgroundColor: bgColor, 
                        scale: 2, 
                        useCORS: true, 
                        ignoreElements: (element) => element.classList.contains('no-print'),
                        onclone: fixDateInputsForExport
                    });
                    const imgData = canvas.toDataURL('image/png');
                    const pdf = new jsPDF('p', 'mm', 'a4');
                    // Calculate dimensions...
                    const pdfWidth = pdf.internal.pageSize.getWidth();
                    const pdfHeight = pdf.internal.pageSize.getHeight();
                    const imgProps = pdf.getImageProperties(imgData);
                    const imgHeight = (imgProps.height * pdfWidth) / imgProps.width;
                    if (imgHeight > pdfHeight) {
                         const customPdf = new jsPDF('p', 'mm', [pdfWidth, imgHeight + 20]);
                         customPdf.addImage(imgData, 'PNG', 0, 0, pdfWidth, imgHeight);
                         customPdf.save('timeline.pdf');
                    } else {
                         pdf.addImage(imgData, 'PNG', 0, 0, pdfWidth, imgHeight);
                         pdf.save('timeline.pdf');
                    }
                    showToast(t.exportSuccess);
                } finally { element.style.backgroundColor = originalBg; element.style.padding = originalPadding; }
              } else { showToast(t.loading); }
          };

          const handleSaveTemplate = () => {
              const cleanNodes = nodes.map(node => ({ id: node.id, type: node.type || 'event', side: node.side, title: node.title, date: node.date, content: node.content, comments: node.comments || [], isSub: node.isSub }));
              const templateData = { title: appTitle, subtitle: appSubtitle, nodes: cleanNodes };
              const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(templateData, null, 2));
              const downloadAnchorNode = document.createElement('a');
              downloadAnchorNode.setAttribute("href", dataStr);
              downloadAnchorNode.setAttribute("download", "timeline_template.json");
              document.body.appendChild(downloadAnchorNode);
              downloadAnchorNode.click();
              downloadAnchorNode.remove();
          };

          const handleLoadTemplateClick = () => { fileInputRef.current.click(); };
          const handleFileChange = (e) => {
              const fileReader = new FileReader();
              fileReader.readAsText(e.target.files[0], "UTF-8");
              fileReader.onload = e => {
                  try {
                      const parsed = JSON.parse(e.target.result);
                      if (parsed.nodes && Array.isArray(parsed.nodes)) {
                          setNodes(parsed.nodes);
                          if (parsed.title) setAppTitle(parsed.title);
                          if (parsed.subtitle) setAppSubtitle(parsed.subtitle);
                      } else if (Array.isArray(parsed)) {
                          setNodes(parsed);
                      } else { showToast(t.invalidFormat); }
                  } catch (err) { showToast(t.parseError); }
              };
              e.target.value = null; 
          };

          const currentDir = uiLanguage === 'he' ? 'rtl' : 'ltr';
          const isRtl = uiLanguage === 'he';

          // Helper classes
          const getLinePositionClass = () => isRtl 
              ? 'right-8 md:right-1/2 translate-x-1/2' 
              : 'left-8 md:left-1/2 -translate-x-1/2';
          const getDotPositionClass = () => isRtl
              ? 'right-8 md:right-1/2 translate-x-1/2'
              : 'left-8 md:left-1/2 -translate-x-1/2';
          const getContentPaddingClass = (isRightSide) => {
              if (isRtl) {
                   return isRightSide 
                    ? 'pr-16 md:pr-0 md:pl-8' 
                    : 'pr-16 md:pr-8 md:pl-0'; 
              } else {
                   return isRightSide 
                    ? 'pl-16 md:pl-8 md:pr-0' 
                    : 'pl-16 md:pl-0 md:pr-8'; 
              }
          };

          return (
            <div className="min-h-screen bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 p-2 md:p-8 font-sans transition-colors duration-300 ease-in-out" dir={currentDir}>
              
              <Toast message={toastMessage} onClose={() => setToastMessage(null)} />

              {/* Top Bar */}
              <div dir="ltr" className="absolute top-2 left-2 md:top-4 md:left-4 z-50 no-print flex items-center bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg shadow-sm p-1">
                  <Globe size={16} className="text-slate-400 mx-2" />
                  <select value={uiLanguage} onChange={(e) => setUiLanguage(e.target.value)} className="bg-transparent border-none outline-none text-sm text-slate-600 dark:text-slate-300 cursor-pointer py-1 pr-2">
                      <option value="en">English</option>
                      <option value="he">עברית</option>
                  </select>
                  <div className="w-px h-4 bg-slate-200 dark:bg-slate-700 mx-1"></div>
                  <button onClick={() => setDarkMode(!darkMode)} className="p-1.5 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 rounded-md transition-colors">
                    {darkMode ? <Moon size={16} /> : <Sun size={16} />}
                  </button>
              </div>

              <div className={`mx-auto pt-12 md:pt-0 ${layoutMode === 'horizontal' ? 'w-full px-4' : 'max-w-4xl'}`} id="timeline-content">
                
                <header className="mb-12 text-center relative group">
                  <div className="mb-6 relative w-full flex justify-center items-start gap-4 group/header">
                     <div className="flex flex-col w-full max-w-2xl gap-2 px-4 md:px-0">
                        <div className={`w-full ${appTitle === t.defaultTitle ? 'no-print' : ''}`}>
                            <RichTextEditor
                                value={appTitle}
                                onChange={setAppTitle}
                                placeholder={t.titlePlaceholder}
                                align={headerAlign}
                                className={`text-3xl md:text-4xl font-bold text-slate-900 dark:text-white bg-transparent border-b border-transparent hover:border-slate-300 dark:hover:border-slate-600 focus:border-blue-500 focus:outline-none w-full transition-colors pb-2`}
                            />
                        </div>
                        <div className={`w-full ${appSubtitle === t.subtitleDefault ? 'no-print' : ''}`}>
                            <RichTextEditor
                                value={appSubtitle}
                                onChange={setAppSubtitle}
                                placeholder={t.subtitlePlaceholder}
                                align={headerAlign}
                                className={`text-sm md:text-base text-slate-500 dark:text-slate-400 bg-transparent border-b border-transparent hover:border-slate-300 dark:hover:border-slate-600 focus:border-blue-500 focus:outline-none w-full transition-colors pb-1`}
                            />
                        </div>
                     </div>

                     <div className="pt-2 opacity-100 md:opacity-0 md:group-hover/header:opacity-100 transition-opacity flex flex-col gap-1 fixed bottom-4 right-4 md:static z-40 md:z-auto bg-white/90 md:bg-transparent dark:bg-slate-900/90 p-2 md:p-0 rounded-lg border md:border-none border-slate-200 dark:border-slate-700 shadow-lg md:shadow-none">
                         <button onClick={() => setHeaderAlign(prev => prev === 'center' ? 'start' : 'center')} className="p-2 text-slate-400 hover:text-blue-500 hover:bg-slate-100 dark:hover:bg-slate-800 rounded">
                            {headerAlign === 'center' ? (currentDir === 'rtl' ? <AlignRight size={18} /> : <AlignLeft size={18} />) : <AlignCenter size={18} />}
                         </button>
                         <button onClick={() => setLayoutMode(prev => prev === 'vertical' ? 'horizontal' : 'vertical')} className="p-2 text-slate-400 hover:text-blue-500 hover:bg-slate-100 dark:hover:bg-slate-800 rounded" title={t.layoutMode}>
                            {layoutMode === 'vertical' ? <GalleryHorizontal size={18} /> : <GalleryVertical size={18} />}
                         </button>
                         {layoutMode === 'vertical' && (
                             <button onClick={autoAlignSides} className="p-2 text-slate-400 hover:text-blue-500 hover:bg-slate-100 dark:hover:bg-slate-800 rounded">
                                <RefreshCcw size={18} />
                             </button>
                         )}
                     </div>
                  </div>
                  
                  <div className="flex flex-wrap justify-center gap-2 md:gap-4 no-print mt-6 px-2">
                    <input type="file" ref={fileInputRef} onChange={handleFileChange} style={{display: 'none'}} accept=".json" />
                    <button onClick={handleSaveTemplate} className="btn-framed group">
                        <FileJson size={18} className="text-slate-400 dark:text-slate-500 group-hover:text-green-600 dark:group-hover:text-green-400 mb-1" />
                        <span className="font-medium text-xs md:text-sm text-slate-600 dark:text-slate-300 text-center leading-tight">{t.save}</span>
                    </button>
                    <button onClick={handleLoadTemplateClick} className="btn-framed group">
                        <Upload size={18} className="text-slate-400 dark:text-slate-500 group-hover:text-blue-600 dark:group-hover:text-blue-400 mb-1" />
                        <span className="font-medium text-xs md:text-sm text-slate-600 dark:text-slate-300 text-center leading-tight">{t.load}</span>
                    </button>
                    <div className="hidden md:block w-px h-12 bg-slate-200 dark:bg-slate-700 mx-2"></div>
                    <button onClick={handleExportPDF} className="btn-framed group hover:border-red-300 dark:hover:border-red-700 hover:bg-red-50 dark:hover:bg-red-900/10">
                        <Printer size={18} className="text-slate-400 dark:text-slate-500 group-hover:text-red-600 dark:group-hover:text-red-400 mb-1" />
                        <span className="font-medium text-xs md:text-sm text-slate-600 dark:text-slate-300 text-center leading-tight">{t.pdf}</span>
                    </button>
                    <button onClick={handleExportImage} className="btn-framed group hover:border-blue-300 dark:hover:border-blue-700 hover:bg-blue-50 dark:hover:bg-blue-900/10">
                        <Download size={18} className="text-slate-400 dark:text-slate-500 group-hover:text-blue-600 dark:group-hover:text-blue-400 mb-1" />
                        <span className="font-medium text-xs md:text-sm text-slate-600 dark:text-slate-300 text-center leading-tight">{t.image}</span>
                    </button>
                  </div>
                </header>

                <div 
                    className={`relative pb-24 ${layoutMode === 'horizontal' ? 'flex flex-row overflow-x-auto min-h-[70vh] items-start pt-8 pb-12 gap-0' : 'block'}`} 
                    dir="ltr" 
                    ref={containerRef} 
                    onMouseMove={handleMouseMove} 
                    onMouseLeave={handleMouseLeave}
                > 
                  {/* Visual Spine Logic */}
                  {layoutMode === 'vertical' && (
                       <div className={`absolute top-0 bottom-0 w-1 bg-slate-200 dark:bg-slate-700 z-0 pointer-events-none ${getLinePositionClass()}`}></div>
                  )}
                  {/* Horizontal Spine logic is handled per group to allow width scaling */}

                  {/* Add Button Indicators */}
                  {layoutMode === 'vertical' && hoverY !== null && insertIndex !== null && !draggedNodeId && (
                      <div className={`absolute w-6 h-6 z-30 pointer-events-auto no-print flex items-center justify-center ${getLinePositionClass()}`} style={{ top: hoverY }}>
                          <button onClick={() => addNode(insertIndex)} className="w-6 h-6 rounded-full bg-blue-500 hover:bg-blue-600 text-white flex items-center justify-center shadow-lg transform hover:scale-110 transition-transform cursor-pointer border-2 border-white dark:border-slate-900" title={t.addNode}>
                              <Plus size={14} />
                          </button>
                      </div>
                  )}
                  {layoutMode === 'horizontal' && hoverX !== null && insertIndex !== null && !draggedNodeId && (
                      <div className="absolute w-6 h-6 z-30 pointer-events-auto no-print flex items-center justify-center" style={{ top: '2rem', left: hoverX }}>
                           <button onClick={() => addNode(insertIndex)} className="w-6 h-6 rounded-full bg-blue-500 hover:bg-blue-600 text-white flex items-center justify-center shadow-lg transform hover:scale-110 transition-transform cursor-pointer border-2 border-white dark:border-slate-900" title={t.addNode}>
                              <Plus size={14} />
                          </button>
                      </div>
                  )}

                  <div className={`${layoutMode === 'vertical' ? 'space-y-0 pt-2 block w-full' : 'flex flex-row w-full'}`}>
                    {renderGroups.map((group, groupIndex) => {
                      const mainNode = group.main;
                      const children = group.children || [];
                      const index = mainNode.originalIndex;
                      const lastIndex = index + children.length; 
                      const isRightSide = mainNode.side === 'right';
                      const layoutClass = isRightSide ? 'md:flex-row' : 'md:flex-row-reverse';
                      const isDraggingMain = draggedNodeId === mainNode.id;

                      // Horizontal rendering helpers
                      const isFirst = groupIndex === 0;
                      const isLast = groupIndex === renderGroups.length - 1;

                      if (layoutMode === 'horizontal') {
                          return (
                            <div 
                                key={mainNode.id} 
                                className={`relative flex-shrink-0 w-80 px-4 group/wrapper ${isDraggingMain ? 'opacity-40' : 'opacity-100'}`}
                                data-group-index={groupIndex} 
                                data-start-index={index}
                                draggable="true"
                                onDragStart={(e) => handleDragStart(e, mainNode.id)}
                                onDragOver={(e) => handleDragOver(e, mainNode.id)}
                                onDrop={(e) => handleDrop(e, mainNode.id)}
                            >
                                {/* Horizontal Spine Segments */}
                                <div className="absolute top-[2rem] left-0 right-0 h-1 bg-slate-200 dark:bg-slate-700 pointer-events-none z-0">
                                    {isFirst && <div className="absolute left-0 top-0 bottom-0 w-1/2 bg-slate-50 dark:bg-slate-900 z-10"></div>}
                                    {isLast && <div className="absolute right-0 top-0 bottom-0 w-1/2 bg-slate-50 dark:bg-slate-900 z-10"></div>}
                                </div>
                                
                                {/* Dot */}
                                <div className="absolute top-[1.5rem] left-1/2 -translate-x-1/2 w-4 h-4 rounded-full bg-white dark:bg-slate-800 border-4 border-blue-500 z-20 group-hover/wrapper:scale-125 transition-transform"></div>
                                
                                {/* Vertical Connector to Card */}
                                <div className="absolute top-[2rem] left-1/2 -translate-x-1/2 w-1 h-8 bg-slate-200 dark:bg-slate-700 z-0"></div>

                                {/* Content Card */}
                                <div className="mt-12 bg-white dark:bg-slate-800 rounded-xl shadow-sm border border-slate-200 dark:border-slate-700 relative hover:shadow-md transition-all overflow-hidden">
                                     <div className="p-4 pb-2 relative z-10 group/main-content">
                                         <div className="space-y-2">
                                            {mainNode.date !== null && (
                                                <input type="text" value={mainNode.date} onChange={(e) => updateNode(mainNode.id, 'date', e.target.value)} className="date-input w-full font-semibold uppercase tracking-wider bg-transparent border-none focus:outline-none placeholder-blue-300 text-xs text-blue-600 dark:text-blue-400 dark:placeholder-blue-700" placeholder={t.datePlaceholder} />
                                            )}
                                            <RichTextEditor value={mainNode.title} onChange={(val) => updateNode(mainNode.id, 'title', val)} singleLine={true} className="w-full font-bold text-slate-800 dark:text-slate-100 text-lg border-b border-transparent hover:border-slate-200 dark:hover:border-slate-600 focus:border-blue-500 transition-colors py-1" placeholder={t.titleNodePlaceholder} />
                                            <div className="relative group/content">
                                                <RichTextEditor value={mainNode.content} onChange={(val) => updateNode(mainNode.id, 'content', val)} className="w-full text-slate-600 dark:text-slate-300 text-sm min-h-[40px]" placeholder={t.descNodePlaceholder} />
                                            </div>
                                         </div>
                                         <div className="mt-3 pt-2 border-t border-slate-100 dark:border-slate-700 flex justify-start items-center opacity-100 transition-opacity">
                                            <NodeControls node={mainNode} index={index} isSub={false} totalNodes={nodes.length} onIndent={indentNode} onOutdent={outdentNode} onToggleSide={toggleNodeSide} onMove={moveNode} onDelete={deleteNode} onToggleDate={toggleDate} t={t} />
                                         </div>
                                     </div>
                                     {children.length > 0 && (
                                          <div className="border-t border-slate-200 dark:border-slate-700 max-h-64 overflow-y-auto">
                                              {children.map((child) => (
                                                  <SubNodeRenderer key={child.id} node={child} index={child.originalIndex} totalNodes={nodes.length} onUpdate={updateNode} onDelete={deleteNode} onToggleDate={toggleDate} onIndent={indentNode} onOutdent={outdentNode} onToggleSide={toggleNodeSide} onMove={moveNode} onDragStart={handleDragStart} onDragOver={handleDragOver} onDrop={handleDrop} draggedNodeId={draggedNodeId} t={t} />
                                              ))}
                                          </div>
                                      )}
                                </div>
                            </div>
                          );
                      }

                      // Vertical Mode Rendering (Original)
                      return (
                      <div 
                          key={mainNode.id} 
                          className={`relative group/wrapper print-break-inside-avoid pb-4 transition-opacity duration-200 ${isDraggingMain ? 'opacity-40' : 'opacity-100'}`} 
                          data-group-index={groupIndex} 
                          data-start-index={index} 
                          data-last-index={lastIndex}
                          draggable="true"
                          onDragStart={(e) => handleDragStart(e, mainNode.id)}
                          onDragOver={(e) => handleDragOver(e, mainNode.id)}
                          onDrop={(e) => handleDrop(e, mainNode.id)}
                      >
                        <div className={`timeline-dot absolute rounded-full z-10 shadow-sm transition-all w-4 h-4 bg-white dark:bg-slate-800 border-4 border-blue-500 top-8 group-hover/wrapper:scale-125 ${getDotPositionClass()}`}></div>
                        
                        <div className={`flex flex-col md:flex-row items-start ${layoutClass} transition-all duration-500`}>
                          <div className="hidden md:block w-1/2" />
                          <div className={`w-full md:w-1/2 pb-4 ${getContentPaddingClass(isRightSide)}`} dir={currentDir}>
                            <div className="bg-white dark:bg-slate-800 rounded-xl shadow-sm border border-slate-200 dark:border-slate-700 relative hover:shadow-md transition-all overflow-hidden duration-300 ease-in-out">
                              <div className="p-4 pb-2 relative z-10 bg-white dark:bg-slate-800 group/main-content transition-colors duration-300 ease-in-out">
                                <div className="space-y-2">
                                    {mainNode.date !== null && (
                                        <input type="text" value={mainNode.date} onChange={(e) => updateNode(mainNode.id, 'date', e.target.value)} className="date-input w-full font-semibold uppercase tracking-wider bg-transparent border-none focus:outline-none placeholder-blue-300 text-xs text-blue-600 dark:text-blue-400 dark:placeholder-blue-700" placeholder={t.datePlaceholder} />
                                    )}
                                    <RichTextEditor value={mainNode.title} onChange={(val) => updateNode(mainNode.id, 'title', val)} singleLine={true} className="w-full font-bold text-slate-800 dark:text-slate-100 text-lg border-b border-transparent hover:border-slate-200 dark:hover:border-slate-600 focus:border-blue-500 transition-colors py-1" placeholder={t.titleNodePlaceholder} />
                                    <div className="relative group/content">
                                        <RichTextEditor value={mainNode.content} onChange={(val) => updateNode(mainNode.id, 'content', val)} className="w-full text-slate-600 dark:text-slate-300 text-sm min-h-[40px]" placeholder={t.descNodePlaceholder} />
                                    </div>
                                </div>
                                <div className="mt-3 pt-2 border-t border-slate-100 dark:border-slate-700 flex justify-start items-center no-print opacity-100 md:opacity-0 md:group-hover/main-content:opacity-100 transition-opacity">
                                    <NodeControls node={mainNode} index={index} isSub={false} totalNodes={nodes.length} onIndent={indentNode} onOutdent={outdentNode} onToggleSide={toggleNodeSide} onMove={moveNode} onDelete={deleteNode} onToggleDate={toggleDate} t={t} />
                                </div>
                              </div>
                              {children.length > 0 && (
                                  <div className="border-t border-slate-200 dark:border-slate-700">
                                      {children.map((child) => (
                                          <SubNodeRenderer key={child.id} node={child} index={child.originalIndex} totalNodes={nodes.length} onUpdate={updateNode} onDelete={deleteNode} onToggleDate={toggleDate} onIndent={indentNode} onOutdent={outdentNode} onToggleSide={toggleNodeSide} onMove={moveNode} onDragStart={handleDragStart} onDragOver={handleDragOver} onDrop={handleDrop} draggedNodeId={draggedNodeId} t={t} />
                                      ))}
                                  </div>
                              )}
                            </div>
                          </div>
                        </div>
                      </div>
                    )})}
                  </div>
                </div>
              </div>
            </div>
          );
        };

        const root = createRoot(document.getElementById('root'));
        root.render(<TimelineApp />);
    </script>
</body>
</html>
