<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hierarchical Timeline Builder with Gemini AI</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>
    
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.2.0",
        "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
        "lucide-react": "https://esm.sh/lucide-react@0.263.1"
      }
    }
    </script>
</head>
<body class="bg-slate-50 dark:bg-slate-900 transition-colors duration-300 ease-in-out">
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import React, { useState, useRef, useEffect } from 'react';
        import { createRoot } from 'react-dom/client';
        import { Plus, Trash2, ChevronLeft, ChevronRight, Calendar, Download, Printer, ArrowLeftRight, ArrowUpDown, FileJson, Upload, Indent, Outdent, Globe, AlignCenter, AlignLeft, AlignRight, Sun, Moon, Sparkles, Wand2, Loader2, X, ArrowRightLeft } from 'lucide-react';

        // --- GEMINI API HELPERS ---
        const apiKey = ""; // System provides this at runtime

        const callGemini = async (prompt, isJson = false) => {
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;
            
            const payload = {
                contents: [{ parts: [{ text: prompt }] }],
                generationConfig: {
                    responseMimeType: isJson ? "application/json" : "text/plain"
                }
            };

            const delays = [1000, 2000, 4000, 8000, 16000];
            
            for (let i = 0; i < delays.length; i++) {
                try {
                    const response = await fetch(url, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });

                    if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);

                    const data = await response.json();
                    const text = data.candidates?.[0]?.content?.parts?.[0]?.text;
                    
                    if (!text) throw new Error("No text generated");
                    
                    return isJson ? JSON.parse(text) : text;
                    
                } catch (error) {
                    if (i === delays.length - 1) throw error;
                    await new Promise(resolve => setTimeout(resolve, delays[i]));
                }
            }
        };

        // --- Translations ---
        const TRANSLATIONS = {
          en: {
            save: "Save Template",
            load: "Load Template",
            pdf: "Export PDF",
            image: "Export Image",
            addNode: "Add Node Here",
            titlePlaceholder: "Enter Title...",
            subtitlePlaceholder: "Enter Subtitle...",
            defaultTitle: "Dynamic Timeline Builder",
            promote: "Promote",
            demote: "Demote",
            switchSide: "Switch Side (Top/Bottom)",
            moveLeft: "Move Left",
            moveRight: "Move Right",
            delete: "Delete",
            datePlaceholder: "DATE",
            titleNodePlaceholder: "Event Title...",
            descNodePlaceholder: "Description...",
            subTitleNodePlaceholder: "Sub-event Title...",
            subtitleDefault: "Use Ctrl+B/I/U for formatting.<br>©alex tkachenkov",
            aiExpand: "AI: Expand Sub-events",
            aiEnhance: "AI: Enhance Text",
            aiGenerate: "AI: Generate Timeline",
            aiPromptPlaceholder: "e.g., History of the Internet...",
            generating: "Generating...",
            toggleDate: "Toggle Date",
            mirrorSides: "Mirror All Nodes",
            reverseTimeline: "Reverse Timeline Direction"
          },
          he: {
            save: "שמור תבנית",
            load: "טען תבנית",
            pdf: "ייצוא PDF",
            image: "ייצוא תמונה",
            addNode: "הוסף אירוע כאן",
            titlePlaceholder: "הכנס כותרת...",
            subtitlePlaceholder: "הכנס כותרת משנה...",
            defaultTitle: "בניית ציר זמן דינמי",
            promote: "הפוך לראשי",
            demote: "הפוך למשני",
            switchSide: "החלף צד (למעלה/למטה)",
            moveLeft: "הזז ימינה",
            moveRight: "הזז שמאלה",
            delete: "מחק",
            datePlaceholder: "תאריך",
            titleNodePlaceholder: "כותרת האירוע...",
            descNodePlaceholder: "תיאור...",
            subTitleNodePlaceholder: "כותרת תת-אירוע...",
            subtitleDefault: "השתמשו ב-Ctrl+B/I/U לעיצוב.<br>©אלכס טקצ'נקוב",
            aiExpand: "AI: הרחב אירועים",
            aiEnhance: "AI: שפר טקסט",
            aiGenerate: "AI: צור ציר זמן",
            aiPromptPlaceholder: "לדוגמה: ההיסטוריה של האינטרנט...",
            generating: "יוצר...",
            toggleDate: "הצג/הסתר תאריך",
            mirrorSides: "הפוך צדדים",
            reverseTimeline: "הפוך כיוון ציר זמן"
          }
        };

        // --- Rich Text Editor Component ---
        const RichTextEditor = ({ value, onChange, className, placeholder, singleLine = false, align = 'start' }) => {
          const editorRef = useRef(null);

          useEffect(() => {
            if (editorRef.current && editorRef.current.innerHTML !== value) {
              if (document.activeElement !== editorRef.current) {
                 editorRef.current.innerHTML = value || '';
              }
            }
          }, [value]);

          const handleInput = (e) => {
            onChange(e.currentTarget.innerHTML);
          };

          const handleKeyDown = (e) => {
            if (singleLine && e.key === 'Enter') {
              e.preventDefault();
              return;
            }
          };

          const alignClass = align === 'center' ? 'text-center' : (align === 'right' ? 'text-right' : 'text-start');

          return (
            <div className={`relative group/editor w-full ${alignClass}`}>
              <div
                ref={editorRef}
                contentEditable
                className={`${className} empty:before:content-[attr(data-placeholder)] empty:before:text-slate-300 dark:empty:before:text-slate-500 cursor-text outline-none z-10 relative inline-block min-w-[50px] whitespace-pre-wrap break-words`}
                onInput={handleInput}
                onKeyDown={handleKeyDown}
                suppressContentEditableWarning={true}
                data-placeholder={placeholder}
                dir="auto"
              />
            </div>
          );
        };

        // --- Inline Controls Component ---
        const NodeControls = ({ node, index, isSub, totalNodes, onIndent, onOutdent, onToggleSide, onMove, onDelete, onAiExpand, onAiEnhance, onToggleDate, isLoadingExpand, isLoadingEnhance, enableAi, t }) => (
            <div className="flex flex-row items-center gap-1">
               {/* Date Toggle */}
               <button onClick={() => onToggleDate(node.id)} className={`p-1.5 rounded transition-colors ${node.date !== null ? 'text-blue-600 bg-blue-50 dark:text-blue-400 dark:bg-blue-900/30' : 'text-slate-400 hover:text-blue-500 dark:text-slate-500 dark:hover:text-blue-400'}`} title={t.toggleDate}>
                  <Calendar size={14} />
               </button>

               <div className="w-px h-4 bg-slate-200 dark:bg-slate-700 mx-0.5"></div>

               {/* Indent/Outdent */}
               {isSub ? (
                   <button onClick={() => onOutdent(index)} className="p-1.5 text-slate-400 hover:text-orange-600 hover:bg-orange-50 dark:hover:bg-orange-900/30 rounded" title={t.promote}>
                      <Outdent size={14} />
                   </button>
               ) : (
                   <button onClick={() => onIndent(index)} className="p-1.5 text-slate-400 hover:text-blue-600 hover:bg-blue-50 dark:hover:bg-blue-900/30 rounded" title={t.demote}>
                      <Indent size={14} />
                   </button>
               )}
               
               {/* Switch Side (Up/Down for Horizontal) */}
               <button onClick={() => onToggleSide(node.id)} className="p-1.5 text-slate-400 hover:text-blue-600 hover:bg-blue-50 dark:hover:bg-blue-900/30 rounded" title={t.switchSide}>
                  <ArrowUpDown size={14} />
               </button>

               {/* AI Controls */}
               {enableAi && (
                   <>
                       <div className="w-px h-4 bg-slate-200 dark:bg-slate-700 mx-0.5"></div>
                       
                       <button 
                         onClick={() => onAiEnhance(node)} 
                         disabled={isLoadingEnhance}
                         className={`p-1.5 text-purple-400 hover:text-purple-600 hover:bg-purple-50 dark:hover:bg-purple-900/30 rounded ${isLoadingEnhance ? 'animate-pulse cursor-wait' : ''}`} 
                         title={t.aiEnhance}
                       >
                          {isLoadingEnhance ? <Loader2 size={14} className="animate-spin" /> : <Sparkles size={14} />}
                       </button>

                       {!isSub && (
                           <button 
                             onClick={() => onAiExpand(node)} 
                             disabled={isLoadingExpand}
                             className={`p-1.5 text-purple-400 hover:text-purple-600 hover:bg-purple-50 dark:hover:bg-purple-900/30 rounded ${isLoadingExpand ? 'animate-pulse cursor-wait' : ''}`} 
                             title={t.aiExpand}
                           >
                              {isLoadingExpand ? <Loader2 size={14} className="animate-spin" /> : <Wand2 size={14} />}
                           </button>
                       )}
                   </>
               )}

               <div className="w-px h-4 bg-slate-200 dark:bg-slate-700 mx-0.5"></div>

               {/* Movement Controls (Left/Right) */}
               <button onClick={() => onMove(index, 'up')} disabled={index === 0} className="p-1.5 text-slate-400 hover:text-blue-600 hover:bg-slate-50 dark:hover:bg-slate-700 rounded disabled:opacity-30" title={t.moveLeft}>
                   <ChevronLeft size={14} />
               </button>
               <button onClick={() => onMove(index, 'down')} disabled={index === totalNodes - 1} className="p-1.5 text-slate-400 hover:text-blue-600 hover:bg-slate-50 dark:hover:bg-slate-700 rounded disabled:opacity-30" title={t.moveRight}>
                   <ChevronRight size={14} />
               </button>
               
               {/* Delete */}
               <button onClick={() => onDelete(node.id)} className="p-1.5 text-slate-400 hover:text-red-500 hover:bg-red-50 dark:hover:bg-red-900/30 rounded" title={t.delete}><Trash2 size={14} /></button>
            </div>
        );

        const SubNodeRenderer = ({ node, index, totalNodes, onUpdate, onDelete, onToggleDate, onIndent, onOutdent, onToggleSide, onMove, onAiEnhance, isLoadingEnhance, enableAi, t }) => {
            return (
              <div className="relative p-4 border-t border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 first:border-t-0 group/sub hover:bg-slate-50/50 dark:hover:bg-slate-700/50 transition-colors duration-300 ease-in-out">
                 <div className="absolute right-0 top-0 bottom-0 w-[4px] bg-slate-200 dark:bg-slate-700 group-hover/sub:bg-blue-300 dark:group-hover/sub:bg-blue-600 transition-colors duration-300 ease-in-out"></div>
                 
                 <div className="space-y-2 relative z-10">
                     {node.date !== null && (
                         <input
                             type="text"
                             value={node.date}
                             onChange={(e) => onUpdate(node.id, 'date', e.target.value)}
                             className="w-full font-semibold uppercase tracking-wider bg-transparent border-none focus:outline-none placeholder-blue-300 text-xs text-blue-600 dark:text-blue-400 dark:placeholder-blue-700"
                             placeholder={t.datePlaceholder}
                         />
                     )}
                     
                     <div className="flex items-center gap-2">
                        <RichTextEditor
                            value={node.title}
                            onChange={(val) => onUpdate(node.id, 'title', val)}
                            singleLine={true}
                            className="w-full font-bold text-slate-800 dark:text-slate-100 text-lg border-b border-transparent hover:border-slate-200 dark:hover:border-slate-600 focus:border-blue-500 transition-colors py-1"
                            placeholder={t.subTitleNodePlaceholder}
                        />
                     </div>
                     
                     <div className="relative group/content">
                        <RichTextEditor
                            value={node.content}
                            onChange={(val) => onUpdate(node.id, 'content', val)}
                            className="w-full text-slate-600 dark:text-slate-300 text-sm min-h-[20px]"
                            placeholder={t.descNodePlaceholder}
                        />
                     </div>
                 </div>
                 
                 <div className="mt-3 pt-2 flex justify-start items-center gap-2 no-print opacity-0 group-hover/sub:opacity-100 transition-opacity">
                     <NodeControls 
                        node={node} 
                        index={index} 
                        isSub={true} 
                        totalNodes={totalNodes}
                        onIndent={onIndent}
                        onOutdent={onOutdent}
                        onToggleSide={onToggleSide}
                        onMove={onMove}
                        onDelete={onDelete}
                        onAiExpand={()=>{}}
                        onAiEnhance={onAiEnhance}
                        onToggleDate={onToggleDate}
                        isLoadingExpand={false}
                        isLoadingEnhance={isLoadingEnhance}
                        enableAi={enableAi}
                        t={t}
                     />
                 </div>
              </div>
            );
        };

        const TimelineApp = () => {
          const ENABLE_AI = true; 
          const fileInputRef = useRef(null);
          const containerRef = useRef(null);
          const exportContainerRef = useRef(null);
          const timelineContentRef = useRef(null);
          
          const [uiLanguage, setUiLanguage] = useState('en');
          const [isReversed, setIsReversed] = useState(false); // Controls LTR/RTL flow
          
          // AI Loading States
          const [aiLoading, setAiLoading] = useState({});
          
          // Modal for Generate Timeline
          const [showGenerateModal, setShowGenerateModal] = useState(false);
          const [generatePrompt, setGeneratePrompt] = useState("");
          const [isGeneratingTimeline, setIsGeneratingTimeline] = useState(false);

          const [darkMode, setDarkMode] = useState(() => {
              if (typeof window !== 'undefined' && window.matchMedia) {
                  return window.matchMedia('(prefers-color-scheme: dark)').matches;
              }
              return false;
          });

          useEffect(() => {
              const mediaQuery = window.matchMedia('(prefers-color-scheme: dark)');
              const handleChange = (e) => setDarkMode(e.matches);
              mediaQuery.addEventListener('change', handleChange);
              return () => mediaQuery.removeEventListener('change', handleChange);
          }, []);

          const t = TRANSLATIONS[uiLanguage];
          const [appTitle, setAppTitle] = useState("Dynamic Timeline Builder"); 
          const [appSubtitle, setAppSubtitle] = useState("Use Ctrl+B/I/U for formatting.<br>©alex tkachenkov");
          const [hoverPos, setHoverPos] = useState(null); 
          const [insertIndex, setInsertIndex] = useState(null);

          useEffect(() => {
             if (appSubtitle === TRANSLATIONS['en'].subtitleDefault || appSubtitle === TRANSLATIONS['he'].subtitleDefault) {
                 setAppSubtitle(t.subtitleDefault);
             }
             if (appTitle === TRANSLATIONS['en'].defaultTitle || appTitle === TRANSLATIONS['he'].defaultTitle) {
                 setAppTitle(t.defaultTitle);
             }
          }, [uiLanguage, t.subtitleDefault, t.defaultTitle, appSubtitle, appTitle]);

          useEffect(() => {
            if (darkMode) document.documentElement.classList.add('dark');
            else document.documentElement.classList.remove('dark');
          }, [darkMode]);

          const [nodes, setNodes] = useState(() => {
            try {
              const saved = localStorage.getItem('timeline_nodes');
              if (saved) {
                let parsed = JSON.parse(saved);
                return parsed.map((n, i) => ({
                     ...n, 
                     side: n.side || (i % 2 === 0 ? 'right' : 'left'),
                     type: 'event',
                     isSub: n.isSub || false
                }));
              }
            } catch (e) { console.error(e); }
            return [
              { "id": "root-mech", "type": "event", "side": "left", "title": "Mechanical Roots", "date": "19th Century", "content": "Before electricity, computer concepts were born as mechanical machines.", "isSub": false },
              { "id": "init-2", "type": "event", "side": "right", "title": "Charles Babbage", "date": "1837", "content": "Babbage designed a mechanical machine with all modern computer elements.", "isSub": true },
            ];
          });

          useEffect(() => {
            localStorage.setItem('timeline_nodes', JSON.stringify(nodes));
          }, [nodes]);

          useEffect(() => {
            const loadScript = (src, id) => {
                if (!document.getElementById(id)) {
                    const script = document.createElement('script');
                    script.src = src;
                    script.id = id;
                    script.async = true;
                    document.body.appendChild(script);
                }
            };
            loadScript("https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js", "html2canvas-script");
            loadScript("https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js", "jspdf-script");
          }, []);

          const generateId = () => Math.random().toString(36).substr(2, 9);

          const getRenderGroups = () => {
            const groups = [];
            let currentGroup = null;
            nodes.forEach((node, index) => {
                if (node.isSub && currentGroup) {
                    currentGroup.children.push({ ...node, originalIndex: index });
                } else {
                    if (currentGroup) groups.push(currentGroup);
                    currentGroup = { type: 'group', main: { ...node, originalIndex: index }, children: [] };
                }
            });
            if (currentGroup) groups.push(currentGroup);
            
            return isReversed ? groups.reverse() : groups;
          };

          const renderGroups = getRenderGroups();

          const addNode = (index) => {
            const prevNode = index > 0 ? nodes[index - 1] : null;
            const prevSide = prevNode ? prevNode.side : 'left';
            const newSide = prevSide === 'right' ? 'left' : 'right';
            const newNode = { id: generateId(), type: 'event', side: newSide, title: 'New Event', date: '', content: '', isSub: false };
            const newNodes = [...nodes];
            newNodes.splice(index, 0, newNode);
            setNodes(newNodes);
            setHoverPos(null);
          };

          const deleteNode = (id) => {
            if (nodes.length <= 1) return;
            setNodes(nodes.filter(n => n.id !== id));
          };

          const moveNode = (index, direction) => {
            if (direction === 'up' && index === 0) return;
            if (direction === 'down' && index === nodes.length - 1) return;
            const newNodes = [...nodes];
            const targetIndex = direction === 'up' ? index - 1 : index + 1;
            const temp = newNodes[index];
            newNodes[index] = newNodes[targetIndex];
            newNodes[targetIndex] = temp;
            setNodes(newNodes);
          };

          const updateNode = (id, field, value) => {
            setNodes(nodes.map(n => n.id === id ? { ...n, [field]: value } : n));
          };

          const indentNode = (index) => {
              const newNodes = [...nodes];
              newNodes[index] = { ...newNodes[index], isSub: true };
              setNodes(newNodes);
          };

          const outdentNode = (index) => {
              const newNodes = [...nodes];
              newNodes[index] = { ...newNodes[index], isSub: false };
              setNodes(newNodes);
          };

          const toggleNodeSide = (id) => {
              setNodes(nodes.map(n => n.id === id ? { ...n, side: n.side === 'right' ? 'left' : 'right' } : n));
          };

          const toggleDate = (id) => {
            setNodes(nodes.map(n => {
                if (n.id === id) {
                    if (n.date === null) {
                         // Restore date: use savedDate if available, else empty string
                         return { ...n, date: n.savedDate !== undefined ? n.savedDate : '' };
                    } else {
                         // Hide date: save current date to savedDate, set date to null
                         return { ...n, date: null, savedDate: n.date };
                    }
                }
                return n;
            }));
          };
          
          const mirrorSides = () => {
             const newNodes = nodes.map(n => ({
                 ...n,
                 side: n.side === 'left' ? 'right' : 'left'
             }));
             setNodes(newNodes);
          };

          // --- AI HANDLERS ---
          const handleAiGenerateTimeline = async () => {
              if (!ENABLE_AI) return;
              if (!generatePrompt.trim()) return;
              setIsGeneratingTimeline(true);
              try {
                  const prompt = `Generate a timeline for the topic: "${generatePrompt}". Return a JSON array of 5 to 8 events. Each object must have: "title" (string), "date" (string, year or period), "content" (string, short description), "side" (string, "left" or "right" alternating), "isSub" (boolean, false for main events). Example: [{"title":"X","date":"1900","content":"Y","side":"left","isSub":false}]`;
                  
                  const result = await callGemini(prompt, true);
                  
                  if (Array.isArray(result)) {
                      const newNodes = result.map(n => ({
                          id: generateId(),
                          type: 'event',
                          side: n.side || 'left',
                          title: n.title,
                          date: n.date,
                          content: n.content,
                          isSub: n.isSub || false
                      }));
                      let nextSide = 'right';
                      newNodes.forEach(n => {
                          if (!n.isSub) {
                              n.side = nextSide;
                              nextSide = nextSide === 'right' ? 'left' : 'right';
                          }
                      });
                      setNodes(newNodes);
                      setAppTitle(generatePrompt); 
                      setShowGenerateModal(false);
                      setGeneratePrompt("");
                  }
              } catch (error) {
                  alert("AI Error: " + error.message);
              } finally {
                  setIsGeneratingTimeline(false);
              }
          };

          const handleAiExpand = async (node) => {
              if (!ENABLE_AI) return;
              setAiLoading(prev => ({ ...prev, [node.id]: 'expand' }));
              try {
                  const prompt = `For the historical event "${node.title}" which happened around "${node.date}", generate 3 interesting sub-events or details. Return a JSON array. Each object: "title", "date", "content". Keep descriptions under 20 words.`;
                  const result = await callGemini(prompt, true);
                  
                  if (Array.isArray(result)) {
                      const newSubNodes = result.map(n => ({
                          id: generateId(),
                          type: 'event',
                          side: node.side, 
                          title: n.title,
                          date: n.date,
                          content: n.content,
                          isSub: true
                      }));
                      const index = nodes.findIndex(n => n.id === node.id);
                      if (index !== -1) {
                          const newNodes = [...nodes];
                          newNodes.splice(index + 1, 0, ...newSubNodes);
                          setNodes(newNodes);
                      }
                  }
              } catch (e) {
                  console.error(e);
                  alert("Could not expand event.");
              } finally {
                  setAiLoading(prev => { const n = {...prev}; delete n[node.id]; return n; });
              }
          };

          const handleAiEnhance = async (node) => {
              if (!ENABLE_AI) return;
              setAiLoading(prev => ({ ...prev, [node.id]: 'enhance' }));
              try {
                  const prompt = `Rewrite this timeline event description to be more engaging, concise, and historical (approx 30 words): "${node.content || node.title}".`;
                  const text = await callGemini(prompt, false);
                  updateNode(node.id, 'content', text);
              } catch (e) {
                  alert("Could not enhance text.");
              } finally {
                  setAiLoading(prev => { const n = {...prev}; delete n[node.id]; return n; });
              }
          };

          // --- MOUSE TRACKING ---
          const handleMouseMove = (e) => {
            if (!containerRef.current) return;
            const containerRect = containerRef.current.getBoundingClientRect();
            
            // HORIZONTAL LOGIC ONLY
            const centerY = containerRect.top + (containerRect.height / 2);
            const mouseY = e.clientY;
            const distance = Math.abs(mouseY - centerY);
            
            if (distance > 100) { setHoverPos(null); return; }
            
            const mouseX = e.clientX;
            const relativeX = (mouseX - containerRect.left) + containerRef.current.scrollLeft;
            setHoverPos(relativeX);

            const groupElements = document.querySelectorAll('[data-group-index]');
            let calculatedIndex = nodes.length; 
            for (let i = 0; i < groupElements.length; i++) {
                const el = groupElements[i];
                const rect = el.getBoundingClientRect();
                const splitPoint = rect.left + (rect.width / 2);
                
                if (mouseX < splitPoint) {
                        const startIndex = parseInt(el.getAttribute('data-start-index'));
                        calculatedIndex = startIndex;
                        break;
                }
            }
            setInsertIndex(calculatedIndex);
          };

          const handleMouseLeave = () => { setHoverPos(null); };

          // --- EXPORT ---
          const handleExportImage = async () => {
            if (window.html2canvas) {
                const exportEl = exportContainerRef.current;
                const timelineContent = timelineContentRef.current;
                
                const originalBg = exportEl.style.backgroundColor;
                const originalPadding = exportEl.style.padding;
                const originalTimelineWidth = timelineContent.style.width;
                const originalTimelineOverflow = timelineContent.style.overflow;
                
                const isDark = document.documentElement.classList.contains('dark');
                const bgColor = isDark ? '#0f172a' : '#f8fafc';
                
                // Prepare for export
                exportEl.style.backgroundColor = bgColor;
                exportEl.style.padding = '40px';
                
                // Ensure full width
                timelineContent.style.width = 'max-content';
                timelineContent.style.overflow = 'visible';

                try {
                    const canvas = await window.html2canvas(exportEl, { 
                        backgroundColor: bgColor, 
                        scale: 2, 
                        useCORS: true, 
                        ignoreElements: (element) => element.classList.contains('no-print') 
                    });
                    const link = document.createElement('a');
                    link.download = 'timeline.png';
                    link.href = canvas.toDataURL();
                    link.click();
                } finally { 
                    // Restore styles
                    exportEl.style.backgroundColor = originalBg; 
                    exportEl.style.padding = originalPadding;
                    timelineContent.style.width = originalTimelineWidth;
                    timelineContent.style.overflow = originalTimelineOverflow;
                }
            } else { alert("Loading libraries..."); }
          };

          const handleExportPDF = async () => {
              if (window.html2canvas && window.jspdf) {
                const { jsPDF } = window.jspdf;
                const exportEl = exportContainerRef.current;
                const timelineContent = timelineContentRef.current;
                
                const isDark = document.documentElement.classList.contains('dark');
                const originalBg = exportEl.style.backgroundColor;
                const originalPadding = exportEl.style.padding;
                const originalTimelineWidth = timelineContent.style.width;
                const originalTimelineOverflow = timelineContent.style.overflow;
                
                const bgColor = isDark ? '#0f172a' : '#ffffff';
                
                exportEl.style.backgroundColor = bgColor;
                exportEl.style.padding = '40px'; 
                
                timelineContent.style.width = 'max-content';
                timelineContent.style.overflow = 'visible';

                try {
                    const canvas = await window.html2canvas(exportEl, { 
                        backgroundColor: bgColor, 
                        scale: 2, 
                        useCORS: true, 
                        ignoreElements: (element) => element.classList.contains('no-print') 
                    });
                    const imgData = canvas.toDataURL('image/png');
                    
                    // Create Landscape PDF
                    const pdf = new jsPDF('l', 'mm', 'a4');
                    
                    const pdfWidth = pdf.internal.pageSize.getWidth();
                    const pdfHeight = pdf.internal.pageSize.getHeight();
                    const imgProps = pdf.getImageProperties(imgData);
                    
                    const imgHeight = (imgProps.height * pdfWidth) / imgProps.width;
                    
                    if (imgHeight > pdfHeight) {
                         const customPdf = new jsPDF('l', 'mm', [pdfWidth, imgHeight + 20]);
                         customPdf.addImage(imgData, 'PNG', 0, 0, pdfWidth, imgHeight);
                         customPdf.save('timeline.pdf');
                    } else {
                         pdf.addImage(imgData, 'PNG', 0, 0, pdfWidth, imgHeight);
                         pdf.save('timeline.pdf');
                    }
                } finally { 
                    exportEl.style.backgroundColor = originalBg; 
                    exportEl.style.padding = originalPadding;
                    timelineContent.style.width = originalTimelineWidth;
                    timelineContent.style.overflow = originalTimelineOverflow;
                }
              } else { alert("PDF library loading..."); }
          };

          const handleSaveTemplate = () => {
              const cleanNodes = nodes.map(node => ({ id: node.id, type: node.type || 'event', side: node.side, title: node.title, date: node.date, content: node.content, comments: node.comments || [], isSub: node.isSub }));
              const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(cleanNodes, null, 2));
              const downloadAnchorNode = document.createElement('a');
              downloadAnchorNode.setAttribute("href", dataStr);
              downloadAnchorNode.setAttribute("download", "timeline_template.json");
              document.body.appendChild(downloadAnchorNode);
              downloadAnchorNode.click();
              downloadAnchorNode.remove();
          };

          const handleLoadTemplateClick = () => { fileInputRef.current.click(); };
          const handleFileChange = (e) => {
              const fileReader = new FileReader();
              fileReader.readAsText(e.target.files[0], "UTF-8");
              fileReader.onload = e => {
                  try {
                      const parsed = JSON.parse(e.target.result);
                      if (Array.isArray(parsed)) setNodes(parsed);
                      else alert("Invalid file format");
                  } catch (err) { alert("Error parsing file"); }
              };
              e.target.value = null; 
          };

          const currentDir = uiLanguage === 'he' ? 'rtl' : 'ltr';

          return (
            <div className="min-h-screen bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 p-4 font-sans transition-colors duration-300 ease-in-out flex flex-col" dir={currentDir}>
              <style>{`
                @media print {
                  .no-print { display: none !important; }
                  body { background-color: white; }
                  .print-break-inside-avoid { break-inside: avoid; }
                }
                .btn-framed { @apply flex flex-col items-center justify-center w-28 h-16 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl shadow-sm transition-all hover:border-slate-300 dark:hover:border-slate-600 hover:shadow-md active:scale-95; }
                /* Custom scrollbar for horizontal timeline */
                .horizontal-scroll::-webkit-scrollbar {
                    height: 8px;
                }
                .horizontal-scroll::-webkit-scrollbar-track {
                    background: transparent;
                }
                .horizontal-scroll::-webkit-scrollbar-thumb {
                    background-color: #cbd5e1;
                    border-radius: 4px;
                }
                .dark .horizontal-scroll::-webkit-scrollbar-thumb {
                    background-color: #475569;
                }
              `}</style>

              {/* GENERATE MODAL */}
              {showGenerateModal && (
                  <div className="fixed inset-0 z-[60] flex items-center justify-center bg-black/50 backdrop-blur-sm p-4">
                      <div className="bg-white dark:bg-slate-800 p-6 rounded-2xl shadow-2xl w-full max-w-md border border-slate-200 dark:border-slate-700">
                          <div className="flex justify-between items-center mb-4">
                              <h3 className="text-xl font-bold flex items-center gap-2">
                                  <Sparkles className="text-purple-500" /> 
                                  {t.aiGenerate}
                              </h3>
                              <button onClick={() => setShowGenerateModal(false)} className="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200"><X size={20}/></button>
                          </div>
                          <div className="space-y-4">
                              <p className="text-slate-600 dark:text-slate-300 text-sm">Enter a topic, and Gemini will create a structured timeline for you.</p>
                              <input 
                                type="text" 
                                value={generatePrompt}
                                onChange={(e) => setGeneratePrompt(e.target.value)}
                                placeholder={t.aiPromptPlaceholder}
                                className="w-full p-3 rounded-lg border border-slate-300 dark:border-slate-600 bg-slate-50 dark:bg-slate-900 focus:ring-2 focus:ring-purple-500 outline-none transition-all"
                                onKeyDown={(e) => e.key === 'Enter' && handleAiGenerateTimeline()}
                              />
                              <button 
                                onClick={handleAiGenerateTimeline}
                                disabled={isGeneratingTimeline || !generatePrompt.trim()}
                                className="w-full py-3 bg-purple-600 hover:bg-purple-700 text-white rounded-lg font-medium shadow-lg hover:shadow-xl transition-all disabled:opacity-50 disabled:cursor-not-allowed flex justify-center items-center gap-2"
                              >
                                  {isGeneratingTimeline ? <><Loader2 className="animate-spin"/> {t.generating}</> : <><Wand2 size={18} /> {t.aiGenerate}</>}
                              </button>
                          </div>
                      </div>
                  </div>
              )}

              {/* Header Controls - Forced LTR so positions don't swap */}
              <div className="w-full max-w-[95%] mx-auto mb-6 flex flex-wrap items-center justify-between gap-4 no-print relative z-50" dir="ltr">
                   {/* Left Side: Language, Mode, Theme */}
                   <div className="flex items-center gap-2 bg-white dark:bg-slate-800 p-2 rounded-lg border border-slate-200 dark:border-slate-700 shadow-sm">
                      <Globe size={16} className="text-slate-400" />
                      <select value={uiLanguage} onChange={(e) => setUiLanguage(e.target.value)} className="bg-transparent border-none outline-none text-sm text-slate-600 dark:text-slate-300 cursor-pointer bg-white dark:bg-slate-800">
                          <option value="en">English</option>
                          <option value="he">עברית</option>
                      </select>
                      <div className="w-px h-4 bg-slate-200 dark:bg-slate-700 mx-1"></div>
                      <button onClick={() => setDarkMode(!darkMode)} className="p-1.5 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 rounded-md transition-colors">
                        {darkMode ? <Moon size={16} /> : <Sun size={16} />}
                      </button>
                      
                      <div className="w-px h-4 bg-slate-200 dark:bg-slate-700 mx-1"></div>
                      
                      <button onClick={() => setIsReversed(!isReversed)} className="p-1.5 text-slate-400 hover:text-blue-600 dark:hover:text-blue-400 rounded-md transition-colors" title={t.reverseTimeline}>
                         <ArrowRightLeft size={16} />
                      </button>

                      <div className="w-px h-4 bg-slate-200 dark:bg-slate-700 mx-1"></div>

                      <button onClick={mirrorSides} className="p-1.5 text-slate-400 hover:text-blue-600 dark:hover:text-blue-400 rounded-md transition-colors" title={t.mirrorSides}>
                         <ArrowUpDown size={16} />
                      </button>
                   </div>

                   {/* Center/Right: Actions */}
                   <div className="flex flex-wrap items-center gap-2">
                        {ENABLE_AI && (
                            <button 
                                onClick={() => setShowGenerateModal(true)}
                                className="flex items-center gap-1.5 px-4 py-3 bg-purple-600 text-white rounded-lg hover:bg-purple-700 transition-colors text-sm font-medium shadow-md hover:shadow-lg"
                            >
                                <Sparkles size={16} />
                                <span className="hidden sm:inline">AI Generate</span>
                            </button>
                        )}
                        <input type="file" ref={fileInputRef} onChange={handleFileChange} style={{display: 'none'}} accept=".json" />
                        
                        <button onClick={handleSaveTemplate} className="btn-framed group" title={t.save}>
                            <FileJson size={20} className="text-slate-400 dark:text-slate-500 group-hover:text-green-600 dark:group-hover:text-green-400" />
                        </button>
                        <button onClick={handleLoadTemplateClick} className="btn-framed group" title={t.load}>
                            <Upload size={20} className="text-slate-400 dark:text-slate-500 group-hover:text-blue-600 dark:group-hover:text-blue-400" />
                        </button>
                        <button onClick={handleExportPDF} className="btn-framed group hover:border-red-300 dark:hover:border-red-700 hover:bg-red-50 dark:hover:bg-red-900/10" title={t.pdf}>
                            <Printer size={20} className="text-slate-400 dark:text-slate-500 group-hover:text-red-600 dark:group-hover:text-red-400" />
                        </button>
                        <button onClick={handleExportImage} className="btn-framed group hover:border-blue-300 dark:hover:border-blue-700 hover:bg-blue-50 dark:hover:bg-blue-900/10" title={t.image}>
                            <Download size={20} className="text-slate-400 dark:text-slate-500 group-hover:text-blue-600 dark:group-hover:text-blue-400" />
                        </button>
                   </div>
              </div>

              {/* WRAPPER FOR EXPORT - Contains both Header and Timeline */}
              <div 
                 ref={exportContainerRef} 
                 id="export-container"
                 className="flex-1 w-full flex flex-row items-center overflow-x-auto horizontal-scroll px-12 pt-12 pb-12"
              >

                {/* Title Section */}
                <div 
                  className={`mb-8 group/header relative flex-shrink-0 w-80 pr-12 text-left mr-8 ${currentDir === 'rtl' ? 'pl-8 ml-auto text-right ml-8' : 'pr-12 text-left mr-8'}`}
                >
                     <div className="flex flex-col w-full gap-2">
                        <div className={`w-full ${appTitle === t.defaultTitle ? 'no-print' : ''}`}>
                            <RichTextEditor
                                value={appTitle}
                                onChange={setAppTitle}
                                placeholder={t.titlePlaceholder}
                                align={currentDir === 'rtl' ? 'right' : 'start'}
                                className={`text-4xl font-bold text-slate-900 dark:text-white bg-transparent border-b border-transparent hover:border-slate-300 dark:hover:border-slate-600 focus:border-blue-500 focus:outline-none w-full transition-colors pb-2`}
                            />
                        </div>
                        <div className={`w-full ${appSubtitle === t.subtitleDefault ? 'no-print' : ''}`}>
                            <RichTextEditor
                                value={appSubtitle}
                                onChange={setAppSubtitle}
                                placeholder={t.subtitlePlaceholder}
                                align={currentDir === 'rtl' ? 'right' : 'start'}
                                className={`text-slate-500 dark:text-slate-400 bg-transparent border-b border-transparent hover:border-slate-300 dark:hover:border-slate-600 focus:border-blue-500 focus:outline-none w-full transition-colors pb-1`}
                            />
                        </div>
                     </div>
                </div>

                {/* Timeline Container */}
                <div 
                    className="relative transition-all duration-500 ease-in-out flex-1 flex flex-row items-stretch min-h-[500px]" 
                    id="timeline-content"
                    dir="ltr"
                    ref={(el) => { containerRef.current = el; timelineContentRef.current = el; }}
                    onMouseMove={handleMouseMove} 
                    onMouseLeave={handleMouseLeave}
                > 
                  {/* Central Line */}
                  <div className="absolute bg-slate-200 dark:bg-slate-700 z-0 pointer-events-none top-1/2 left-0 right-0 h-1 mt-5"></div>
                  
                  {/* Hover Add Button */}
                  {hoverPos !== null && insertIndex !== null && (
                      <div 
                        className="absolute z-30 pointer-events-auto no-print flex items-center justify-center w-6 h-6" 
                        style={{ left: hoverPos, top: '50%', marginTop: '20px', transform: 'translate(-50%, -50%)' }}
                      >
                          <button onClick={() => addNode(insertIndex)} className="w-6 h-6 rounded-full bg-blue-500 hover:bg-blue-600 text-white flex items-center justify-center shadow-lg transform hover:scale-110 transition-transform cursor-pointer border-2 border-white dark:border-slate-900" title={t.addNode}>
                              <Plus size={14} />
                          </button>
                      </div>
                  )}

                  <div className="flex flex-row gap-0">
                    {renderGroups.map((group, groupIndex) => {
                      const mainNode = group.main;
                      const children = group.children || [];
                      const index = mainNode.originalIndex;
                      const lastIndex = index + children.length; 
                      
                      const side = mainNode.side;

                      return (
                      <div key={mainNode.id} className="relative group/wrapper print-break-inside-avoid flex-shrink-0 flex flex-col justify-center min-w-[320px] h-auto" data-group-index={groupIndex} data-start-index={index} data-last-index={lastIndex}>
                        
                        {/* Dot */}
                        <div className="timeline-dot absolute rounded-full z-20 shadow-sm transition-all w-4 h-4 bg-white dark:bg-slate-800 border-4 border-blue-500 group-hover/wrapper:scale-125 top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 mt-5"></div>

                        {/* HORIZONTAL LAYOUT */}
                        <div className="flex flex-col h-full w-full">
                            {/* Top Section (Left Side) */}
                            <div className={`flex-1 flex flex-col justify-end pb-8 px-4 transition-all duration-300 ${side === 'left' ? 'opacity-100' : 'opacity-0 pointer-events-none'}`}>
                                {side === 'left' && (
                                    <NodeCard 
                                        mainNode={mainNode} 
                                        children={children} 
                                        nodes={nodes} 
                                        t={t} 
                                        index={index}
                                        actions={{updateNode, deleteNode, indentNode, outdentNode, toggleNodeSide, moveNode, handleAiExpand, handleAiEnhance, toggleDate, aiLoading, ENABLE_AI, currentDir}}
                                        isTopSection={true}
                                    />
                                )}
                            </div>
                            
                            {/* Spacer for line */}
                            <div className="h-10"></div>

                            {/* Bottom Section (Right Side) */}
                            <div className={`flex-1 flex flex-col justify-start pt-8 px-4 transition-all duration-300 ${side === 'right' ? 'opacity-100' : 'opacity-0 pointer-events-none'}`}>
                                {side === 'right' && (
                                    <NodeCard 
                                        mainNode={mainNode} 
                                        children={children} 
                                        nodes={nodes} 
                                        t={t} 
                                        index={index}
                                        actions={{updateNode, deleteNode, indentNode, outdentNode, toggleNodeSide, moveNode, handleAiExpand, handleAiEnhance, toggleDate, aiLoading, ENABLE_AI, currentDir}}
                                        isTopSection={false}
                                    />
                                )}
                            </div>
                        </div>
                      </div>
                    )})}
                  </div>
                </div>
              </div>
            </div>
          );
        };

        // Extracted NodeCard
        const NodeCard = ({ mainNode, children, nodes, t, index, actions, isTopSection }) => {
            const { updateNode, deleteNode, indentNode, outdentNode, toggleNodeSide, moveNode, handleAiExpand, handleAiEnhance, toggleDate, aiLoading, ENABLE_AI, currentDir } = actions;
            
            // "Butterfly" layout for Horizontal Top Nodes
            const reverseContent = isTopSection;

            // Added w-80 (320px) to force width constraint
            return (
                <div className={`bg-white dark:bg-slate-800 rounded-xl shadow-sm border border-slate-200 dark:border-slate-700 relative hover:shadow-md transition-all overflow-hidden duration-300 ease-in-out w-80 flex ${reverseContent ? 'flex-col-reverse' : 'flex-col'}`} dir={currentDir}>
                    
                    {/* Main Content Area */}
                    <div className="p-4 relative z-10 bg-white dark:bg-slate-800 group/main-content transition-colors duration-300 ease-in-out">
                        <div className="space-y-2">
                            {mainNode.date !== null && (
                                <input type="text" value={mainNode.date} onChange={(e) => updateNode(mainNode.id, 'date', e.target.value)} className="w-full font-semibold uppercase tracking-wider bg-transparent border-none focus:outline-none placeholder-blue-300 text-xs text-blue-600 dark:text-blue-400 dark:placeholder-blue-700" placeholder={t.datePlaceholder} />
                            )}
                            <RichTextEditor value={mainNode.title} onChange={(val) => updateNode(mainNode.id, 'title', val)} singleLine={true} className="w-full font-bold text-slate-800 dark:text-slate-100 text-lg border-b border-transparent hover:border-slate-200 dark:hover:border-slate-600 focus:border-blue-500 transition-colors py-1" placeholder={t.titleNodePlaceholder} />
                            
                            <div className="relative group/content">
                                <RichTextEditor value={mainNode.content} onChange={(val) => updateNode(mainNode.id, 'content', val)} className="w-full text-slate-600 dark:text-slate-300 text-sm min-h-[40px]" placeholder={t.descNodePlaceholder} />
                            </div>
                        </div>

                        {/* Main Node Actions */}
                        <div className="mt-3 pt-2 border-t border-slate-100 dark:border-slate-700 flex justify-start items-center no-print opacity-0 group-hover/main-content:opacity-100 transition-opacity">
                            <NodeControls 
                                node={mainNode} 
                                index={index} 
                                isSub={false} 
                                totalNodes={nodes.length}
                                onIndent={indentNode}
                                onOutdent={outdentNode}
                                onToggleSide={toggleNodeSide}
                                onMove={moveNode}
                                onDelete={deleteNode}
                                onAiExpand={handleAiExpand}
                                onAiEnhance={handleAiEnhance}
                                onToggleDate={toggleDate}
                                isLoadingExpand={aiLoading[mainNode.id] === 'expand'}
                                isLoadingEnhance={aiLoading[mainNode.id] === 'enhance'}
                                enableAi={ENABLE_AI}
                                t={t}
                            />
                        </div>
                    </div>

                    {/* Sub Nodes Area */}
                    {children.length > 0 && (
                        <div className={`${reverseContent ? 'border-b' : 'border-t'} border-slate-200 dark:border-slate-700`}>
                            {children.map((child) => (
                                <SubNodeRenderer 
                                key={child.id} 
                                node={child} 
                                index={child.originalIndex}
                                totalNodes={nodes.length}
                                onUpdate={updateNode}
                                onDelete={deleteNode}
                                onToggleDate={toggleDate}
                                onIndent={indentNode}
                                onOutdent={outdentNode}
                                onToggleSide={toggleNodeSide}
                                onMove={moveNode}
                                onAiEnhance={handleAiEnhance}
                                isLoadingEnhance={aiLoading[child.id] === 'enhance'}
                                enableAi={ENABLE_AI}
                                t={t}
                                />
                            ))}
                        </div>
                    )}
                </div>
            );
        };

        const root = createRoot(document.getElementById('root'));
        root.render(<TimelineApp />);
    </script>
</body>
</html>
