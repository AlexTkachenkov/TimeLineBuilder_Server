<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyCloud - Self Hosted Storage</title>
    
    <!-- 1. Tailwind CSS (Styling) -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- 2. React & ReactDOM (Core Libraries) -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    
    <!-- 3. Babel (Enables JSX in browser) -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Custom Scrollbar Styles -->
    <style>
        body { background-color: #0f172a; color: #cbd5e1; }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #1e293b; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #64748b; }
    </style>
</head>
<body>
    <!-- The Root Element where React will render -->
    <div id="root"></div>

    <!-- The Application Logic -->
    <script type="text/babel" data-type="module">
        import { useState, useEffect } from "https://esm.sh/react@18.2.0";
        import { createRoot } from "https://esm.sh/react-dom@18.2.0/client";
        
        // Import Icons from Lucide React via ESM
        import { 
            LayoutDashboard, Users, HardDrive, ShieldCheck, Folder, FileText, 
            Image as ImageIcon, MoreHorizontal, Search, Upload, FolderPlus, 
            Grid, List, LogOut, Cloud, CheckCircle, Activity, Settings, 
            File, Menu, X, ChevronRight, Download, Trash2, Maximize2, 
            Lock, Info, ToggleLeft, ToggleRight, AlertCircle, Server 
        } from "https://esm.sh/lucide-react@0.292.0?deps=react@18.2.0";

        // --- Mock Data ---

        const MOCK_ROOT_FILES = [
            { id: 'folder-photos', name: 'Photos', type: 'folder', items: 12, date: '2024-03-10' }, 
            { id: 'folder-work', name: 'Work Projects', type: 'folder', items: 8, date: '2024-02-15' },
            { id: 'doc-1', name: 'Document.docx', type: 'word', size: '2.4 MB', date: '2024-03-12' },
            { id: 'doc-2', name: 'Presentation.pptx', type: 'ppt', size: '15 MB', date: '2024-03-11' },
            { id: 'doc-3', name: 'Budget.xlsx', type: 'excel', size: '1.2 MB', date: '2024-03-01' },
            { id: 'file-conf', name: 'Backup_Config.json', type: 'code', size: '4 KB', date: '2024-01-20' },
        ];

        const MOCK_PHOTOS = [
            { id: 101, name: 'IMG_20240315_001.jpg', size: '3.2 MB', date: '2024-03-15', url: 'https://picsum.photos/seed/101/400/400' },
            { id: 102, name: 'Family_Vacation.jpg', size: '4.1 MB', date: '2024-03-14', url: 'https://picsum.photos/seed/102/400/400' },
            { id: 103, name: 'Mountain_Hike.png', size: '5.5 MB', date: '2024-03-12', url: 'https://picsum.photos/seed/103/400/400' },
            { id: 104, name: 'Office_Party.jpg', size: '2.8 MB', date: '2024-03-10', url: 'https://picsum.photos/seed/104/400/400' },
            { id: 105, name: 'Design_Mockup_v1.png', size: '1.2 MB', date: '2024-03-09', url: 'https://picsum.photos/seed/105/400/400' },
        ];

        const RECENT_LOGS = [
            { id: 1, time: '2024-03-15 11:03:57', msg: 'User [admin] logged in from 192.168.1.5', type: 'info' },
            { id: 2, time: '2024-03-15 11:03:13', msg: 'Scheduled Backup started: Volume 1', type: 'system' },
            { id: 3, time: '2024-03-15 11:03:17', msg: 'DDNS update successful: mydomain.com', type: 'success' },
        ];

        const DEFAULT_USERS = [
            { id: 'user-1', name: 'Alex' },
            { id: 'user-2', name: 'Roee' },
            { id: 'user-3', name: 'Vova' },
            { id: 'user-4', name: 'Mom' },
        ];

        // --- Components ---

        const Toast = ({ message, type, onClose }) => {
            useEffect(() => {
                const timer = setTimeout(() => {
                    onClose();
                }, 3000);
                return () => clearTimeout(timer);
            }, [onClose]);

            return (
                <div className="fixed bottom-6 right-6 z-50 animate-in slide-in-from-bottom-5 fade-in duration-300">
                    <div className="bg-slate-800 border border-slate-600 text-slate-100 px-4 py-3 rounded-lg shadow-2xl flex items-center gap-3 min-w-[300px]">
                        {type === 'success' ? (
                            <CheckCircle className="text-green-400" size={20} />
                        ) : (
                            <AlertCircle className="text-blue-400" size={20} />
                        )}
                        <span className="text-sm font-medium">{message}</span>
                    </div>
                </div>
            );
        };

        const HealthChart = ({ data, color = "#3b82f6", label }) => {
            const height = 100;
            const width = 300;
            const max = Math.max(...data) * 1.2;
            
            const points = data.map((val, i) => {
                const x = (i / (data.length - 1)) * width;
                const y = height - (val / max) * height;
                return `${x},${y}`;
            }).join(' ');

            return (
                <div className="flex flex-col mb-6">
                    <span className="text-slate-400 text-xs mb-1 ml-1">{label}</span>
                    <div className="relative h-[100px] w-full bg-slate-800/50 rounded-lg overflow-hidden border border-slate-700/50">
                        <svg viewBox={`0 0 ${width} ${height}`} className="w-full h-full p-2 overflow-visible">
                            <line x1="0" y1="25" x2={width} y2="25" stroke="#334155" strokeWidth="1" />
                            <line x1="0" y1="50" x2={width} y2="50" stroke="#334155" strokeWidth="1" />
                            <line x1="0" y1="75" x2={width} y2="75" stroke="#334155" strokeWidth="1" />
                            <polyline fill="none" stroke={color} strokeWidth="2" points={points} strokeLinecap="round" strokeLinejoin="round" />
                            <polygon fill={color} fillOpacity="0.1" points={`0,${height} ${points} ${width},${height}`} />
                        </svg>
                    </div>
                </div>
            );
        };

        const AdminDashboard = () => {
            const [cpuData] = useState([10, 15, 12, 40, 35, 80, 25, 20, 15, 12, 18, 22]);
            const [ramData] = useState([45, 45, 46, 48, 55, 55, 55, 54, 54, 54, 54, 54]);
            
            return (
                <div className="p-6 md:p-8 animate-in fade-in duration-500 overflow-y-auto h-full relative">
                    <h2 className="text-2xl font-light text-slate-100 mb-6">Server Dashboard</h2>
                    
                    <div className="grid grid-cols-1 lg:grid-cols-2 gap-6 mb-8">
                        <div className="bg-slate-800/50 border border-slate-700 rounded-xl p-6 shadow-xl backdrop-blur-sm">
                            <div className="flex justify-between items-center mb-6">
                                <h3 className="text-lg font-medium text-slate-200">System Health</h3>
                                <Activity size={18} className="text-blue-400" />
                            </div>
                            <HealthChart data={cpuData} label="CPU Load (%)" color="#38bdf8" />
                            <HealthChart data={ramData} label="RAM Usage (GB)" color="#818cf8" />
                        </div>

                        <div className="flex flex-col gap-6">
                            <div className="bg-slate-800/50 border border-slate-700 rounded-xl p-6 shadow-xl backdrop-blur-sm">
                                <h3 className="text-lg font-medium text-slate-200 mb-4">Storage Status</h3>
                                <div className="mb-2 flex justify-between text-sm text-slate-400">
                                    <span>Primary RAID Array</span>
                                    <span>2.5 TB used of 8 TB</span>
                                </div>
                                <div className="w-full bg-slate-700 rounded-full h-3 mb-4">
                                    <div className="bg-gradient-to-r from-blue-500 to-cyan-400 h-3 rounded-full" style={{ width: '31%' }}></div>
                                </div>
                            </div>

                            <div className="bg-slate-800/50 border border-slate-700 rounded-xl p-6 shadow-xl backdrop-blur-sm flex-1">
                                <h3 className="text-lg font-medium text-slate-200 mb-4">Connectivity</h3>
                                <div className="space-y-4">
                                    <div className="flex items-center gap-3">
                                        <div className="bg-green-500/20 p-2 rounded-full">
                                            <CheckCircle size={20} className="text-green-400" />
                                        </div>
                                        <div>
                                            <div className="text-slate-200 text-sm font-medium">DDNS Active</div>
                                            <div className="text-slate-500 text-xs">mydomain.com</div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div className="bg-slate-800/50 border border-slate-700 rounded-xl p-6 shadow-xl backdrop-blur-sm">
                        <h3 className="text-lg font-medium text-slate-200 mb-4">Recent Activity</h3>
                        <div className="space-y-3">
                            {RECENT_LOGS.map((log) => (
                                <div key={log.id} className="flex items-start gap-3 text-sm border-b border-slate-700/50 pb-2 last:border-0 last:pb-0">
                                    <div className={`w-2 h-2 rounded-full mt-1.5 shrink-0 ${
                                        log.type === 'alert' ? 'bg-red-500' : 
                                        log.type === 'success' ? 'bg-green-500' : 'bg-blue-400'
                                    }`} />
                                    <div className="flex-1">
                                        <span className="text-slate-400 font-mono text-xs mr-3">{log.time} | log:</span>
                                        <span className="text-slate-300">{log.msg}</span>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            );
        };

        const FileExplorer = ({ role }) => {
            const [viewMode, setViewMode] = useState('grid');
            const [currentPath, setCurrentPath] = useState([
                { id: 'root', name: 'Home' },
                { id: 'myfiles', name: 'My Files' }
            ]);

            const [permissions, setPermissions] = useState({}); 
            const [activeMenu, setActiveMenu] = useState(null); 
            const [authModalOpen, setAuthModalOpen] = useState(false);
            const [selectedFileForAuth, setSelectedFileForAuth] = useState(null);
            const [toast, setToast] = useState(null);

            const currentFolder = currentPath[currentPath.length - 1];

            useEffect(() => {
                const handleClick = () => setActiveMenu(null);
                window.addEventListener('click', handleClick);
                return () => window.removeEventListener('click', handleClick);
            }, []);

            const handleNavigate = (folder) => {
                setCurrentPath([...currentPath, folder]);
            };

            const handleNavigateUp = (index) => {
                setCurrentPath(currentPath.slice(0, index + 1));
            };

            const handleMenuClick = (e, file) => {
                e.stopPropagation();
                const x = e.clientX;
                const y = e.clientY;
                setActiveMenu({ id: file.id, file, x, y });
            };

            const openAuthModal = (file) => {
                setSelectedFileForAuth(file);
                setAuthModalOpen(true);
                setActiveMenu(null);
            };

            const togglePermission = (userId, userName) => {
                if (!selectedFileForAuth) return;
                
                setPermissions(prev => {
                    const filePerms = prev[selectedFileForAuth.id] || {};
                    const newStatus = !filePerms[userId];
                    
                    const newState = {
                        ...prev,
                        [selectedFileForAuth.id]: {
                            ...filePerms,
                            [userId]: newStatus
                        }
                    };

                    setToast({
                        message: `Authorisation ${newStatus ? 'added' : 'removed'} for ${userName}`,
                        type: newStatus ? 'success' : 'info'
                    });

                    return newState;
                });
            };

            const triggerDownload = (fileName) => {
                setToast({
                    message: `Download started: ${fileName}`,
                    type: 'success'
                });
            };

            const getFileIcon = (type, size = 12) => {
                const className = `w-${size} h-${size} mb-2`;
                switch (type) {
                    case 'folder': return <Folder className={`${className} text-blue-200 fill-blue-500/20`} />;
                    case 'word': return <FileText className={`${className} text-blue-500`} />;
                    case 'ppt': return <FileText className={`${className} text-orange-500`} />;
                    case 'excel': return <FileText className={`${className} text-emerald-500`} />;
                    default: return <File className={`${className} text-slate-400`} />;
                }
            };

            const getFileColor = (type) => {
                switch (type) {
                    case 'folder': return 'bg-slate-700/50 border-slate-600';
                    case 'word': return 'bg-blue-900/20 border-blue-900/40';
                    case 'ppt': return 'bg-orange-900/20 border-orange-900/40';
                    case 'excel': return 'bg-emerald-900/20 border-emerald-900/40';
                    default: return 'bg-slate-700/50 border-slate-600';
                }
            };

            const renderPhotos = () => (
                <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-4 animate-in zoom-in-95 duration-300">
                    {MOCK_PHOTOS.map((photo) => (
                        <div key={photo.id} className="group relative aspect-square bg-slate-800 rounded-lg border border-slate-700 overflow-hidden cursor-pointer hover:border-blue-500 hover:shadow-lg transition-all">
                            <div className="w-full h-full bg-slate-800 relative overflow-hidden">
                                <img 
                                    src={photo.url} 
                                    alt={photo.name}
                                    className="w-full h-full object-cover transition-transform duration-500 group-hover:scale-110 opacity-90 group-hover:opacity-100"
                                    onError={(e) => {
                                        e.target.onerror = null;
                                        e.target.style.display = 'none';
                                        e.target.parentNode.classList.add('flex', 'items-center', 'justify-center', 'bg-slate-800');
                                    }}
                                />
                                <ImageIcon className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 text-slate-600 -z-10" size={32} />
                            </div>
                            
                            <div className="absolute inset-x-0 bottom-0 bg-gradient-to-t from-black/90 via-black/60 to-transparent p-3 translate-y-full group-hover:translate-y-0 transition-transform duration-200">
                                <p className="text-white text-xs font-medium truncate">{photo.name}</p>
                                <div className="flex gap-2 mt-2 justify-end">
                                    <button 
                                        onClick={(e) => { e.stopPropagation(); triggerDownload(photo.name); }} 
                                        className="p-1.5 bg-white/10 hover:bg-white/20 rounded-md text-white"
                                    >
                                        <Download size={12} />
                                    </button>
                                </div>
                            </div>
                        </div>
                    ))}
                </div>
            );

            const renderFiles = () => {
                if (viewMode === 'list') {
                    return (
                        <div className="flex flex-col gap-2 animate-in fade-in duration-300">
                            <div className="grid grid-cols-12 gap-4 px-4 py-2 text-xs font-medium text-slate-500 uppercase tracking-wider border-b border-slate-700/50 mb-2">
                                <div className="col-span-6">Name</div>
                                <div className="col-span-3">Date Modified</div>
                                <div className="col-span-2">Size</div>
                                <div className="col-span-1 text-right">Actions</div>
                            </div>
                            {MOCK_ROOT_FILES.map((file) => (
                                <div 
                                    key={file.id}
                                    onClick={() => file.type === 'folder' ? handleNavigate(file) : null}
                                    className={`group flex items-center grid grid-cols-12 gap-4 px-4 py-3 rounded-lg border border-transparent hover:bg-slate-800/80 hover:border-slate-700 transition-colors cursor-pointer ${file.type === 'folder' ? '' : 'hover:border-blue-500/30'}`}
                                >
                                    <div className="col-span-6 flex items-center gap-3">
                                        <div className="w-8 h-8 flex items-center justify-center">
                                            {getFileIcon(file.type, 6)}
                                        </div>
                                        <span className="text-slate-200 text-sm font-medium truncate">{file.name}</span>
                                    </div>
                                    <div className="col-span-3 text-slate-400 text-xs">{file.date}</div>
                                    <div className="col-span-2 text-slate-400 text-xs">
                                        {file.type === 'folder' ? `${file.items} items` : file.size}
                                    </div>
                                    <div className="col-span-1 flex justify-end">
                                        <button 
                                            onClick={(e) => handleMenuClick(e, file)}
                                            className="p-1.5 text-slate-400 hover:text-white rounded-md hover:bg-slate-700 opacity-0 group-hover:opacity-100 transition-all"
                                        >
                                            <MoreHorizontal size={16} />
                                        </button>
                                    </div>
                                </div>
                            ))}
                        </div>
                    );
                }

                return (
                    <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-4 animate-in fade-in duration-300">
                        {MOCK_ROOT_FILES.map((file) => (
                            <div 
                                key={file.id} 
                                onClick={() => file.type === 'folder' ? handleNavigate(file) : null}
                                className={`group relative p-4 rounded-xl border ${getFileColor(file.type)} hover:border-blue-500/50 hover:bg-slate-700/80 transition-all cursor-pointer flex flex-col items-center justify-center text-center h-48 shadow-lg`}
                            >
                                <button 
                                    onClick={(e) => handleMenuClick(e, file)}
                                    className="absolute top-3 right-3 text-slate-400 hover:text-white p-1 rounded-md hover:bg-slate-600 opacity-0 group-hover:opacity-100 transition-all z-10"
                                >
                                    <MoreHorizontal size={20} />
                                </button>
                                
                                {file.type !== 'folder' && (
                                    <button 
                                        onClick={(e) => { e.stopPropagation(); triggerDownload(file.name); }}
                                        className="absolute top-3 left-3 text-slate-400 hover:text-green-400 p-1 rounded-md hover:bg-slate-600 opacity-0 group-hover:opacity-100 transition-all z-10"
                                    >
                                        <Download size={20} />
                                    </button>
                                )}
                                
                                {getFileIcon(file.type)}
                                
                                <span className="text-slate-200 font-medium text-sm truncate w-full px-2 mt-2">{file.name}</span>
                                {file.type === 'folder' ? (
                                    <span className="text-slate-500 text-xs mt-1">{file.items} items</span>
                                ) : (
                                    <span className="text-slate-500 text-xs mt-1">{file.size}</span>
                                )}
                            </div>
                        ))}
                    </div>
                );
            };

            return (
                <div className="flex flex-col h-full animate-in fade-in duration-500 relative">
                    {toast && <Toast message={toast.message} type={toast.type} onClose={() => setToast(null)} />}

                    {activeMenu && (
                        <div 
                            className="fixed z-50 bg-slate-800 border border-slate-600 rounded-lg shadow-2xl py-1 w-48 animate-in zoom-in-95 duration-100"
                            style={{ top: activeMenu.y, left: Math.min(activeMenu.x, window.innerWidth - 200) }}
                            onClick={(e) => e.stopPropagation()}
                        >
                            {role === 'admin' ? (
                                <>
                                    <button className="w-full text-left px-4 py-2 text-sm text-slate-300 hover:bg-slate-700 flex items-center gap-2">
                                        <Info size={14} /> Properties
                                    </button>
                                    <button 
                                        onClick={() => openAuthModal(activeMenu.file)}
                                        className="w-full text-left px-4 py-2 text-sm text-slate-300 hover:bg-slate-700 flex items-center gap-2"
                                    >
                                        <Lock size={14} /> Authorisations
                                    </button>
                                    <div className="border-t border-slate-700 my-1"></div>
                                    <button className="w-full text-left px-4 py-2 text-sm text-red-400 hover:bg-red-500/10 flex items-center gap-2">
                                        <Trash2 size={14} /> Delete
                                    </button>
                                </>
                            ) : (
                                <>
                                    <button className="w-full text-left px-4 py-2 text-sm text-slate-300 hover:bg-slate-700 flex items-center gap-2">
                                        <Info size={14} /> Properties
                                    </button>
                                    <div className="border-t border-slate-700 my-1"></div>
                                    <button className="w-full text-left px-4 py-2 text-sm text-red-400 hover:bg-red-500/10 flex items-center gap-2">
                                        <Trash2 size={14} /> Delete
                                    </button>
                                </>
                            )}
                        </div>
                    )}

                    {authModalOpen && selectedFileForAuth && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/60 animate-in fade-in duration-200">
                            <div className="bg-slate-800 w-full max-w-sm rounded-xl border border-slate-700 shadow-2xl overflow-hidden animate-in zoom-in-95 duration-200" onClick={(e) => e.stopPropagation()}>
                                <div className="flex items-center justify-between px-4 py-3 border-b border-slate-700 bg-slate-900/50">
                                    <h3 className="text-slate-200 font-medium">Change Authorizations</h3>
                                    <button 
                                        onClick={() => setAuthModalOpen(false)}
                                        className="text-slate-400 hover:text-white transition-colors"
                                    >
                                        <X size={18} />
                                    </button>
                                </div>
                                
                                <div className="p-4">
                                    <div className="text-xs text-slate-400 mb-4 flex items-center gap-2 bg-blue-900/20 p-2 rounded border border-blue-900/40">
                                        <Folder size={14} className="text-blue-400" />
                                        Editing access for: <span className="text-blue-200 font-medium">{selectedFileForAuth.name}</span>
                                    </div>
                                    
                                    <div className="space-y-1">
                                        {DEFAULT_USERS.map((user) => {
                                            const isEnabled = permissions[selectedFileForAuth.id]?.[user.id];
                                            return (
                                                <div key={user.id} className="flex items-center justify-between p-3 rounded-lg hover:bg-slate-700/50 transition-colors">
                                                    <div className="flex items-center gap-3">
                                                        <div className="w-8 h-8 rounded-full bg-slate-600 flex items-center justify-center text-xs font-bold text-slate-200">
                                                            {user.name.charAt(0)}
                                                        </div>
                                                        <span className="text-slate-200 text-sm">{user.name}</span>
                                                    </div>
                                                    <button 
                                                        onClick={() => togglePermission(user.id, user.name)}
                                                        className={`transition-colors ${isEnabled ? 'text-green-400' : 'text-slate-600 hover:text-slate-500'}`}
                                                    >
                                                        {isEnabled ? <ToggleRight size={28} className="fill-green-400/10" /> : <ToggleLeft size={28} />}
                                                    </button>
                                                </div>
                                            );
                                        })}
                                    </div>
                                </div>
                                
                                <div className="p-3 bg-slate-900/30 border-t border-slate-700 flex justify-end">
                                    <button 
                                        onClick={() => setAuthModalOpen(false)}
                                        className="bg-blue-600 hover:bg-blue-500 text-white px-4 py-1.5 rounded-md text-sm transition-colors"
                                    >
                                        Done
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    <div className="h-16 border-b border-slate-700 flex items-center justify-between px-6 bg-slate-900/50 backdrop-blur-md sticky top-0 z-10">
                        <div className="relative w-96 hidden md:block">
                            <Search className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400" size={18} />
                            <input 
                                type="text" 
                                placeholder={`Search in ${currentFolder.name}...`}
                                className="w-full bg-slate-800 border border-slate-700 text-slate-200 pl-10 pr-4 py-2 rounded-lg focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 text-sm transition-all"
                            />
                        </div>
                        <div className="flex items-center gap-4">
                            <div className="w-8 h-8 rounded-full bg-gradient-to-tr from-blue-500 to-purple-600 flex items-center justify-center text-xs font-bold text-white shadow-lg cursor-pointer">
                                {role === 'admin' ? 'A' : 'U'}
                            </div>
                        </div>
                    </div>

                    <div className="flex-1 overflow-y-auto p-6 md:p-8">
                        <h2 className="text-2xl font-light text-slate-100 mb-1">{currentFolder.name}</h2>
                        
                        <div className="flex items-center gap-1 text-sm text-slate-400 mb-6 flex-wrap">
                            {currentPath.map((folder, index) => (
                                <React.Fragment key={folder.id}>
                                    {index > 0 && <ChevronRight size={14} className="mx-1" />}
                                    <span 
                                        onClick={() => handleNavigateUp(index)}
                                        className={`cursor-pointer transition-colors ${index === currentPath.length - 1 ? 'text-slate-200 font-medium' : 'hover:text-blue-400'}`}
                                    >
                                        {folder.name}
                                    </span>
                                </React.Fragment>
                            ))}
                        </div>

                        <div className="flex flex-wrap gap-4 justify-between items-center mb-6">
                            <div className="flex gap-3">
                                <button className="flex items-center gap-2 bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded-lg text-sm font-medium transition-colors shadow-lg shadow-blue-900/20">
                                    <Upload size={16} /> Upload
                                </button>
                                <button className="flex items-center gap-2 bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 px-4 py-2 rounded-lg text-sm font-medium transition-colors">
                                    <FolderPlus size={16} /> New Folder
                                </button>
                            </div>

                            <div className="flex items-center gap-3 bg-slate-800 p-1 rounded-lg border border-slate-700">
                                <button onClick={() => setViewMode('grid')} className={`p-1.5 rounded-md transition-all ${viewMode === 'grid' ? 'bg-slate-600 text-white shadow' : 'text-slate-400 hover:text-slate-200'}`}>
                                    <Grid size={18} />
                                </button>
                                <button onClick={() => setViewMode('list')} className={`p-1.5 rounded-md transition-all ${viewMode === 'list' ? 'bg-slate-600 text-white shadow' : 'text-slate-400 hover:text-slate-200'}`}>
                                    <List size={18} />
                                </button>
                            </div>
                        </div>

                        {currentFolder.name === 'Photos' ? renderPhotos() : renderFiles()}

                    </div>

                    <div className="h-14 border-t border-slate-800 bg-slate-900/80 px-6 flex items-center justify-between text-xs text-slate-400">
                        <div className="flex flex-col w-64 gap-1">
                            <div className="flex justify-between">
                                <span>Storage Used</span>
                                <span className="text-slate-200">450GB / 1TB</span>
                            </div>
                            <div className="w-full bg-slate-800 rounded-full h-1.5">
                                <div className="bg-slate-500 h-1.5 rounded-full w-[45%]"></div>
                            </div>
                        </div>
                        <div className="flex items-center gap-2">
                            <span className="w-2 h-2 rounded-full bg-green-500"></span>
                            Connection: Secure (TLS 1.3)
                        </div>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [activeRole, setActiveRole] = useState('user'); 
            const [sidebarOpen, setSidebarOpen] = useState(false);
            const [activeView, setActiveView] = useState('home'); 

            const toggleSidebar = () => setSidebarOpen(!sidebarOpen);

            useEffect(() => {
                setActiveView('home');
            }, [activeRole]);

            const getNavItems = () => {
                if (activeRole === 'admin') {
                    return [
                        { id: 'home', label: 'Home', icon: LayoutDashboard },
                        { id: 'myfiles', label: 'My Files', icon: Folder },
                        { type: 'spacer' },
                        { type: 'header', label: 'Server Management' },
                        { id: 'dashboard', label: 'Server Dashboard', icon: Server },
                        { id: 'users', label: 'User Management', icon: Users },
                        { id: 'storage', label: 'Storage & Backup', icon: HardDrive },
                        { id: 'security', label: 'Security & Logs', icon: ShieldCheck },
                    ];
                }
                return [
                    { id: 'home', label: 'Home', icon: LayoutDashboard },
                    { id: 'myfiles', label: 'My Files', icon: Folder },
                    { id: 'shared', label: 'Shared with Me', icon: Users },
                    { id: 'recent', label: 'Recent', icon: Activity },
                    { type: 'spacer' },
                    { id: 'settings', label: 'Settings', icon: Settings },
                ];
            };

            const navItems = getNavItems();

            const renderContent = () => {
                if (activeView === 'home' || activeView === 'myfiles' || activeView === 'shared') {
                    return <FileExplorer role={activeRole} />;
                }

                if (activeRole === 'admin') {
                    if (activeView === 'dashboard') return <AdminDashboard />;
                    return <div className="p-8 text-slate-400">Placeholder for {activeView}</div>;
                }
                
                return <div className="p-8 text-slate-400">Placeholder for {activeView}</div>;
            };

            return (
                <div className="flex h-screen bg-[#0f172a] text-slate-300 font-sans overflow-hidden selection:bg-blue-500/30">
                    
                    <button 
                        className="md:hidden absolute top-4 left-4 z-50 p-2 bg-slate-800 rounded-lg text-slate-200"
                        onClick={toggleSidebar}
                    >
                        {sidebarOpen ? <X size={20} /> : <Menu size={20} />}
                    </button>

                    <aside 
                        className={`
                            fixed md:relative z-40 w-64 h-full bg-[#1e293b] border-r border-slate-700 flex flex-col transition-transform duration-300 ease-in-out
                            ${sidebarOpen ? 'translate-x-0' : '-translate-x-full md:translate-x-0'}
                        `}
                    >
                        <div 
                            className="h-20 flex items-center px-6 border-b border-slate-700/50 cursor-pointer hover:bg-slate-800/50 transition-colors group"
                            onClick={() => setActiveView('home')}
                        >
                            <Cloud className="text-blue-500 mr-3 group-hover:text-blue-400 transition-colors" size={28} />
                            <span className="text-xl font-semibold text-white tracking-tight">MyCloud</span>
                        </div>

                        <nav className="flex-1 py-6 px-3 space-y-1 overflow-y-auto">
                            {navItems.map((item, idx) => {
                                if (item.type === 'spacer') {
                                    return <div key={idx} className="my-4 border-t border-slate-700/50 mx-2"></div>;
                                }
                                if (item.type === 'header') {
                                    return <div key={idx} className="px-4 py-2 text-xs font-semibold text-slate-500 uppercase tracking-wider">{item.label}</div>;
                                }
                                
                                const isActive = activeView === item.id;
                                return (
                                    <button 
                                        key={idx}
                                        onClick={() => setActiveView(item.id)}
                                        className={`
                                            w-full flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-medium transition-all
                                            ${isActive 
                                                ? 'bg-blue-600/10 text-blue-400 border-l-4 border-blue-500' 
                                                : 'text-slate-400 hover:bg-slate-800 hover:text-slate-200 border-l-4 border-transparent'}
                                        `}
                                    >
                                        <item.icon size={18} />
                                        {item.label}
                                    </button>
                                );
                            })}
                        </nav>

                        <div className="p-4 border-t border-slate-700/50 bg-slate-900/30">
                            <div className="text-xs uppercase text-slate-500 font-bold mb-3 px-2 tracking-wider">Simulate Role</div>
                            <div className="flex bg-slate-800 p-1 rounded-lg">
                                <button 
                                    onClick={() => setActiveRole('user')}
                                    className={`flex-1 py-1.5 text-xs font-medium rounded-md transition-all ${activeRole === 'user' ? 'bg-blue-600 text-white shadow-md' : 'text-slate-400 hover:text-slate-200'}`}
                                >
                                    User UI
                                </button>
                                <button 
                                    onClick={() => setActiveRole('admin')}
                                    className={`flex-1 py-1.5 text-xs font-medium rounded-md transition-all ${activeRole === 'admin' ? 'bg-blue-600 text-white shadow-md' : 'text-slate-400 hover:text-slate-200'}`}
                                >
                                    Admin IO
                                </button>
                            </div>
                        </div>

                        <div className="p-4 border-t border-slate-700/50">
                            <div className="flex items-center gap-3">
                                <div className="w-8 h-8 rounded-full bg-slate-700 flex items-center justify-center text-slate-300">
                                    {activeRole === 'admin' ? <ShieldCheck size={16} /> : <Users size={16} />}
                                </div>
                                <div className="flex-1 overflow-hidden">
                                    <div className="text-sm font-medium text-slate-200 truncate">{activeRole === 'admin' ? 'SysAdmin' : 'Jane Doe'}</div>
                                    <div className="text-xs text-slate-500 truncate">{activeRole === 'admin' ? 'Root Access' : 'Standard User'}</div>
                                </div>
                                <LogOut size={16} className="text-slate-500 cursor-pointer hover:text-slate-300" />
                            </div>
                        </div>
                    </aside>

                    <main className="flex-1 flex flex-col relative overflow-hidden bg-gradient-to-br from-[#0f172a] to-[#1e293b]">
                        {renderContent()}
                    </main>
                    
                    {sidebarOpen && (
                        <div 
                            className="fixed inset-0 bg-black/50 z-30 md:hidden backdrop-blur-sm"
                            onClick={() => setSidebarOpen(false)}
                        />
                    )}
                </div>
            );
        };

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
